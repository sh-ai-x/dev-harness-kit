  - title: PR body refs — `audit-trail` label approach (closes PR #829)
    body: |
      **The gap**: PR #829's failure was on the PR **body** (the
      developer's PR description on GitHub), not the commit message.
      A pre-push hook that only checks commit messages catches the
      **same bug class** but on a different surface. To handle the
      PR body case without breaking audit-trail preservation, the
      remote gate adopts an `audit-trail` label:

      ```
      # Remote workflow behavior
      if has_label("audit-trail"):
          # Lenient: warn on `Issue #N (closed)`, fail on `Closes #N (closed)`
          run_issue_sync(strict_for_close_keywords_only=True)
      else:
          # Default strict: fail on ANY closed ref
          run_issue_sync(strict=True)
      ```

      **How a developer uses it**: open a PR with `Issue #N (closed)`
      refs in the body for audit-trail preservation, then apply the
      `audit-trail` label before requesting review. The remote gate
      runs in lenient mode and warns (but does not fail) on the
      closed refs. The LLM judges still fire (because that's where
      provider tokens are intentionally spent), and the developer
      explains the audit trail in the PR conversation.

      **Implementation**: `tools/issue_sync.py pre-pash` (the new
      subcommand) reads `--audit-trail` flag. The remote workflow
      checks `github.event.pull_request.labels` for the label and
      passes the flag accordingly. No breaking changes to the
      default behavior.

      **Why this is a minimal patch**:
      - The existing `--lenient` flag is reused. We just add a
        workflow-side label-check to set it conditionally.
      - Existing keyword set (after adding `Issue`) is unchanged.
      - Local pre-push hook stays strict (commit message refs
        should always be live, no audit-trail rationale for commits).

