title: "Agent Behavior Evaluation — 7-dim Rubric + JSONL Trajectory"
status: design-discussion
date: 2026-07-31
tags: [agent-behavior, evaluation, rubric, trajectory, worktree-logs]
sections:
  - title: TL;DR
    body: |
      에이전트가 "의도대로 정확하게 해결했는지"를 자동으로 평가하기 위해
      **7차원 루브릭** + **worktree 로그 기반 trajectory 인프라**를 도입한다.

      **핵심 결정**:
      - **데이터 소스 = worktree 로그** (git, hooks, hand-off, eval transcript). 모두 disk 에 이미 존재
      - **결정적 70% (D1-D4) + LLM 30% (D5-D7)** — 빠르고 재현 가능한 평가
      - **PR gate = 상대 변화** (baseline 대비 diff), 절대 점수 threshold 사용 안 함
      - 신규 인프라 0, 신규 vendor 0, 신규 의존성 0

  - title: 배경 — 왜 필요한가
    body: |
      기존 `/dev-kit:evaluate` 는 **final-output rubric** 만 채점한다.
      에이전트의 *행동* 자체를 평가하지 못한다:

      1. **ROT verdict 시 원인 파악이 수동** — transcript 열어보고 재실행
      2. **회귀 분석 불가능** — harness 버전 간 행동 변화 자동 추적 없음
      3. **judge variance 디버깅 막힘** — 분산 > 0.5 일 때 judge 가 본 것 추적 어려움
      4. **비용 / 지연 가시성 없음** — 어떤 step 이 비싼지 알 수 없음

      본 proposal 은 4 가지 사각지대를 worktree 로그 = **trajectory**
      로 메운다. 새 telemetry 인프라 없이.

  - title: 핵심 아이디어 (한 문장)
    body: |
      **worktree 1개 = 작업 1건 = 평가 단위 1개**. 이미 disk 에 있는
      git/hooks/hand-off/eval-transcript 를 append-only JSON 으로
      정규화하고, 7 개 차원 점수 = **trajectory score**.

  - title: 7 차원 루브릭 (요약)
    body: |
      | # | 차원 | 무엇 | 결정성 | 가중치 |
      |---|------|------|:---:|---:|
      | D1 | **Outcome Correctness** | 의도한 결과물 (테스트, lint, eval verdict) | ✅ | 30% |
      | D2 | **Process Conformance** | 절차 준수 (commit 형식, branch, hooks firing) | ✅ | 15% |
      | D3 | **Efficiency** | 합리적 자원 (steps, retries, tokens, latency) | ✅ | 10% |
      | D4 | **Safety / Guardrails** | 안전 훅 통과 (worktree/secret/bash/tdd-guard) | ✅ | 15% |
      | D5 | **Communication Quality** | hand-off 노트 / PR description 명확성 | ⚠️ LLM | 10% |
      | D6 | **Robustness** | 에러 주입 시 graceful recovery | ⚠️ 시나리오 | 10% |
      | D7 | **Trajectory Quality** | 도구 선택 / 순서 합리성 | ⚠️ hybrid | 10% |

      **결정적 70%** 가 LLM 없이 평가 → CI 게이트로 바로 사용 가능.

  - title: 색인 (6 개 파일)
    body: |
      | # | 파일 | 주제 |
      |---|------|------|
      | 01 | [01-rubric.html](01-rubric.html) | 7 차원 루브릭 상세 (D1-D7 데이터 소스 + 추출 + 채점) |
      | 02 | [02-trajectory-infra.html](02-trajectory-infra.html) | JSONL trace + diff + dashboard 구조 |
      | 03 | [03-rollout.html](03-rollout.html) | 단계별 도입 + locked decisions |
      | 04 | [04-open-questions.html](04-open-questions.html) | 미해결 질문 (auto-calibration, batch eval, 추세) |
      | 05 | [05-meta-eval.html](05-meta-eval.html) | **Meta-Eval** (Evaluator 를 평가한다) |

  - title: 읽는 순서 (3 경로)
    body: |
      - **빠른 결정 (5분)**: [00-index](00-index.html) → [03](03-rollout.html) §Phase 0
      - **검토 (20분)**: 위 + [01](01-rubric.html) §D1-D7 + [02](02-trajectory-infra.html) §schema
      - **구현 (45분)**: 전부 + `lib/behavior_scorers/*.py` + `tools/trace_diff.py` 소스

  - title: 비목표 (Out of scope)
    body: |
      본 proposal 은 다음을 **포함하지 않는다**:

      - 외부 observability 플랫폼 도입 (자체 인프라로 충분)
      - eval case 수 확장 (현재 12 case 유지)
      - prompt engineering 작업 (judge prompt 는 별도 제안)
      - production telemetry / OpenTelemetry 통합 (필요 시 별도)
      - multi-tenant eval infra 공유 (팀 규모 10+ 시점에 별도)

  - title: 성공 지표 (3-6 개월)
    body: |
      - **CI gate** 결정적 차원 4 개 (D1-D4) 가 PR 마다 자동 평가
      - **per-dim breakdown** 항상 노출 → ROT 원인 즉시 파악
      - **회귀 자동 탐지** — 동일 spec 의 2 회 run 사이 diff 자동 알림
      - **신규 의존성 0** — `lib/` + `tools/` + `eval/` 내부 파일만 추가

  - title: 다음 단계
    body: |
      - [03-rollout.html](03-rollout.html) §Phase 0 (즉시 도입) — `lib/trace_log.py` + 결정적 scorer 4 개
      - [02-trajectory-infra.html](02-trajectory-infra.html) §schema — JSONL trace 구조
