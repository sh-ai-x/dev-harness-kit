title: Local pre-push gate migration — fix PR #829's silent sync-gate failure
status: draft
date: 2026-09-09
tags: [ci, gates, hooks, pre-push, issue-sync, workflow]
umbrella: local-pre-push-gates

sections:
  - title: One-paragraph summary
    body: |
      PR #829 was merged with `GitHub issue sync check` failing because
      the PR body referenced three closed issues (`#726`, `#397`, `#625`)
      alongside the one it closed (`#823`). The gate is deterministic
      (Python parser + `gh api`) and ran on GH Actions only — so the
      developer had no signal until after push. This proposal migrates
      every deterministic gate to a local pre-push hook (Tier A),
      leaves LLM-judge gates remote-only (Tier B), and reserves
      post-merge automation as Tier C. Net: failures surface in <10s
      on the developer's workstation, no more "rerun CI until green."

  - title: Sub-topic map
    body: |
      | File | Topic |
      |---|---|
      | [01-problem-and-context.yaml](01-problem-and-context.yaml) | PR #829 root cause + full GH Actions gate inventory (11 workflows, 6 LLM-judge gates) |
      | [02-gate-migration-matrix.yaml](02-gate-migration-matrix.yaml) | Tier A (local pre-push) vs Tier B (remote-only) vs Tier C (post-merge) decision per gate |
      | [03-implementation.yaml](03-implementation.yaml) | `hooks/pre-push.sh` design, `tools/issue_sync.py` `--lenient` flag, `tools/issue_sync.py` API-call bypass for offline mode |
