sections:
  - title: File-by-file change list
    body: |
      | File | Action | LoC | Purpose |
      |---|---|---|---|
      | `hooks/pre-push.sh` | CREATE | ~60 | Single orchestrator; only always-on stage is issue-sync. Opt-in stages (validate/lint/pytest/cache-decay) wired via config |
      | `tools/issue_sync.py` | MODIFY | +50 / -5 | Add `--lenient` flag, `--offline` flag, `--strict` (default for hook), `pre-push` subcommand |
      | `.dev-kit/local-gates.yaml.example` | CREATE | ~20 | Opt-in config template (copy to `local-gates.yaml` to enable) |
