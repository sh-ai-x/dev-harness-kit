title: "02 — JSONL Trajectory Infrastructure"
status: design-discussion
date: 2026-07-31
tags: [trajectory, jsonl, worktree-logs, diff, dashboard]
sections:
  - title: 개요
    body: |
      **모든 trajectory 데이터는 worktree 내 JSON 파일에 저장**.
      외부 telemetry 인프라 없음. 한 줄 요약:

      ```
      worktree/<task>/
      ├── .git/                         # git history (이미 존재)
      ├── hooks-output.log              # hook firing log (이미 존재)
      ├── .dev-kit/hand-off/*.md        # 단계 노트 (이미 존재)
      └── eval/transcripts/
          └── <case-id>/
              └── <UTC-timestamp>.json  # ← 본 proposal 신규
      ```

