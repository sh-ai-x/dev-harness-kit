      **Total**: 7.9 days, single developer (Phase 1: 3.0d issue-sync
      only; Phase 2: 1.7d opt-in stages; Phase 3: 0.7d branch-protection;
      rest is testing + docs).

  - title: Per-phase risk + rollback
    body: |
      | Phase | Risk | Rollback |
      |---|---|---|
      | 0 | Parser keyword change (`Issue` added to `_REF_KEYWORDS`) shifts existing behavior | Revert commit, restore `_REF_KEYWORDS` to v1.0.0 set |
      | 1 | Pre-push hook adds 30-60s to every push; developers complain | `bin/install-pre-push.sh --uninstall`; users opt out via `git push --no-verify` |
      | 2 | Linear-pr-sync `--check-only` introduces a new failure mode if Linear API is down | Continue with `continue-on-error` semantics in `tools/linear_sync.py` |
      | 3 | Branch protection change blocks PRs mid-merge | Required-checks toggle is reversible in <1 min via `gh api` |

  - title: Success metrics (post-rollout)
    body: |
      | Metric | Baseline (2026-09-09) | Target (post-Phase 3) |
      |---|---|---|
      | **Provider tokens spent on caught Tier-A failures** | $1-3 per caught failure | **$0** (push blocked pre-LLM) |
      | PRs merged with a red `issue-sync` gate | 1 (PR #829) | **0** |
      | Provider tokens spent on a successful PR (3 push iterations) | $3-9 | **$3-9** (unchanged — judges fire on green pushes) |
      | GH Actions minutes per PR (average) | 8-12 min | **8-12 min** (unchanged) |
      | Local pre-push hook install rate | 0% | **>80%** of active contributors |
      | Severity review (LLM fan-out + PR comments) location | GH Actions | **GH Actions** (unchanged — must stay) |

      **The headline metric is provider token spend on caught Tier-A
      failures, not wall-clock time.** If we save $0 of provider tokens,
      the proposal has failed — even if developer wall-clock improves
      50%.

      Track via:
      - `tools/token_efficiency_analyzer.py` — per-session provider cost
      - `gh api repos/:owner/:repo/actions/runs` — red-push rate over time
      - `tools/cost_dashboard.py` — gate-by-gate provider spend
      - `.dev-kit/.active-hooks.json` — pre-push hook install count

