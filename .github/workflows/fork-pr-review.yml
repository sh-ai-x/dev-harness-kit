name: Fork PR Review Gate

# Fork PRs never get a write-scoped GITHUB_TOKEN or an OIDC token on the
# `pull_request` trigger, no matter what `permissions:` a job declares —
# that's GitHub's platform-level anti-abuse restriction, not something a
# workflow change can lift. review.yml / maintenance.yml already skip
# their LLM-judge jobs for fork PRs on `pull_request` (see the `if:`
# conditions there) instead of failing loudly on an unobtainable OIDC
# token.
#
# This workflow is the maintainer-approval gate that unblocks review for
# a fork PR without weakening that restriction: it runs on
# `pull_request_target` (workflow file is read from the trusted `main`
# branch, not the fork, so it is safe to grant it write permissions) and
# sits behind the `fork-pr-review` GitHub Environment, which requires an
# explicit maintainer approval click in the Actions tab before the job
# runs. It never checks out the fork's code and never executes it — its
# only action is to dispatch review.yml / maintenance.yml via
# `workflow_dispatch` (a manual-trigger context, not a fork-origin
# `pull_request` event, so THAT run gets full normal permissions).
#
# Same-repo PRs (including the repo owner's own) are untouched by this
# workflow entirely — review.yml / maintenance.yml keep running fully
# automatically on `pull_request` for those, exactly as before.
#
# Why this workflow also writes commit status (not just dispatching):
# review.yml and maintenance.yml run on `pull_request`, which auto-attaches
# their job-level checks to the PR commit. When they fire via
# `workflow_dispatch` instead (this gate's path), GitHub does NOT auto-link
# the dispatched jobs to the PR commit — so the PR's "Checks" tab keeps
# showing the original pull_request run's "skipped" verdict indefinitely.
# To make the AI-judge outcome visible in the PR Checks tab, this gate
# polls the two dispatched runs and posts an aggregate `fork-pr-review/ai-judges`
# commit status (`pending` while running, `success`/`failure` after).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  gate:
    name: fork PR review (awaiting maintainer approval)
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name != github.repository &&
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    environment: fork-pr-review
    permissions:
      actions: write
      pull-requests: write
      statuses: write
    steps:
      - name: Dispatch AI review workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REVIEW_RUN="$(gh workflow run review.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" \
            --json databaseId --jq .databaseId)"
          MAINT_RUN="$(gh workflow run maintenance.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" \
            --json databaseId --jq .databaseId)"
          {
            echo "REVIEW_RUN=$REVIEW_RUN"
            echo "MAINT_RUN=$MAINT_RUN"
          } >> "$GITHUB_ENV"
          echo "Dispatched review.yml run=$REVIEW_RUN maintenance.yml run=$MAINT_RUN"

      - name: Resolve PR commit SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Resolved PR commit SHA=$SHA"

      - name: Mark PR commit as AI-review-pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state=pending \
            -f context='fork-pr-review/ai-judges' \
            -f description="AI judges dispatched (review=$REVIEW_RUN maintenance=$MAINT_RUN); awaiting verdict" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Wait for dispatched AI judges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            gh run watch "$RUN" --exit-status || true
          done

      - name: Post per-judge commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            JOBS_JSON="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/jobs")"
            for NAME in "/dev-kit:review (3-dim)" "/dev-kit:security (10-dim OWASP)" "/dev-kit:maintenance (code-sanity + docs)"; do
              CONCL="$(echo "$JOBS_JSON" | jq -r --arg n "$NAME" '.jobs[] | select(.name==$n) | .conclusion')"
              if [ -z "$CONCL" ] || [ "$CONCL" = "null" ]; then continue; fi
              case "$CONCL" in
                success)          STATE="success" ;;
                failure|timed_out) STATE="failure" ;;
                *) continue ;;  # skipped/cancelled/action_required/neutral/stale — non-blocking, don't post
              esac
              gh api "repos/${{ github.repository }}/statuses/$SHA" -X POST \
                -f state="$STATE" \
                -f context="$NAME" \
                -f description="judge job conclusion=$CONCL (run=$RUN)" \
                -f target_url="https://github.com/${{ github.repository }}/actions/runs/$RUN" >/dev/null
            done
          done

      - name: Post final AI-judge status to PR commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          if [ "$REVIEW_CONCL" = "success" ] && [ "$MAINT_CONCL" = "success" ]; then
            STATE="success"
            DESCRIPTION="AI judges passed (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          else
            STATE="failure"
            DESCRIPTION="AI judge failure (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state="$STATE" \
            -f context='fork-pr-review/ai-judges' \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Post audit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
            "Maintainer approved this fork PR for review (fork-pr-review environment). \
            Dispatched /dev-kit:review (run [$REVIEW_RUN](https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN)) \
            and /dev-kit:maintenance (run [$MAINT_RUN](https://github.com/${{ github.repository }}/actions/runs/$MAINT_RUN)) \
            via workflow_dispatch. Final: review=$REVIEW_CONCL maintenance=$MAINT_CONCL. \
            Per-judge verdict comments are posted on each dispatched run."
