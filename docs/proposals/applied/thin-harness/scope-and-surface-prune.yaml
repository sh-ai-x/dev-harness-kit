pros:
  - 'A user-scope plugin can be installed without silently imposing repository-specific edit or branch policy on every project.'
  - 'Every unconfigured checkout starts with the same thin, predictable guard state instead of a hidden main-branch exception.'
  - 'SessionStart records the effective decision, making on/off behavior inspectable and reproducible instead of implicit.'
  - 'Deleting the session monitor and duplicate model-only layers reduces install surface, prompt tokens, tests, and documentation drift.'
  - 'The retained safety and verification behavior remains deterministic and testable at the hook layer.'

cons:
  - 'Guards stay off until bootstrap receives an explicit choice, so an unconfigured main checkout is intentionally permissive.'
  - 'Bootstrap adds one setup decision; keeping it to enable/disable plus project/local scope avoids recurring session friction.'

limitations:
  - 'This changes repository guard activation, not plugin discovery; user-scope installation may load the plugin but cannot turn guards on.'
  - 'A later proposal may add a main-branch-specific default or prompt; this proposal deliberately keeps one explicit bootstrap choice.'

sections:
  - title: Decision and scope
    body: |
      Adopt this as a two-phase cleanup. Phase 1 changes guard activation and
      removes the session-monitor feature. Phase 2 removes only skills,
      docs, and tests that meet the deletion rubric below. The implementation
      must not weaken catastrophic command blocking, secret scanning, prompt
      injection scanning, review/security checks, or completion verification.

      The proposal is intentionally about policy and surface area. It does
      not add a replacement dashboard, background monitor, MCP layer, or a
      new model orchestration protocol.

  - title: Guard policy and scope precedence
    body: |
      Add one setting: `DEV_KIT_GUARDS=on|off`.

      Resolution order is:

      ```text
      shell DEV_KIT_GUARDS
        > .claude/settings.local.json env.DEV_KIT_GUARDS
        > .claude/settings.json env.DEV_KIT_GUARDS
        > default: off
      ```

      User-scope settings are not read for this key. They may enable the
      plugin so commands resolve, but they cannot activate repository guards.
      Invalid values are ignored with one compact diagnostic and resolve to
      the next layer. Plugin installation never writes this key. On the first
      `/dev-kit:bootstrap`, ask once:

      ```text
      Enable worktree, git, and TDD guards for this repo? [y/N]
      If yes, save it to project scope or local scope? [project/local]
      ```

      `N` leaves the effective default `off`. `Y + project` writes
      `DEV_KIT_GUARDS=on` to `.claude/settings.json`; `Y + local` writes it
      to `.claude/settings.local.json`. Existing settings are not silently
      overwritten. Re-running bootstrap reports the current value and keeps
      SessionStart prompt-free.

      `on` enables worktree, git, and tdd guards in every session. `off`
      disables those three session-policy checks. Existing catastrophic and
      ask-tier hooks keep their own contracts and are not silently disabled by
      this setting.

  - title: SessionStart records policy only
    body: |
      `session-start-check.sh` classifies the checkout before emitting its
      context. The state writer records `policy`, `policy_source`,
      `branch_class`, and the effective guard map in
      `.dev-kit/guard-mode.session.json`.

      With no explicit project/local/shell policy, every checkout resolves to
      `off`:

      | Checkout | worktree guard | git guard | tdd guard | reason |
      |---|---:|---:|---:|---|
      | `main` | off | off | off | bootstrap-only choice; SessionStart stays prompt-free |
      | feature worktree | off | off | off | default thin session |
      | detached/outside project | off | off | off | no repository policy |

      An explicit `DEV_KIT_GUARDS=on` changes every row to on. An explicit
      `off` keeps every row off. The one-line SessionStart context reports
      the resolved policy and branch class. The hook never asks a question or
      blocks SessionStart; it writes the decision and leaves enforcement to
      the individual PreToolUse hooks. Bootstrap owns the one-time setup
      question and the project/local write.

  - title: Deletion rubric and candidates
    body: |
      A surface is removable only when all four checks pass:

      1. no runtime/import/manifest consumer remains;
      2. its behavior is either duplicated by a deterministic hook or has no
         current product value;
      3. a replacement command/path is documented when users need continuity;
      4. focused tests prove the absence or the retained contract.

      First-wave deletion: the session-monitor code, its fixtures, tests,
      screenshot, ownership entry, and observability/workflow references.
      The eval-session judge remains; only the monitor handshake assertions
      are removed or rewritten.

      Second-wave candidate: model-only `build-tdd`, `build-verify`, and
      `build-refactor` skills. Their deterministic enforcement already lives
      in hooks and their parent stages. Candidate-only, pending the usage and
      import scan: `valuate`, `interview`, `learn`, `status`, and
      `prune-propose` must not be deleted just because their prose is long;
      each needs a separate evidence-backed decision because it owns a
      distinct artifact or operator workflow.

  - title: Context and token budget
    body: |
      Active SKILL.md files should contain only: trigger, inputs, outputs,
      state transition, hard invariant, and next hand-off. Detailed rationale
      belongs in the linked SSOT docs and proposal, not in every skill.

      Measure before and after with the existing token analyzer and a stable
      file list. Acceptance target: at least 20% fewer instruction tokens in
      active skill files plus zero loss of command names, required files,
      hook names, or verification commands. Hook output is capped at one
      compact SessionStart context line; verbose diagnostics remain on disk
      or behind explicit status commands.

  - title: Implementation and verification order
    body: |
      1. Add the resolver/state truth table and bootstrap prompt tests first;
         the no-prompt SessionStart and all-off default are part of the
         contract.
      2. Wire the policy into worktree/git/tdd guards; run their focused hook
         suites.
      3. Remove session-monitor files and references; run import, README,
         documentation, and eval-session tests.
      4. Run the skill usage/import scan, delete only approved duplicate
         skills, and regenerate both skill indexes.
      5. Render this proposal, run the full test suite, and update this YAML's
         `status`, `started`, `shipped`, and `modifications` only from the
         resulting diff and evidence.

      Required checks include `pytest tests/test_guard_policy.py`, the guard
      hook suites, a repository-wide `git grep` proving no live
      `session_monitor` reference remains, the skill registry audit, and a
      token analyzer report with the before/after file set.

  - title: Proposal lifecycle updates
    body: |
      Existing proposal records should be updated only when their design is
      demonstrably shipped. In particular, an implemented skill or hook must
      move from `reviewing/` or `pending/` to `applied/` with `started` and
      `shipped` dates and a short `modifications` block when the code differs
      from the design. Removing a feature also updates its proposal to
      `superseded` or `applied-with-changes`; leaving stale `draft` text that
      describes shipped behavior is not acceptable.

      The user accepted the thin default. The implementation is applied with
      the deletions and documentation substitutions recorded in
      `modifications`; only a main-branch-specific default or recurring
      SessionStart question remains deferred.
