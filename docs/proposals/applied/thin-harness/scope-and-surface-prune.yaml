title: Scoped guard defaults and thin-harness surface prune
status: applied-with-changes
date: 2026-09-17
started: 2026-09-17
shipped: 2026-09-18
modifications: |
  Implemented in the thin-harness worktree on 2026-09-18. The guard policy
  is now default-off for every checkout, with shell > local > project
  precedence and a prompt-free SessionStart state record. Bootstrap owns the
  one-time project/local opt-in question. The session-monitor surface and its
  references are deleted. The three duplicate model-only build skills, their
  docs, and their trigger eval fixtures are deleted; active parent skills and
  indexes were rewritten to retain only the deterministic contracts. The
  dated full-architecture export and screenshot were also removed because
  they described the deleted skill graph. The executable code-viz
  implementation moved out of the active skill into `tools/code_viz.py`;
  bootstrap, proposal, and babysit-pr skill bodies were reduced to contracts
  with detailed references lazy-loaded from `docs/skills/`. The
  main-branch-specific prompt is intentionally still deferred.
tags: [scope, hooks, worktree, token-efficiency, dead-code, skills, installation]

before:
  summary: |
    Plugin loading and guard activation are coupled too loosely. A user-scope
    plugin can be present before a project has made a guard decision, while
    SessionStart resets the session guard file to on. The current resolver
    has mode precedence but no equivalent project/local guard policy, and
    git-guard has no session policy check. The repository also ships a
    standalone session-monitor surface and several model-only skills whose
    rules duplicate deterministic hooks or the parent stage skills.
  evidence:
    - '`hooks/lib/mode-resolve.sh:8-13,78-142` resolves shell/project/local mode but has no guard-policy layer and defaults an enabled project to full.'
    - '`hooks/session-start-guard-mode-reset.sh:4-17` resets the session guards at every SessionStart; `lib/guard_mode_state.py:54-63` defaults tdd/worktree to on.'
    - '`hooks/worktree-guard.sh:46-49` and `hooks/tdd-guard.sh:10-11` already contain deterministic enforcement; `hooks/git-guard.sh:1-8` has no equivalent session-policy read.'
    - '`hooks/session-start-check.sh:123-128` emits a main-checkout reminder but does not record an explicit on/off decision for the guards.'
    - '`tools/session_monitor.py` plus six split helpers, fixtures, `tests/test_session_monitor.py`, and two observability docs form a standalone cross-terminal session picker.'
    - '`skills/build-tdd`, `skills/build-verify`, and `skills/build-refactor` are model-only sub-skills while `tdd-guard`, `stop-verify`, `prune`, and the parent `build`/`refactor` skills carry the executable contracts.'

after:
  summary: |
    Separate plugin discovery from guard activation. A compact project/local
    setting controls guards; user-scope plugin installation never enables
    repository safety policy by itself. SessionStart resolves the policy,
    detects main versus worktree, writes the effective decision to the
    session state, and emits one short context line. The default is off for
    every checkout, including main. SessionStart does not ask guard-by-guard
    questions and does not auto-enable a main-branch exception. During the
    first `/dev-kit:bootstrap`, the operator is asked once whether guards
    should be enabled and whether the choice belongs to shared project scope
    or this checkout's local scope.

    Remove session-monitor and other proven-dead or duplicate surfaces, then
    trim surviving skill prose to invocation, inputs/outputs, invariants, and
    links to the SSOT. Keep deterministic safety, secret, injection,
    verification, review, and security hooks.
