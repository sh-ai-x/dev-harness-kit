name: harness-contract-test (daily)

# Auto-populate ``lib.harness_effectiveness.stability.contract_test_pass_rate``
# evidence. The reducer's stability submetric waits for ``contract.test``
# events (issue #663); no in-tree emitter exists. This workflow runs the
# hermetic harness test suite once a day and emits one ``contract.test``
# event to ``.dev-kit/trace/events.jsonl`` via
# ``tools/contract_test_emitter.py``.
#
# Why a separate workflow (not folded into review.yml or maintenance.yml):
#   - review.yml fires only on ``pull_request`` events (line 32–34) and
#     does not accumulate corpus in a single worktree — each PR run is
#     ephemeral, so the contract_test_pass_rate denominator never grows.
#   - A daily schedule gives the operator a monotonic, predictable
#     ``contract_test_pass_rate`` that converges toward statistical
#     meaningfulness after ~7 days.
#   - Adding a job to review.yml would extend its 5+ job budget; this
#     cron is single-purpose and runs in <10 s.
#
# Why also emit from the smoke probe (lib/smoke_probe.py) at session start:
#   - The first-pass chain (``write.observed`` → ``verify.passed``) gets
#     populated per-session via lib/smoke_probe.run().
#   - The contract_test_pass_rate is populated by THIS cron (one canonical
#     pass per day) so the metric has a stable per-day denominator.
#
# Verdict contract:
#   - All hermetic tests pass → exit 0, contract.test event with
#     outcome="passed".
#   - Any test fails → exit 1, contract.test event with
#     outcome="failed". The reducer's contract_test_pass_rate numerator
#     stays at zero until CI is green again, surfacing the breakage
#     honestly.
#
# Bypass for emergencies: there is no --no-verify equivalent. Fix the
# flagged test in a follow-up commit; the maintainer cannot bypass
# branch protection.

on:
  schedule:
    # 06:00 UTC daily — outside US/EU work hours to minimize local
    # trace-event pollution when developers share a worktree with cron.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Defensive backstop: never run two cron invocations concurrently on the
# same ref so the trace log doesn't accumulate a torn pair of contract.test
# events with the same run_id but different outcomes.
concurrency:
  group: contract-test-cron
  cancel-in-progress: false

jobs:
  contract_test:
    name: Emit contract.test event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69b951a6dfb06884406a872d550d33c5e8e # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install pytest
          fi

      - name: Run hermetic contract tests and emit contract.test event
        env:
          DEV_KIT_AGENT: ci-cron
          DEV_KIT_PROVIDER: github-actions
          DEV_KIT_RUN_ID: ci:${{ github.run_id }}
        run: |
          set -e
          python tools/contract_test_emitter.py \
            --root . \
            --run-id "ci:${{ github.run_id }}" \
            --output .dev-kit/trace/measurement/contract-test.out

      - name: Print emitted event summary
        if: always()
        run: |
          echo "Last 3 events in events.jsonl:"
          tail -3 .dev-kit/trace/events.jsonl | python3 -c "
import json, sys
for line in sys.stdin:
    try:
        e = json.loads(line)
        print(f\"  {e.get('event_type'):20s} subject={e.get('subject_id'):30s} outcome={e.get('outcome')}\")
    except Exception:
        pass
"