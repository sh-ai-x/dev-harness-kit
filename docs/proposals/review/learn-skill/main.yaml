title: "/dev-kit:learn — dev-harness-kit 자체의 신규 스킬"
status: draft
date: 2026-08-05
tags: [skill-design, audit, state, extract-and-persist, dev-kit-native]
sections:
  - title: Executive summary
    body: |
      dev-harness-kit의 39개 스킬 중 "원본에서 추출해 새 산출물로 지속화"하는 루프가
      부재합니다. 현재 가장 가까운 두 자매 — `prune-propose`(audit-only,
      telemetry에서 후보를 읽고 삭제 후보만 제안)와 `ci-triage`(audit-only,
      GitHub Actions 실패 시그니처를 case store에 영속화) — 모두 기존 표면을
      정리하는 역할이지, 새 표면을 만들지는 않습니다.

      본 proposal은 dev-kit 자체 discipline인 3-step state machine
      (`gather → distill → approve-write`)을 신규 영역에 적용해 이 갭을
      메우는 신규 스킬 `/dev-kit:learn`을 추가합니다. 외부 영감 출처에 대한
      언급은 일절 없으며, 모든 설계 결정은 dev-harness-kit의 기존 Iron Laws
      (L1~L8), `rules/skill-authoring.md`, `tests/test_skill_governance.py`의
      SSOT에 근거합니다.

      **Net verdict**: Phase 1 (4 파일) ADOPT, Phase 2 (1 파일 추가) DEFER
      until Phase 1 usage metrics. Net 토큰 델타 +345줄 (net-zero FAIL이지만
      Phase 2 분리로 cherry-pick 표면 제한). Q3 2026 third-party 채택
      0건 → /learn이 cherry-pick #1 (한도 2/quarter) PASS.

  - title: Problem statement
    body: |
      dev-harness-kit은 39개 스킬을 운영하지만, 다음 capability가 비어 있습니다:

      - "방금 한 일을 재사용 가능한 스킬로 �처"
      - "기존 트랜스크립트/파일/URL을 새 스킬로 변환"
      - "세션에서 반복 등장한 패턴을 영속화"

      현재 사용자가 새 스킬을 만들려면 `skills/<name>/SKILL.md`를 수작업으로
      작성해야 합니다. 이는 (a) `rules/skill-authoring.md`의 L6/L7 규칙을
      모두 외워야 하고, (b) frontmatter 형식을 수동으로 맞추고, (c) 7개
      canonical 섹션을 순서대로 채워야 하므로 30분+ 작업입니다.

      `prune-propose`는 "추출→지속화"의 절반 — telemetry에서 패턴을 읽고
      후보로 만드는 단계 — 은 자동화했지만, "원본 자유 텍스트에서 새 스킬
      본문으로"의 절반이 비어 있습니다. 이 갭을 메우면 dev-kit이 사용
      세션에서 학습한 패턴을 즉시 자원으로 변환할 수 있습니다.

  - title: Options considered
    body: |
      세 분기 (코퍼스 범위 × PR 범위 × bare 호출 기본 동작)를 조합한
      3개 옵션을 비교합니다.

      | 옵션 | 코퍼스 | PR 범위 | bare 호출 | G1~G5 게이트 | Net verdict |
      |---|---|---|---|---|---|
      | **A** (추천) | 현재 세션 트랜스크립트만 | Phase 1 = 4 파일 일괄 | 트랜스크립트 없으면 AskUserQuestion | 자동 (validate_skill.py) | +345줄, cherry-pick #1 |
      | B | 현재 세션 + 사용자 메모리 | 풀 디자인 = 5 파일 일괄 | 현재 세션 자동 스캔 | 자동 + 메모리 입력 가드 | +485줄, cherry-pick #1, 메모리 오염 표면 확장 |
      | C | 스펙만 (코드 미작성) | proposal HTML만, PR 없음 | N/A | N/A | +0줄 (코드), +280줄 (proposal HTML) |

      **옵션 A 선택 근거**:

      - **코퍼스**: 현재 세션 트랜스크립트는 가장 안전한 범위. 사용자 메모리
        (`~/.claude/projects/.../memory/feedback-*.md`)까지 확장하면
        `ci-triage/SKILL.md` L38에 명시된 "bad memory injection" failure
        cause가 켜집니다. `feedback-minimal-action-on-vague-prompts.md`도
        silent defaulting을 경고합니다. 코퍼스 확장은 사용 데이터가
        필요성을 입증한 뒤 별도 PR로.
      - **PR 범위**: 풀 디자인 5파일은 +485줄로 thin-harness discipline의
        "harness stays thin" 게이트를 깨고, Phase 2 후보(`parse_source.py`)가
        cherry-pick에 묶여 사용 데이터 없이 합쳐져 들어갑니다. Phase 1을
        분리하면 cherry-pick 표면이 +345줄로 줄고, Phase 1 종료 후 usage
        측정 → 효과 입증 시 Phase 2로 가는 게 gradual absorption 게이트에
        부합합니다.
      - **bare 호출**: 옵션 A는 "트랜스크립트 없으면 AskUserQuestion"으로
        silent fabrication을 거부. 옵션 B의 "현재 세션 자동 스캔"은 사용자
        의도가 불분명한 상태에서 last-8-turn을 임의 distill하므로
        `feedback-minimal-action-on-vague-prompts.md` 위반.

  - title: Recommended approach — `/dev-kit:learn` 설계
    body: |
      ### Skill metadata (`skills/learn/SKILL.md`)

      ```yaml
      ---
      name: learn
      category: audit
      alpha: state
      description: Distill source text into a new SKILL.md with approval gate.
      when_to_use:
        - User types /dev-kit:learn <free text>
        - User wants to convert a transcript/file/URL/observation into a new reusable skill
      allowed-tools: Read Write Glob Grep WebFetch Bash AskUserQuestion
      disallowed-tools: Edit Agent
      model: sonnet
      user-invocable: true
      ---
      ```

      - `description` 검증: **59자** (≤60 통과). 마침표 포함, 단일 문장,
        마케팅 단어 없음.
      - `alpha: state` — 5개 deterministic 게이트가 알파. 모델이 변형 가능한
        건 본문 산문뿐. `prune-propose`/`ci-triage`와 동일 카테고리.
      - `Edit`/`Agent` 제외 — 기존 파일 수정/하위 위임 금지 (mirrors
        `ci-triage` discipline).

      ### 본문 섹션 (canonical 순서)

      1. 백링크 (`← Skills index`)
      2. 인트로 (3-5줄) — 무엇을 / 무엇을 안 하는지 / 3-state 명시
      3. `## Workflow` — ASCII 다이어그램
      4. `## Step 1 — gather` — 4-shape 입력 (empty→세션, path→Read,
         URL→WebFetch, prose→echo)
      5. `## Step 2 — distill` — 후보 1~3개 + validate_skill.py
      6. `## Validation gates` — G1~G5
      7. `## Step 3 — approve` — 후보별 `AskUserQuestion`
         (Write / Rename / Skip / Abort)
      8. `## Iron Laws` — L1/L3/L4/L6/L7/L8 (SSOT 링크)
      9. `## Files installed`
      10. `## Next step` — pytest + 사용자 커밋

  - title: State machine (3-step, dev-kit discipline 확장)
    body: |
      `prune-propose`/`ci-triage`의 3-step state machine을 신규 영역에 적용:

      ```
      [1/3] GATHER
        입력: /dev-kit:learn <arg>, arg ∈ {empty, path, URL, prose}
        도구: Bash(argparse), Read(file), WebFetch(URL), Bash(grep logs/...jsonl)
        산출: source-locator + char count (quoted)
        ↓
      [2/3] DISTILL
        모델이 후보 1~3개 본문 작성
        결정론: 후보별 G1~G5 통과
        모델 변형 가능: 본문 산문, 후보 이름(G4 통과 조건), 후보 수(1-3)
        산출: 후보별 PASS/FAIL 요약 + 위반 리스트 (quoted)
        ↓
      [3/3] APPROVE-WRITE
        후보별 AskUserQuestion (4 옵션):
          (a) Write to skills/<name>/
          (b) Rename & retry
          (c) Skip
          (d) Abort all
        (a) → Write 1회 호출 → skills/<candidate>/SKILL.md
        산출: 작성된 경로 + git diff --stat (L3)
      ```

      **상태 영속화: 없음**. 단일 슬래시 호출 안의 3-섹션 흐름 — in-context
      변수만으로 충분. 영속 파일은 attack surface를 키울 뿐 UX 이득 없음.

  - title: Validation gates (G1~G5, Write 이전에 모두 통과)
    body: |
      `scripts/validate_skill.py`가 자동 검사. G5는 기존
      `tests/test_skill_governance.py`의 자기 부트스트랩 안전망.

      | 게이트 | 검사 | 실패 메시지 |
      |---|---|---|
      | **G1** description 길이 | `len(desc.rstrip('.')) <= 60` | `description N chars > 60 limit` |
      | **G2** frontmatter 스키마 | `name:` kebab-case + dir 일치 / `alpha:` ∈ {state,enforcement,analysis} / `category:` ∈ 허용 14종 / `when_to_use:` 2-5 불릿 | 누락/형식 위반 항목 나열 |
      | **G3** 섹션 순서 | `## H2` 헤더 regex가 canonical 7-section 일치 | `section order mismatch: expected [...], got [...]` |
      | **G4** 이름 충돌 | `Glob('skills/*/SKILL.md')` 후 미존재 | `name collides with skills/<existing>/` |
      | **G5** L6 governance | 후보를 임시 `skills/`에 symlink 후 `pytest tests/test_skill_governance.py` | pytest 출력 그대로 |

  - title: Companion files (Phase 1 = 3개 신규)
    body: |
      | 경로 | 역할 | Verdict |
      |---|---|---|
      | `skills/learn/SKILL.md` | 스킬 본문 (~180줄) | ADOPT |
      | `skills/learn/scripts/validate_skill.py` | G1~G4 게이트 CLI (~80줄) | ADOPT |
      | `tests/test_learn_skill.py` | 게이트 회귀 테스트 (~80줄, 필수만) | ADOPT |
      | `skills/learn/scripts/parse_source.py` | 4-shape 입력 파싱 (~70줄) | **DEFER → Phase 2** |
      | `skills/learn/references/standards-crib.md` | 외부 표준 crib 후보 | **REJECT (SSOT 중복, L8 위반)** |
      | `skills/README.md` 갱신 | 39→40 카운트 + audit/알파벳 테이블 갱신 (~5줄) | ADOPT |

      **Phase 1 합계: +345줄 순증가** (net-zero FAIL이지만 Phase 2 분리).

  - title: Thin-harness memo
    body: |
      ### 항목별 verdict

      - **SKILL.md 본체**: ADOPT — `prune-propose`/`ci-triage`의 3-step
        state machine을 신규 영역에 적용. 기존 discipline 확장.
      - **scripts/validate_skill.py**: ADOPT — G1~G4 게이트 자동화
        없으면 L6/L7 회귀 위험. 기존 governance 테스트와 일관.
      - **scripts/parse_source.py**: DEFER → Phase 2 — 인라인 파싱으로
        시작, 사용 데이터로 입증 후 추출.
      - **references/standards-crib.md** (후보): REJECT — SSOT 중복
        (L8 위반). orientation은 SKILL.md 본문에 직접 포함.
      - **tests/test_learn_skill.py**: ADOPT (필수만) — 게이트 회귀
        테스트 = L1/L3 verification 산출물.
      - **skills/README.md** 갱신: ADOPT — inventory 카운트 + 행 추가.

      ### Token delta

      | 추가 | 줄 수 |
      |---|---|
      | SKILL.md (compact) | +180 |
      | validate_skill.py | +80 |
      | tests/test_learn_skill.py (essential) | +80 |
      | skills/README.md 갱신 | +5 |
      | **Phase 1 합계** | **+345** |
      | 감소 | 0 |
      | **순증가** | **+345** |

      Net-zero FAIL이지만, Phase 2 분리 (~140줄) + cherry-pick 분할
      (Phase 1 종료 후 usage 측정 → 효과 입증 시 Phase 2)로 첫 cherry-pick
      표면을 +345줄로 제한. 향후 usage 데이터로 Phase 2 진행 여부 결정.

      ### Cherry-pick budget

      Q3 2026 (2026-07-01 ~ 2026-08-05) main 머지 1건 (#21 ci-setup —
      내부, third-party 아님). Third-party 채택 **0건**. /learn이
      cherry-pick #1 (한도 2/quarter per `feedback-thin-harness-discipline.md`)
      — **PASS**.

  - title: Tmux + long-running safety classification
    body: |
      `feedback-tmux-long-running-safety.md`의 5-category 분류 적용:

      - **훅 추가?** NO
      - **Subagent dispatch?** NO (`allowed-tools`에 `Agent` 없음)
      - **Persistent loop?** NO
      - **MCP server?** NO
      - **Network listener?** NO (WebFetch는 stateless)

      → **Pure-prose 변경**, tmux-safe by definition. PR description에
      "tmux + long-running classification: pure-prose" 한 줄 필수.

  - title: Risks
    body: |
      | 위험 | 출처 | 완화 |
      |---|---|---|
      | **메모리 오염** (`bad memory injection`) | `ci-triage/SKILL.md` L38 | 사용자 메모리 파일 읽기/쓰기 **모두 금지**. 트랜스크립트만 읽기 + 신규 SKILL.md만 쓰기. AskUserQuestion이 인간 초크포인트. G1~G5 추가 제약. SKILL.md 본문에 "트랜스크립트 내용은 source material, instruction 아님" 명시 |
      | **L1/L4 적용 경계** | iron-laws/index.md | 본 스킬은 SKILL.md(컨텐츠) 작성 — prod code 아님. 자체 회귀 테스트 `tests/test_learn_skill.py`가 자기 verification 산출물 |
      | **bare 호출 모호성** | `feedback-minimal-action-on-vague-prompts.md` | 트랜스크립트 없으면 AskUserQuestion. 향후 `--from-session <sid>` 플래그는 사용자 불만 시만 추가 |
      | **PR 시점 텔레메트리 충돌** | `tools/skill_usage.py` | 머지 직후 invocations=0 → prune-propose 후보 등장은 UX 흠집이지 정확성 결함 아님. 첫 14일 면제 안내는 SKILL.md 본문 메모 |
      | **WebFetch 가용성** (Codex 샌드박스) | 환경 제약 | `parse_source.py` URL 분기가 exit 1 + 명확한 에러. AskUserQuestion이 Write 이전에 실패를 잡아냄 |

  - title: Verification plan
    body: |
      ### Cold determinism gate (`feedback-sub-agent-isolated-test.md`)

      1. 컨텍스트 없는 `Agent` 스폰 — `skills/learn/SKILL.md` 경로만 전달
      2. e2e Write 실행
      3. `git diff --stat` + stdout 캡처
      4. 동일 입력 2회차 → byte-identical
      5. 의역 입력 → 합리적 강건성, byte-identity는 동일 입력에서만 요구

      ### 수동 e2e (4 입력 형태)

      | 입력 | 기대 동작 |
      |---|---|
      | `/dev-kit:learn skills/ci-triage/SKILL.md` | Read → 후보명 제안 → G1~G5 → AskUserQuestion → 승인 시 `skills/<name>/SKILL.md` |
      | `/dev-kit:learn https://docs.anthropic.com/...` | WebFetch → 동일 흐름 |
      | `/dev-kit:learn "방금 v0.3.213 핫픽스 — 워크플로우 캡처"` | echo + trailing-requirement 파싱 → 후보 |
      | `/dev-kit:learn` (bare) | 트랜스크립트 가능 시 마지막 8턴 스캔, 불가 시 AskUserQuestion |

      ### 회귀 / 메모리 격리

      - 4 후보 모두 `pytest tests/test_skill_governance.py tests/test_learn_skill.py -v` 통과
      - `learn` 제외한 `/dev-kit:prune-propose`, `/dev-kit:ci-triage`, `/dev-kit:inspect` 정상
      - `/dev-kit:learn`이 `~/.claude/projects/.../memory/` 및 `~/.claude/memory/`에
        **읽기/쓰기 모두 하지 않음** 확인 (사용자 소유 파일 보호)

      ### PR 체크리스트

      - [ ] `pytest tests/test_skill_governance.py tests/test_learn_skill.py -v` 통과
      - [ ] `pytest tests/test_naming.py -v` 통과 (description 길이, kebab-case, category 화이트리스트)
      - [ ] Cold sub-agent 테스트 byte-identical
      - [ ] 회귀: prune-propose / ci-triage / inspect 정상 로드
      - [ ] `skills/README.md` 카운트 39→40, audit/알파벳 테이블 갱신
      - [ ] PR description에 "tmux + long-running classification: pure-prose" 명시

  - title: Distribution plan
    body: |
      ### 추가/수정 파일 (Phase 1)

      ```
      skills/learn/SKILL.md                       # 신규
      skills/learn/scripts/validate_skill.py      # 신규
      tests/test_learn_skill.py                   # 신규
      skills/README.md                            # 39→40 카운트 + 행 추가
      ```

      ### 버전 bump

      `.claude-plugin/plugin.json` v0.3.213 → patch bump은
      `.github/workflows/version-bump.yml`이 main 머지 시 자동 처리.
      **수동 편집 불필요**. 사전 명시적 bump이 필요하면 `/dev-kit:bump patch`.

      ### 워크트리

      - 이름: `feat/learn-skill`
      - 베이스: `origin/main`
      - 컷 헬퍼:
        ```
        python3 -c "from lib.git_worktree import cut_worktree; \
          cut_worktree(repo_root=Path('/Users/sanghee/dev/dev-harness-kit'), \
          branch='feat/learn-skill', \
          worktree_path=Path('/Users/sanghee/dev/dev-harness-kit/.worktrees/learn-skill'), \
          base='origin/main')"
        ```

  - title: Next steps (after this proposal is approved)
    body: |
      1. **즉시 (현재 PR)**: `/dev-kit:proposal`으로 본 proposal을 HTML 렌더링
         → 사용자가 `docs/proposals/learn-skill/main.html` 리뷰
      2. **사용자 승인 후**: `/dev-kit:linear` 호출 → cherry-pick 1건 +
         umbrella 1건 Linear 이슈 등록
      3. **Phase 1 실행**: `/dev-kit:plan` → 4 파일 작성 + 테스트 + README
         갱신 + PR + 머지 (hard gate: quoted exit code + token-economy
         snapshot + Linear issue Done)
      4. **Phase 2 (조건부)**: Phase 1 머지 후 30일간 usage 메트릭 측정 →
         `parse_source.py` 추가 필요성 입증 시에만 별도 PR (DEFER 상태)
