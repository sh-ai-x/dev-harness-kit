[scanner]
profile = "public-marketplace"

# Paths ignored from the plugin-scanner scan. Each entry is an fnmatch glob
# against a finding's filePath (relative to plugin_dir = ".").
#
#   tests/**            : pytest fixtures + canned secrets used in tests/test_*_*.py
#   skills/review/fixtures/** : intended-bad-code samples the review scanner must detect
#   skills/log/scripts/lib.sh : rejection-advice comments mention `curl | sh`; the
#                              helper never executes downloaded payloads
#   lib/render_report_html.py, lib/llm_judge.py : these files reference the `eval`
#                              subsystem as project terminology in docstrings; the
#                              regex heuristic \beval\s*\( in upstream
#                              checks/code_quality.py matches every docstring hit.
#                              Cannot fix in upstream; scope the scan instead.
#   templates/ci/.github/workflows/review.yml : embedded `${{ secrets.* }}` GitHub
#                              Actions expressions — template syntax, not literals.
#   .env.example        : example env values use obvious substitution tokens
#                              (`replace_with_<provider>_key`,
#                              `replace_with_your_personal_access_token`) — no
#                              real secret material present.
#   bin/review-local.sh : the regex matches `API_KEY="$(read_provider_api_key)"`
#                              as if the literal assignment were a leaked secret;
#                              the value is the output of a function call.
#   .plugin-scanner.toml : the descriptive comments above mention the literal
#                              "secret-shaped" tokens the scanner regex was built
#                              to flag; scanning the policy file itself cannot
#                              improve signal.
ignore_paths = [
  "tests/**",
  "skills/review/fixtures/**",
  "skills/log/scripts/lib.sh",
  "lib/render_report_html.py",
  "lib/llm_judge.py",
  "templates/ci/.github/workflows/review.yml",
  ".env.example",
  "bin/review-local.sh",
  ".plugin-scanner.toml",
]
