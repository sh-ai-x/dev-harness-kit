name: Fork PR Review Gate

# Fork PRs never get a write-scoped GITHUB_TOKEN or an OIDC token on the
# `pull_request` trigger, no matter what `permissions:` a job declares —
# that's GitHub's platform-level anti-abuse restriction, not something a
# workflow change can lift. review.yml / maintenance.yml already skip
# their LLM-judge jobs for fork PRs on `pull_request` (see the `if:`
# conditions there) instead of failing loudly on an unobtainable OIDC
# token.
#
# Dispatched-run workaround (2026-08):
# `anthropics/claude-code-action@v1` (the action review.yml /
# maintenance.yml use on `pull_request` runs) silently no-ops on
# `workflow_dispatch` events: agent mode writes only `claude-prompt.txt`
# (no `claude-user-request.txt`), so the SDK treats the slash command
# as literal text. Combined with the `isEntityContext()` gate that
# disables `mcp__github_inline_comment__create_inline_comment` on
# dispatch, the dispatched run exits with `num_turns: 0, duration_ms:
# 21, is_error: false` — green but no review comments posted. Audit
# logs record `verdict=MISSING`. Observed against PRs #682 / #687.
# Upstream issues: anthropics/claude-code-action#635 + #1644.
#
# The fix lives in the dispatched workflows themselves, not in this
# gate: each judge branch (review / security / maintenance) has a new
# `bin/ci-claude-p.sh <skill> <pr_number>` step with
# `if: github.event_name == 'workflow_dispatch' && ...` that invokes
# `claude -p` directly. The existing claude-code-action step's `if:`
# was tightened to `&& github.event_name == 'pull_request'` so the
# broken path is skipped on dispatch but still runs for same-repo PRs.
# This gate itself is INTENTIONALLY unchanged: it still gates on the
# `fork-pr-review` Environment (manual approval required), still
# dispatches review.yml / maintenance.yml via `workflow_dispatch`, and
# still writes the aggregate `fork-pr-review/ai-judges` commit status.
# Only the downstream workflows' judge steps changed.
# Pin tests: tests/test_dispatched_run_uses_claude_p.py +
# tests/test_ci_claude_p_sh.py.
#
# This workflow is the fallback maintainer-approval gate for untrusted fork
# PRs without weakening that restriction: it runs on
# `pull_request_target` (workflow file is read from the trusted `main`
# branch, not the fork, so it is safe to grant it write permissions) and
# sits behind the `fork-pr-review` GitHub Environment, which requires an
# explicit maintainer approval click in the Actions tab before the job
# runs. It never checks out the fork's code and never executes it — its
# only action is to dispatch review.yml / maintenance.yml via
# `workflow_dispatch` (a manual-trigger context, not a fork-origin
# `pull_request` event, so THAT run gets full normal permissions).
#
# Trusted maintainer-authored fork PRs (OWNER/MEMBER/COLLABORATOR) bypass this
# fallback gate and run immediately through `pull_request_target` in
# review.yml / maintenance.yml. Unknown fork authors still require the
# explicit environment approval below. Same-repo PRs remain on the normal
# `pull_request` path.
#
# Why this workflow also writes commit status (not just dispatching):
# review.yml and maintenance.yml run on `pull_request`, which auto-attaches
# their job-level checks to the PR commit. When they fire via
# `workflow_dispatch` instead (this gate's path), GitHub does NOT auto-link
# the dispatched jobs to the PR commit — so the PR's "Checks" tab keeps
# showing the original pull_request run's "skipped" verdict indefinitely.
# To make the AI-judge outcome visible in the PR Checks tab, this gate
# polls the two dispatched runs and posts an aggregate `fork-pr-review/ai-judges`
# commit status (`pending` while running, `success`/`failure` after).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  gate:
    name: fork PR review (awaiting maintainer approval)
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    environment: fork-pr-review
    permissions:
      actions: write
      pull-requests: write
      statuses: write
    # Job-level env so every `gh` invocation knows the API host + repo
    # without an `actions/checkout` step. Without these, gh falls back
    # to `git rev-parse` to resolve the host (no `.git` on the runner)
    # and aborts with `failed to determine base repo: ... fatal: not a
    # git repository`. Step 6's `Post final AI-judge status to PR
    # commit` was the visible failure under `set -e`; step 4's
    # `Wait for dispatched AI judges` swallowed the same error behind
    # `|| true`.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch AI review workflows
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `gh workflow run` returns the run URL on stdout/stderr across all
          # supported gh CLI versions; older versions don't accept `--jq`.
          # Parse the numeric run id out of the URL so we can wait on it.
          parse_run_id() {
            grep -oE 'runs/[0-9]+' <<<"$1" | head -n1 | sed 's|runs/||'
          }
          REVIEW_URL="$(gh workflow run review.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" 2>&1)"
          MAINT_URL="$(gh workflow run maintenance.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" 2>&1)"
          REVIEW_RUN="$(parse_run_id "$REVIEW_URL")"
          MAINT_RUN="$(parse_run_id "$MAINT_URL")"
          if [ -z "$REVIEW_RUN" ] || [ -z "$MAINT_RUN" ] \
             || ! [ "$REVIEW_RUN" -gt 0 ] 2>/dev/null \
             || ! [ "$MAINT_RUN" -gt 0 ] 2>/dev/null; then
            echo "::error::failed to parse run id; review_url=$REVIEW_URL maint_url=$MAINT_URL review_run=$REVIEW_RUN maint_run=$MAINT_RUN"
            exit 1
          fi
          {
            echo "REVIEW_RUN=$REVIEW_RUN"
            echo "MAINT_RUN=$MAINT_RUN"
          } >> "$GITHUB_ENV"
          echo "Dispatched review.yml run=$REVIEW_RUN maintenance.yml run=$MAINT_RUN"

      - name: Resolve PR commit SHA
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Resolved PR commit SHA=$SHA"

      - name: Mark PR commit as AI-review-pending
        run: |
          set -euo pipefail
          # `gh api` reads GH_HOST + GH_REPO from the job-level env so the
          # path-only URL can resolve the API endpoint on a runner that has
          # no .git directory (pull_request_target). See the job-level env
          # block for the rationale.
          gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state=pending \
            -f context='fork-pr-review/ai-judges' \
            -f description="AI judges dispatched (review=$REVIEW_RUN maintenance=$MAINT_RUN); awaiting verdict" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Wait for dispatched AI judges
        run: |
          set -uo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            gh run watch "$RUN" --exit-status || true
          done

      - name: Post per-judge commit statuses
        run: |
          set -euo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            JOBS_JSON="$(gh api "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/jobs")"
            for NAME in "/dev-kit:review (3-dim)" "/dev-kit:security (10-dim OWASP)" "/dev-kit:maintenance (code-sanity + docs)" "severity gate (review + security)"; do
              JOB_URL="$(echo "$JOBS_JSON" | jq -r --arg n "$NAME" '.jobs[] | select(.name==$n) | .html_url // empty')"
              CONCL="$(echo "$JOBS_JSON" | jq -r --arg n "$NAME" '.jobs[] | select(.name==$n) | .conclusion')"
              if [ -z "$CONCL" ] || [ "$CONCL" = "null" ]; then continue; fi
              case "$CONCL" in
                success)          STATE="success" ;;
                failure|timed_out) STATE="failure" ;;
                *) continue ;;  # skipped/cancelled/action_required/neutral/stale — non-blocking, don't post
              esac
              TARGET_URL="${JOB_URL:-https://github.com/${{ github.repository }}/actions/runs/$RUN}"
              # The gate job is the severity gate (review + security)
              # — its failure can come from EITHER a judge verdict OR a
              # deterministic sub-check (L3 evidence, docs-updated). The
              # description here distinguishes the source so a
              # contributor reading the PR's Checks tab can tell at a
              # glance whether to look at a judge verdict or a sub-check
              # diagnostic. (Issue #803.)
              if [ "$NAME" = "severity gate (review + security)" ]; then
                DESCRIPTION="gate job conclusion=$CONCL (run=$RUN) — see Actions log for sub-check vs judge breakdown"
              else
                DESCRIPTION="judge job conclusion=$CONCL (run=$RUN)"
              fi
              gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
                -f state="$STATE" \
                -f context="$NAME" \
                -f description="$DESCRIPTION" \
                -f target_url="$TARGET_URL" >/dev/null
            done
          done

      - name: Post final AI-judge status to PR commit
        run: |
          set -euo pipefail
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          # Issue #803: distinguish JUDGE verdict from GATE verdict in
          # the combined status description. The `review.yml` workflow's
          # `severity gate (review + security)` job wraps BOTH the LLM
          # judges AND deterministic sub-checks (L3 evidence, docs-
          # updated) — its workflow-level conclusion can flip to
          # `failure` because of a sub-check failure while the judges
          # themselves returned Approve. The old description
          # (`AI judge failure (review=failure maintenance=failure)`)
          # blamed the judges and sent us investigating the wrong
          # verdict. We now fetch the per-job `severity gate (review
          # + security)` conclusion alongside the workflow-level one
          # so the description names the actual failure source.
          REVIEW_GATE_CONCL="$(gh api "https://api.github.com/repos/${{ github.repository }}/actions/runs/$REVIEW_RUN/jobs" \
            | jq -r '.jobs[] | select(.name=="severity gate (review + security)") | .conclusion // ""')"
          if [ "$REVIEW_CONCL" = "success" ] && [ "$MAINT_CONCL" = "success" ]; then
            STATE="success"
            DESCRIPTION="judge=Approve gate=success (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          elif [ "$REVIEW_CONCL" = "success" ] && [ "$MAINT_CONCL" != "success" ] && [ "$REVIEW_GATE_CONCL" = "failure" ]; then
            # Maintenance dispatch failed at the workflow level but the
            # review dispatch's gate itself passed — the failure is in
            # maintenance, not the review judges.
            STATE="failure"
            DESCRIPTION="judge=Approve gate=success maintenance=failure (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          elif [ "$REVIEW_CONCL" = "failure" ] && [ "$REVIEW_GATE_CONCL" = "failure" ]; then
            # The gate job failed. Name the GATE (not the judges) as
            # the source — see the per-judge commit statuses for the
            # actual judge verdicts. Most commonly this is the L3
            # evidence sub-check (iron-laws L3) — the PR comment in
            # `review.yml`'s L3 step names the failure in plain text.
            STATE="failure"
            DESCRIPTION="judge=Approve gate=failure(review-gate) (review=$REVIEW_CONCL maintenance=$MAINT_CONCL) — see Actions log + PR comment for sub-check breakdown"
          else
            # Fallback: at least one judge verdict was non-success, or
            # the gate lookup returned empty. Preserve the old wording
            # shape so reviewers familiar with it aren't surprised.
            STATE="failure"
            DESCRIPTION="AI judge failure (review=$REVIEW_CONCL maintenance=$MAINT_CONCL gate=$REVIEW_GATE_CONCL)"
          fi
          gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state="$STATE" \
            -f context='fork-pr-review/ai-judges' \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Post audit comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
            "Maintainer approved this fork PR for review (fork-pr-review environment). \
            Dispatched /dev-kit:review (run [$REVIEW_RUN](https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN)) \
            and /dev-kit:maintenance (run [$MAINT_RUN](https://github.com/${{ github.repository }}/actions/runs/$MAINT_RUN)) \
            via workflow_dispatch. Final: review=$REVIEW_CONCL maintenance=$MAINT_CONCL. \
            Per-judge verdict comments are posted on each dispatched run."
