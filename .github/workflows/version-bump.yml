name: version-bump

# Single source of truth for plugin-version advancement.
#
# Architecture (post-merge-queue, 2026-08-30):
# - Feature PRs do NOT touch .claude-plugin/plugin.json or
#   .codex-plugin/plugin.json. The PR branch keeps the version it was
#   cut at; parallel PRs never conflict on the `version` field because
#   the GitHub Merge Queue rebases each PR onto the latest main
#   (which already contains this workflow's bump) before merge.
#   See docs/proposals/release/plugin-version-bump-via-merge-queue.yaml
#   for the before/after and evidence trail.
# - When the merge queue is about to merge a PR into main, it fires
#   `merge_group`. This workflow responds by:
#     1. Reading the current version from .claude-plugin/plugin.json
#     2. Bumping PATCH (0.3.129 -> 0.3.130)
#     3. Updating both manifests and committing the bump on top of
#        the merge_group ref (the queue then merges the result into
#        main -- no separate push is needed because the bump lives
#        inside the merge group)
#     4. Tagging the merge_group head (annotated; idempotent on
#        tag-already-exists)
# - ci.yml's validate-job "Version freshness" check continues to
#   require HEAD version > BASE version for PR merges; with the merge
#   queue guaranteeing every PR's HEAD includes the bump, that
#   contract is structurally upheld.
#
# Trigger history (read this before changing `on:` again):
# - 2026-08-02: `on: push: branches: [main]` was an unbounded
#   self-retrigger cascade (the bump commit pushed to main, which
#   fired another bump). Fixed by moving to `pull_request: types:
#   [closed]`.
# - 2026-08-30: `pull_request: types: [closed]` still had a per-PR
#   conflict on the version field against every parallel feature PR.
#   Fixed by moving to `merge_group` -- the queue guarantees the
#   PR's HEAD already has the prior bump when this fires.
#
# Ruleset bypass (unchanged from previous version of this file):
# `main` is protected by a repository Ruleset (not classic branch
# protection) requiring a PR + 3 status checks, with
# `bypass_actors: [{RepositoryRole: admin, always}]`. The default
# `secrets.GITHUB_TOKEN` authenticates as the "github-actions"
# Integration, which is NOT eligible for ruleset bypass on personal
# (non-org) GitHub accounts. `secrets.DEV_KIT_GITHUB_TOKEN` is a
# fine-grained PAT owned by the repo's admin account, so pushes
# authenticated with it inherit the admin RepositoryRole and bypass
# the ruleset.
#
# Bump-PR interop: /dev-kit:bump (skills/bump/SKILL.md) also opens a
# `chore(release): bump dev-kit to v...`-titled PR for manual/race-
# recovery bumps. With the merge queue, that PR also goes through
# `merge_group` when merged, so this workflow would double-bump. The
# "Skip re-bump if PR is itself a bump" step detects this by PR title
# (still available on `merge_group` events via
# github.event.merge_group.head_commit... actually NOT -- see below)
# and skips the bump-and-commit steps; tagging still runs.
#
# IMPORTANT: `merge_group` events do NOT carry `github.event.pull_request`
# context (only `merge_group.base_sha` + `merge_group.head_sha`). The
# "Skip re-bump if PR is itself a bump" step therefore resolves the
# PR title by reading it from `gh pr view <head_sha> --json title`,
# not from `github.event.pull_request.title`. See the step body.
on:
  merge_group:

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge_group head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # The merge_group event gives us the head_sha of the PR
          # after the queue has rebased it onto latest main. Checkout
          # that ref so the bump is on top of the queued PR, which
          # the queue then merges as a single unit. Do NOT use
          # `ref: main` here -- the queue expects the bump to live
          # inside the merge_group, not as a parallel push.
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip re-bump if PR is itself a bump
        id: idempotency
        # /dev-kit:bump opens a `chore(release): bump dev-kit to v...`
        # PR for manual/race-recovery bumps. Merging it through the
        # queue would otherwise double-bump (the skill already advanced
        # plugin.json). Detect by PR title (fetched via gh because
        # merge_group events do NOT carry pull_request context, unlike
        # the previous pull_request:closed trigger) and skip the
        # bump-and-commit steps; tagging still runs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          TITLE="$(gh pr view "$HEAD_SHA" --json title --jq .title)"
          echo "PR title for head=${HEAD_SHA}: $TITLE"
          if [[ "$TITLE" =~ ^chore\(release\):\ bump\ dev-kit\ to\ v ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::merged PR is itself a bump; skipping re-bump, tag still runs."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current version
        id: read
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next version (PATCH++)
        id: next
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.read.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump both manifests
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEXT="${{ steps.next.outputs.version }}"
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$NEXT" '.version = $v' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Commit bump on top of merge_group head
        if: steps.idempotency.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${NEXT}"
          # No `git push` here -- under merge_group, the queue owns
          # the merge to main. The bump lives in the merge_group head
          # and gets merged along with the PR in one squash/merge
          # commit. The pre-push hook on the runner side doesn't
          # fire because we don't push at all.

      - name: Emit annotated tag
        env:
          NEXT: ${{ steps.next.outputs.version }}
          CURRENT: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${NEXT:-$CURRENT}"
          TAG="dev-kit--v${VERSION}"

          # Idempotency: if the tag already exists in local refs,
          # skip. Same rationale as before — local ref is
          # authoritative; ls-remote is eventually consistent and
          # would let near-simultaneous pushes slip through.
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists locally; skipping"
            exit 0
          fi

          # Annotated (not lightweight) so downstream tooling gets
          # the metadata: tagger identity + creation date + message.
          # Lightweight tags are just ref pointers; many release
          # consumers (changelog generators, marketplace pin logic)
          # expect the metadata.
          #
          # Target the merge_group head (where the bump commit now
          # lives, either as the original PR head or as the bump on
          # top of it), not origin/main -- by the time we reach this
          # step, origin/main may have advanced if another workflow
          # run slipped in between, and tagging origin/main would tag
          # the wrong commit.
          git tag -a -m "dev-kit v${VERSION}" "$TAG" HEAD
          git push origin "$TAG"
          echo "tagged ${TAG} (annotated) at HEAD=${VERSION}"