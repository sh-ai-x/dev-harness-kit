name: PR Review

# Auto-run /dev-kit:review (3-dim) and /dev-kit:security (10-dim OWASP) on every
# PR, in parallel. dev-kit plugin is installed from this checkout via a
# local marketplace symlink so the namespaced skills resolve.
#
# Severity gate + auto-approve (per claude-review-plugins spec):
#   Approve            (no critical, no major in BOTH review + security) → success + auto-approve
#   Changes Requested  (any major in either)                              → failure
#   Blocked            (any critical in either)                           → failure
#
# Empty-verdict gate: for pull_request events, missing verdict = exit 1
# (strict). For workflow_dispatch, missing verdict = warn + exit 0
# (manual override allowed).
#
# Secret name `MINIMAX_API_KEY` is preserved from prior workflow — do not
# rename (would break existing repo secret config).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (default: minimax)"
        required: false
        default: "minimax"
        type: choice
        options:
          - minimax
          - anthropic
      pr_number:
        description: "PR number to review"
        required: false
        type: string

jobs:
  review:
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          # verify the symlink + manifest exist
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/review
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "provider=${{ github.event.inputs.review_provider }}" >> "$GITHUB_OUTPUT"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "provider=minimax" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run /dev-kit:review via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        # MiniMax channel: env-only (no with.anthropic_api_key to avoid mixed auth).
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: MiniMax-M3[1m]
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output (PR summary at top, per-finding
            inline comments). The summary MUST begin with a single line exactly
            of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict strictly to severity (do NOT inflate):
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  security:
    name: /dev-kit:security (10-dim OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/security
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "provider=${{ github.event.inputs.review_provider }}" >> "$GITHUB_OUTPUT"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "provider=minimax" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run /dev-kit:security via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: MiniMax-M3[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: MiniMax-M3[1m]
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary (per-category breakdown table + Verdict).
            The summary MUST begin with a single line exactly of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict per spec:
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  gate:
    name: severity gate (review + security)
    runs-on: ubuntu-latest
    needs: [review, security]
    if: always()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Extract latest verdict from each skill's comment
        id: verdicts
        run: |
          set -uo pipefail
          comments="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select((.user.login // "") | startswith("claude")) | {body: .body, id: .id}' 2>/dev/null || echo "")"

          # /dev-kit:review comment carries "## Review summary"
          review_verdict="$(echo "$comments" \
            | grep -B2 -A20 'Review summary' \
            | grep -E '\*\*Verdict:\*\*' | tail -1 | awk '{print $NF}' || true)"
          # /dev-kit:security comment carries "## Security summary"
          security_verdict="$(echo "$comments" \
            | grep -B2 -A20 'Security summary' \
            | grep -E '\*\*Verdict:\*\*' | tail -1 | awk '{print $NF}' || true)"

          echo "review_verdict=${review_verdict:-<none>}"
          echo "security_verdict=${security_verdict:-<none>}"
          echo "review_verdict=${review_verdict:-<none>}" >> "$GITHUB_OUTPUT"
          echo "security_verdict=${security_verdict:-<none>}" >> "$GITHUB_OUTPUT"

      - name: Combined verdict gate
        run: |
          R="${{ steps.verdicts.outputs.review_verdict }}"
          S="${{ steps.verdicts.outputs.security_verdict }}"
          EVENT="$EVENT_NAME"
          echo "review=$R  security=$S"

          # require both to be present on pull_request
          if [ "$EVENT" = "pull_request" ]; then
            if [ -z "$R" ] || [ -z "$S" ]; then
              echo "::error::Missing verdict (review='$R' security='$S'). Action may have been skipped, rate-limited, or failed."
              echo "  Re-run via workflow_dispatch if needed."
              exit 1
            fi
          else
            [ -z "$R" ] && { echo "::warning::review verdict missing (workflow_dispatch)"; R="Approve"; }
            [ -z "$S" ] && { echo "::warning::security verdict missing (workflow_dispatch)"; S="Approve"; }
          fi

          # worst-of wins
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          echo "Combined worst verdict: $worst"

          case "$worst" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R security=$S)"; exit 1 ;;
            *) echo "::error::Unexpected worst verdict: $worst"; exit 1 ;;
          esac

      - name: Auto-approve on combined Approve
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: |
          set -uo pipefail
          R="${{ steps.verdicts.outputs.review_verdict }}"
          S="${{ steps.verdicts.outputs.security_verdict }}"
          if [ "$R" = "Approve" ] && [ "$S" = "Approve" ]; then
            echo "Both review + security = Approve → auto-approving."
            gh pr review "$PR_NUMBER" --approve \
              --body "Auto-approved by /dev-kit:review + /dev-kit:security: lowest severity in both (no 🔴 critical, no 🟠 major)."
          else
            echo "Not auto-approving (review='$R' security='$S')."
          fi
