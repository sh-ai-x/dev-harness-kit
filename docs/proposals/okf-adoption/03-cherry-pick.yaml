title: "채택 1건 — lifecycle stale_after, rules/*.md 5개 한정 (실측 delta −228 B)"
status: ready-for-review
date: 2026-08-19
tags: [okf, adoption, stale-after, docs-maintenance, thin-harness]

before:
  summary: |
    문서 staleness는 현재 LLM 추정으로 잡는다. `/dev-kit:docs-maintenance`가 `rg`로
    stale 용어를 검색하고 `git log`로 "의도적 역사 기록 vs 낡은 현재 지침"을 판단한다.
    결정론적 만료 신호가 없으므로, 스킬을 호출하지 않는 한 낡은 규칙 문서는
    영원히 신선한 것처럼 읽힌다.
  evidence:
    - '`skills/docs-maintenance/SKILL.md:48` — "Search for stale terms, removed paths, old commands, hard-coded inventory counts, and duplicated instructions with `rg`."'
    - '`skills/docs-maintenance/SKILL.md:49` — "Use recent history (`git log` and targeted `git show`) to distinguish an intentional historical record from an outdated current instruction."'
    - '위 2줄 실측 358 B (`sed -n ''48,49p'' skills/docs-maintenance/SKILL.md | wc -c`)'
    - 'SKILL.md 전체 92줄 — staleness 판단이 스킬 프롬프트의 상당 지분을 차지'
    - '`rules/*.md` 6개 중 5개가 이미 YAML frontmatter 보유 (index.md만 없음)'
    - '`docs/lessons-token-pricing.md` — 가격 데이터 stale이 실제로 사고를 낸 기록'

after:
  summary: |
    OKF §5.4–5.5의 lifecycle 어휘만 차용한다. `stale_after: YYYY-MM-DD`를 이미
    frontmatter를 가진 `rules/*.md` 5개에 부여하고, `tools/`의 소형 체커가
    `.github/workflows/ci.yml` validate 잡에서 만료를 결정론적으로 잡는다.
    상계로 `skills/docs-maintenance/SKILL.md`의 staleness 추정 휴리스틱 2줄을 제거한다.
    conformance는 주장하지 않는다.
  files:
    - path: rules/git-workflow.md
      change: |
        frontmatter에 `stale_after` 1줄 추가 (기존 `paths:` 블록 유지).
    - path: rules/session-hygiene.md
      change: |
        frontmatter에 `stale_after` 1줄 추가.
    - path: rules/skill-authoring.md
      change: |
        frontmatter에 `stale_after` 1줄 추가.
    - path: rules/test-files.md
      change: |
        frontmatter에 `stale_after` 1줄 추가.
    - path: rules/token-pricing.md
      change: |
        frontmatter에 `stale_after` 1줄 추가. 갱신 주기가 가장 짧은 파일
        (`/dev-kit:llm-refresh` 분기 케이던스)이므로 만료일도 가장 짧게 잡는다.
    - path: tools/check_doc_lifecycle.py
      change: |
        신규. `rules/*.md` frontmatter를 `yaml.safe_load`로 파싱해
        `stale_after < today` 인 파일을 stderr로 나열하고 exit 1.
        `status: deprecated` 는 만료 검사에서 면제. 파서 패턴은
        `tools/harness_audit.py:81` 을 재사용한다.
    - path: tests/test_doc_lifecycle.py
      change: |
        신규. 만료/미만료/필드부재/`deprecated` 면제/파싱실패 5케이스 회귀 테스트.
    - path: .github/workflows/ci.yml
      change: |
        validate 잡에 `python3 tools/check_doc_lifecycle.py` 스텝 1개 추가.
    - path: skills/docs-maintenance/SKILL.md
      change: |
        48–49행(staleness 추정 휴리스틱 358 B) 제거 후, 결정론적 게이트를
        가리키는 1줄로 대체. 나머지 프롬프트는 무변경.

pros:
  - '`iron-laws/index.md` L7 정합 — LLM 추정을 결정론적 enforcement로 치환. 알파를 모델이 스스로 못 하는 곳에 쓴다'
  - 'thin-harness 게이트를 실측으로 통과: prompt-token delta −228 B (계산은 아래 §delta 회계)'
  - '적용 대상이 세션마다 읽히는 `rules/` 5파일 — staleness 피해가 가장 큰 층에 가장 작은 비용으로 들어간다'
  - '표준 어휘를 그대로 쓴다(`stale_after`, `status`). 나중에 OKF가 1.0에 도달하면 필드명 재작업 없이 conformance 경로로 승격 가능'
  - '`status` 는 부재 시 `stable` 로 간주되므로(§5.4) 5파일 중 어디에도 `status` 를 적지 않는다 — 추가 바이트 0'

cons:
  - 'OKF conformance는 주장하지 못한다. `kcmd` validator / visualizer / enrichment agent 이득 전부 포기 (의식적 수용)'
  - 'frontmatter 스키마가 두 어휘로 갈린다 — dev-kit 자체 스키마(SKILL.md) + OKF 어휘 1개(rules). 향후 스키마 검증기가 둘 다 알아야 한다'
  - '만료일은 사람이 정한다. 근거 없는 날짜를 박으면 게이트가 의미 없는 알람으로 변질된다 (완화: PR 리뷰에서 만료일 근거를 요구)'
  - '2026 Q3 cherry-pick 예산 2건 중 1건 소모'

limitations:
  - '만료일 이전에 내용이 틀려지는 경우는 잡지 못한다 (예: 벤더가 예고 없이 가격 변경). 그 영역은 여전히 `/dev-kit:docs-maintenance` 의 LLM 판단'
  - '`docs/` 107개는 대상이 아니다. frontmatter가 없는 파일에 `---` 펜스를 새로 여는 것은 R1(전면 conformance)과 같은 비용 구조가 되므로 범위에서 제외했다'
  - '게이트는 만료를 보고할 뿐 문서를 갱신하지 않는다. 갱신은 사람 또는 `/dev-kit:docs-maintenance` 호출'
  - '`stale_after` 부재 파일은 통과시킨다(fail-open). 전 파일 필수화는 R1과 동일한 순증 문제를 부르므로 의도적으로 강제하지 않는다'

sections:
  - title: 왜 이 1건만 통과했는가
    body: |
      9개 요소 중 8개는 dev-kit에 이미 대응 표면이 있거나(R1–R3, D2), 저장소 결정과
      충돌하거나(R4), 저장소 정책을 스펙이 표현하지 못하거나(R5), 없는 인프라를
      전제한다(R6). `sources`(D1)는 유용하지만 스펙이 두 달 만에 옮긴 필드다.

      `stale_after` 하나만 다른 이유는 **dev-kit에 대응 표면이 있는데 그것이 비결정론적**
      이라는 점이다.

      | 층 | 현재 | 성질 |
      |---|---|---|
      | staleness 탐지 | `rg` 검색 + `git log` 판단 (SKILL.md:48–49) | LLM 추정, 호출해야 작동 |
      | 만료 신호 | 없음 | — |

      `stale_after`는 두 번째 칸을 채운다. 채워지면 첫 번째 칸의 휴리스틱 산문을
      지울 수 있으므로, **추가가 곧 제거를 만든다** — thin-harness 게이트를 통과하는
      유일한 구조다. 나머지 8건에는 이 성질이 없다.

  - title: delta 회계 (thin-harness 게이트)
    body: |
      MEMORY thin-harness discipline: 채택 건당 **prompt-token delta ≤ 0**.
      바이트 실측으로 검증한다.

      | 항목 | 방향 | 바이트 |
      |---|---|---|
      | `stale_after: 2026-11-30\n` × 5파일 (`rules/*.md`) | 추가 | +130 |
      | `status:` 필드 | 추가 | 0 (§5.4 기본값 `stable` 활용, 미기재) |
      | `---` 펜스 신규 개방 | 추가 | 0 (5파일 모두 이미 frontmatter 보유) |
      | `skills/docs-maintenance/SKILL.md:48–49` 제거 | 제거 | −358 |
      | 대체 1줄 (게이트 지시) | 추가 | +약 90 |
      | **합계** | | **−138** |

      보수적으로 대체 1줄을 90 B로 잡아도 **−138 B**. 대체 문장을 생략하면 −228 B.
      어느 쪽이든 게이트 통과.

      ### 왜 `tools/check_doc_lifecycle.py` 와 테스트 바이트는 계산에서 빠지는가

      thin-harness 게이트의 단위는 **prompt-token**이다. `tools/*.py`와 `tests/*.py`는
      어떤 프롬프트에도 로드되지 않는다 — 모델이 읽는 것은 스킬 프롬프트와 규칙 문서이고,
      체커는 CI에서 subprocess로 실행된다. 저장소 총 바이트는 늘지만 프롬프트 토큰은
      줄어든다. 이 해석에 이견이 있으면 리뷰에서 반박해 달라 — 게이트 통과 여부가
      이 한 줄에 달려 있다.

      검증 명령:

      ```bash
      sed -n '48,49p' skills/docs-maintenance/SKILL.md | wc -c   # → 358
      printf 'stale_after: 2026-11-30\n' | wc -c                 # → 26
      ```

  - title: 대상 5파일과 만료일 근거
    body: |
      `rules/` 는 `AGENTS.md` → `CLAUDE.md` → `rules/index.md` 체인으로 세션마다 읽히는
      층이다. 여기가 낡으면 그 세션의 모든 판단이 낡은 규칙 위에서 이루어진다.
      `rules/index.md` 는 예약 인덱스 역할이라 대상에서 제외한다(frontmatter 없음).

      | 파일 | 갱신 트리거 | 제안 만료 |
      |---|---|---|
      | `rules/token-pricing.md` | 벤더 가격 변경 · `/dev-kit:llm-refresh` 분기 케이던스 | 분기 (가장 짧게) |
      | `rules/git-workflow.md` | 훅 추가/제거 · 워크트리 경로 정책 변경 | 반년 |
      | `rules/skill-authoring.md` | SKILL.md 스키마 변경 (`alpha`, `when_to_use` 등) | 반년 |
      | `rules/session-hygiene.md` | 모델/세션 정책 변경 | 반년 |
      | `rules/test-files.md` | 테스트 레이아웃/러너 변경 | 1년 |

      구체 날짜는 구현 PR에서 확정한다. **근거 없는 날짜는 리뷰에서 반려 대상**이다
      (cons 3번의 완화책).

  - title: 게이트 배선
    body: |
      `.github/workflows/ci.yml` 의 `validate` 잡에 스텝 1개를 추가한다.
      이 잡은 이미 plugin manifest 검증 · skill count · version freshness ·
      bash 훅 문법 · python import를 순차 실행하므로, 문서 lifecycle 검사도 같은 성격이다.

      ```yaml
      - name: Doc lifecycle (stale_after)
        run: python3 tools/check_doc_lifecycle.py
      ```

      체커 계약:

      | 입력 | 동작 |
      |---|---|
      | `stale_after` 없음 | 통과 (fail-open — limitations 4번) |
      | `stale_after >= today` | 통과 |
      | `stale_after < today` | 파일명 + 만료일 stderr 출력, exit 1 |
      | `status: deprecated` | 만료 검사 면제 (§5.4 의미론: 폐기 문서는 갱신 대상이 아님) |
      | frontmatter 파싱 실패 | exit 1 (fail-closed — 규칙 문서의 frontmatter는 이미 파싱 가능해야 함) |

      파서는 `tools/harness_audit.py:81` 의 `yaml.safe_load` 패턴을 재사용한다.
      신규 의존성 없음 (`requirements.lock` 에 PyYAML 존재).

  - title: 롤백 조건
    body: |
      다음 중 하나가 관측되면 이 채택을 되돌린다 (`stale_after` 5줄 + 체커 + 스텝 제거,
      SKILL.md 2줄 복원).

      1. 만료 알람이 실제 stale 문서를 가리키지 않고 날짜만 미루는 커밋을 3회 이상 유발
      2. `docs-maintenance` 가 제거된 휴리스틱 없이는 stale을 못 잡는 사례 발생
      3. OKF가 lifecycle 패밀리를 breaking change로 재정의 (필드명 변경 등)

      롤백 비용이 낮은 것이 이 채택의 설계 목표다 — 5줄 + 파일 2개 + 워크플로 스텝 1개.

  - title: 구현 순서
    body: |
      본 제안이 `accepted` 로 승인된 후에만 착수한다.

      1. 별도 이슈 생성 — 제목에 `stale_after` 명시, 본문에 이 문서 링크
      2. 새 워크트리 + `feat/doc-lifecycle-gate` 브랜치 (`rules/git-workflow.md` 프로토콜)
      3. `tools/check_doc_lifecycle.py` + `tests/test_doc_lifecycle.py` 작성 (TDD: 테스트 먼저)
      4. `rules/*.md` 5개에 `stale_after` 부여 — 각 날짜의 근거를 PR 본문에 기재
      5. `skills/docs-maintenance/SKILL.md` 48–49행 제거 + 대체 1줄
      6. `.github/workflows/ci.yml` validate 스텝 추가
      7. delta 실측 재확인 — `git diff --stat` 기준 추가/제거 바이트를 PR 본문에 인용
      8. `/dev-kit:review` → `/dev-kit:babysit-pr`
