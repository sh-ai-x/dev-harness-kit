  - title: Thin-harness memo
    body: |
      ### Item-by-item verdict

      - **`cache_decay` field + tile (F1)**: ADOPT — diagnostic is the
        prerequisite for every other fix; same shape as existing
        per-session fields; net-zero risk when guarded by G2/G3.
      - **Hook stdout audit (A1)**: ADOPT — `rules/session-hygiene.md`
        Iron Law 3 ("Volatile content stays in the prompt tail, never
        the prefix") already names the failure mode; A1 turns it into
        a testable contract.
      - **Skill frontmatter audit (A2)**: ADOPT — mirrors the
        `version-from-plugin-json` discipline. Existing test
        coverage (G6) makes regression cheap.
      - **Sub-agent isolation (D)**: DEFER → Phase 2 — needs empirical
        answer to "which parent context fields are stable enough to
        carry into a sub-agent." F1's per-turn data is the input.
      - **`cache_control` markers (E)**: DEFER → Phase 2 — API
        semantics with TTL+handoff need Anthropic spec confirmation
        beyond the SKILL.md description.
      - **One-model-per-session lock (G)**: DEFER → docs-maintenance
        PR (separate). Only 3 `MODEL_OVERSPEC` hits in 30d — not
        worth a hook.

      ### Cherry-pick budget

      Q3 2026 (2026-07-01 ~ 2026-08-28) third-party cherry-picks: 0.
      Phase 1 is dev-kit-internal — no third-party table impact.
      `feedback-thin-harness-discipline.md` budget unaffected.

      ### Phase 1 → Phase 2 gate

      If after Phase 1 lands the analyzer shows aggregate hit ≥97% OR
      `CACHE_HIT_LOW` count drops ≥20%, Phase 2 is unnecessary. If not,
      the same `cache_decay` data tells us whether D (sub-agent) or E
      (`cache_control`) is the next lever.

  - title: Tmux + long-running safety classification
    body: |
      Per `feedback-tmux-long-running-safety.md` 5-category check:

      - **New hook?** NO (audits live in `scripts/`, not `hooks/`)
      - **Sub-agent dispatch?** NO (`allowed-tools` unchanged)
      - **Persistent loop?** NO
      - **MCP server?** NO
      - **Network listener?** NO

      → **Pure-prose + audit-script change**, tmux-safe by definition.
      PR description must include "tmux + long-running classification:
      pure-prose + scripts."

  - title: Risks
    body: |
      | Risk | Source | Mitigation |
      |---|---|---|
      | **`cache_decay` changes dashboard layout, breaks screenshots** | existing dashboard consumers | gate behind `--show-decay` flag (off by default for 1 PR, then on) |
      | **Hook audit flags stable-but-looks-volatile content** (e.g., embedded git SHA that's actually deterministic) | A1 false positive | per-hook manual review before auto-patch; `audit_hook_stdout.sh` outputs JSON for triage, doesn't auto-edit |
      | **Skill frontmatter cleanup removes load-bearing timestamps** (e.g., last-reviewed field) | A2 false positive | `FORBIDDEN` regex excludes `last-reviewed:` fields explicitly; manual review of audit output |
      | **G7 doesn't move (cache hit is already structurally 96%)** | ceiling effect | Phase 2 decision deferred until real measurement; this proposal's primary value is the *observability*, not the percentage gain |
      | **`stale_cost_usd` = 86.7% of total** — fix targets miss the biggest lever | dashboard | separate `docs/proposals/stale-worktree-cleanup/` is the right scope; flag in `Next steps` |
      | **Hidden cache bypass via Codex-side prompt builder** | Codex runtime | `token-analyzer` already covers both `claude-code/` and `codex/` log dirs; if Codex bypasses cache, the analyzer sees it |

  - title: Verification plan
    body: |
      ### Cold determinism gate (`feedback-sub-agent-isolated-test.md`)

      1. Spawn context-free Agent sub — pass only the analyzer path
      2. Run `--days 30 --json` twice on the same inputs
      3. Diff the two JSONs byte-for-byte
      4. PASS criterion: empty diff
      5. Validator subprocess must return real numbers, not silent rc=1

      ### Analyzer regression

      - Existing 13 cases in `tests/test_token_efficiency_analyzer.py`
        continue to pass (G1)
      - New G2/G3 cases pass on first run after F1 lands

      ### Hook stdout determinism (G4)

      ```
      $ for h in hooks/*.sh; do
          before=$(bash "$h" < /dev/null 2>&1 | sha256sum)
          after=$(bash "$h" < /dev/null 2>&1 | sha256sum)
          [ "$before" = "$after" ] || echo "$h DRIFT"
        done
      ```

      Empty output = pass.

      ### Skill frontmatter audit (G5)

      ```
      $ python3 scripts/audit_skill_frontmatter.py
      $ echo $?
      0
      ```

      ### Hit-rate movement (G7)

      - Capture pre-merge: `python3 tools/token_efficiency_analyzer.py --repo dev-harness-kit --days 30 --json > /tmp/before.json`
      - Capture post-merge (same day-of-window): `... > /tmp/after.json`
      - PASS: aggregate hit ≥ 97% OR `CACHE_HIT_LOW` count drops ≥20%

      ### PR checklist

      - [ ] `pytest tests/test_token_efficiency_analyzer.py -v` G1+G2+G3 pass
      - [ ] `bash scripts/audit_hook_stdout.sh` returns 0 (G4)
      - [ ] `python3 scripts/audit_skill_frontmatter.py` returns 0 (G5)
      - [ ] `pytest tests/test_skill_governance.py -v` G6 pass
      - [ ] Cold sub-agent byte-identical re-run (determinism)
      - [ ] `pytest tests/test_hook_stdout_determinism.py tests/test_skill_frontmatter_audit.py -v` pass
      - [ ] PR description includes "tmux + long-running classification: pure-prose + scripts"

