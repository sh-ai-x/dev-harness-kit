      | `tests/test_issue_sync_pre_push.py` | CREATE | ~40 | pre-push subcommand parity |
      | `tests/test_issue_sync_lenient.py` | CREATE | ~60 | Lenient vs strict parser parity |
      | `bin/install-pre-push.sh` | CREATE | ~30 | Install script (idempotent, worktree-aware) |
      | `.github/workflows/issue-sync.yml` | MODIFY | -50 / +20 | Switch from bash loop to `pre-push` subcommand; honor `audit-trail` label |
      | `.claude/settings.json` | MODIFY | +15 | Register hook as advisory (Claude Code integration) |
