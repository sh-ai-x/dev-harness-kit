name: GitHub issue sync gate

# One-time check gate. Reads each PR's body + title, extracts every
# GitHub-issue reference (`#N` or `owner/repo#N`, with or without a
# close-keyword), and enforces the contract:
#
#   * If a PR references an issue, every referenced issue MUST be
#     `open` at the moment the gate runs. A PR cannot "sync" against
#     an already-closed issue — the work is no longer owed.
#   * If a PR references no issue, the gate is skipped (sync is not
#     owed, nothing to check).
#
# Mirrors the structure of `linear-pr-sync.yml` (same PR triggers, same
# one-time-check philosophy) but flips the contract: linear is
# non-blocking ("best-effort state sync"), this is a blocking sync
# gate. The `linear-pr-sync.yml` workflow ships with `continue-on-error:
# true` on every step so a flaky Linear API never blocks a PR; this
# workflow hard-fails on a closed issue so a stale reference surfaces
# in CI rather than at merge time.
#
# Trigger surface matches `ci.yml` and `linear-pr-sync.yml` so the
# gate runs at the same moments (open / re-open / new commit / body
# edit). `closed` and `ready_for_review` are intentionally absent —
# they do not change the issue-state contract.
#
# v1.1.0 (issue #833, PR #832 design): the bash loop is replaced by
# the `tools/issue_sync.py pre-push` subcommand — single source of
# truth between this remote gate and the local `hooks/pre-push.sh`
# hook. Honor the `audit-trail` label by running `--lenient` so
# audit-trail PRs (PR #829's failure mode) don't block merges on
# `Issue #N (closed)` refs while still failing on `Closes #N
# (closed)`.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  issue-sync:
    name: GitHub issue sync check
    runs-on: ubuntu-latest
    # `issues: read` is enough to GET /repos/{owner}/{repo}/issues/{N}.
    # No write scope is needed — the gate is read-only. `contents: read`
    # is required so `actions/checkout` can clone the repo under the
    # sparse-checkout shape below (the runner needs read access to the
    # source tree to materialize `tools/issue_sync.py`). Mirrors the
    # permission block in `linear-pr-sync.yml`.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Pre-check refs (skip job if PR has none)
        # v1.1.1: short-circuit BEFORE checkout when the PR body
        # references no GitHub issue. The PR's `body` is available
        # via `github.event.pull_request.body` (no fetch needed), so
        # we can decide without spinning up `actions/checkout` +
        # sparse-checkout + audit-trail label detection + the full
        # `tools/issue_sync.py pre-push` round-trip. The downstream
        # `if: steps.pre_check_refs.outputs.has_refs == 'true'` gates
        # the checkout + parse + verify chain; a no-ref PR exits 0 in
        # <2 s and never materializes `tools/issue_sync.py` from disk.
        #
        # The regex mirrors `tools/issue_sync.py:_REF_PATTERN`:
        # optional close/reference keyword (`Closes` / `Fixes` /
        # `Resolves` / `Issue` / `Related to` / etc., case-insensitive)
        # followed by `owner/repo#N` or `#N` with a word boundary.
        # The pre-check is a strict superset of the tool's matches —
        # it also catches refs in code blocks / HTML comments that
        # `_strip_code_and_comments` strips out of the real parse.
        # That's safe: a "false positive" here just triggers a
        # checkout + a no-ref real-parse that exits 0 anyway. The
        # only effect of a false positive is a few seconds of extra
        # runner time, never a regression in correctness.
        id: pre_check_refs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          REF_RE='((close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|issue|ref|refs|reference|references|see|part of|related to|tracking)[[:space:]]+)?(([A-Za-z0-9]([A-Za-z0-9-]{0,38}))/([A-Za-z0-9._-]{1,100}))?#[0-9]+\b'
          # Mirror `tools/issue_sync.py:parse_references` which concatenates
          # title + body before scanning. v1.1.1 fix: PR title carries refs
          # (e.g. "Closes #12 — fix wiring") and a body-only pre-check
          # would falsely short-circuit, leaving the audit-trail / stale-ref
          # check disabled for that PR. A newline separator avoids any
          # `#N<sep>#M` concatenation across the two fields.
          COUNT=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -ciE "$REF_RE" || true)
          if [ "$COUNT" = "0" ]; then
            echo "::notice title=issue-sync::PR title + body references no GitHub issue; sync check skipped before checkout (ref_count=0)."
            echo "has_refs=false" >> "$GITHUB_OUTPUT"
          else
            echo "pre_check_refs: found $COUNT reference candidate(s) in title+body; proceeding to checkout + parse."
            echo "has_refs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout
        if: steps.pre_check_refs.outputs.has_refs == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Disable credential persistence so a PR-controlled parser
          # cannot read the `GITHUB_TOKEN` out of `.git/config`. The
          # default leaves the token in the local git credential
          # helper; `pull_request` workflows then run untrusted code
          # from the PR checkout against a credential-bearing Git
          # config. Setting `persist-credentials: false` keeps the
          # token out of the filesystem where the parser can see it.
          persist-credentials: false
          # Sparse-checkout the parser only — the runner doesn't need
          # the full source tree, only the issue-reference parser and
          # its sibling `_repo_name` helper (used by some scripts in
          # this repo). Mirrors `linear-pr-sync.yml`'s sparse-checkout
          # shape so the two one-time-check workflows share the same
          # checkout pattern.
          sparse-checkout: tools/issue_sync.py

      - name: Detect audit-trail label
        if: steps.pre_check_refs.outputs.has_refs == 'true'
        # When the PR carries the `audit-trail` label (PR #829's
        # actual failure mode — the body uses `Issue #N` for closed
        # refs to preserve the historical audit trail), the gate
        # runs in `--lenient` mode so closed `Issue #N` / `Related to
        # #N` / etc. refs become warnings instead of errors. Close
        # keyword (`Closes` / `Fixes` / `Resolves`) + bare `#N`
        # still hard-fail under lenient.
        id: detect_label
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS_JSON" | jq -e 'index("audit-trail") != null' >/dev/null 2>&1; then
            echo "audit_trail=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=issue-sync::audit-trail label detected — running in lenient mode."
          else
            echo "audit_trail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse + check issue states
        if: steps.pre_check_refs.outputs.has_refs == 'true'
        # v1.1.0 (issue #833, PR #832): the bash loop is replaced by
        # the `pre-push` subcommand of `tools/issue_sync.py`. Single
        # source of truth between this remote gate and the local
        # `hooks/pre-push.sh` hook. The subcommand parses the PR
        # body + title (passed via `--pr-title` / `--pr-body`),
        # hits `gh api` per ref, and emits a structured JSON
        # result with `errors[]` / `warnings[]` / `refs[]`.
        # Lenient mode is selected by `--lenient` when the
        # `audit-trail` label is set; strict mode otherwise.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AUDIT_TRAIL: ${{ steps.detect_label.outputs.audit_trail }}
        run: |
          set -euo pipefail

          # Build the flag list. `--lenient` (the remote default for
          # audit-trail PRs) demotes closed `Issue #N` / `Related to
          # #N` / etc. refs to warnings; close-keyword + bare refs
          # still hard-fail. `--strict` is the default for non-label
          # PRs.
          FLAGS=(--pr-title "$PR_TITLE" --pr-body "$PR_BODY" --json)
          if [ "${AUDIT_TRAIL:-false}" = "true" ]; then
            FLAGS+=(--lenient)
          else
            FLAGS+=(--strict)
          fi

          python3 tools/issue_sync.py pre-push "${FLAGS[@]}" \
            > /tmp/issue-sync-result.json

          # `.refs` / `.errors` are top-level keys on the JSON document
          # (see tools/issue_sync.py `_check_ref_states` return shape);
          # they are NOT a `.json.refs` filename. Earlier versions of
          # this step treated `.json.refs` as a literal path, which is
          # why the gate silently printed `reference_count=0` on every
          # run even when refs were present.
          COUNT=$(jq -r '.refs | length // 0' /tmp/issue-sync-result.json)
          echo "reference_count=$COUNT" >> "$GITHUB_OUTPUT"

          # Surface warnings (always informational, even in strict
          # mode — warnings don't fail the gate by definition).
          jq -r '.warnings[]? | "::warning title=issue-sync::\(.message)"' \
            /tmp/issue-sync-result.json || true

          # Surface errors. Any error entry fails the gate.
          jq -r '.errors[]? | "::error title=issue-sync::\(.message)"' \
            /tmp/issue-sync-result.json || true

          # Final verdict.
          ERRORS=$(jq '.errors | length' /tmp/issue-sync-result.json)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error title=issue-sync::PR references $ERRORS issue(s) in a state that fails the gate; sync cannot match."
            echo "::error title=issue-sync::Fix: either re-open the issue(s), remove the reference from the PR body, or open a new issue and replace the ref."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "::notice title=issue-sync::PR does not reference any GitHub issue — sync check skipped."
          else
            echo "::notice title=issue-sync::All $COUNT referenced issue(s) are open (or warn-only under audit-trail); sync gate passed."
          fi
