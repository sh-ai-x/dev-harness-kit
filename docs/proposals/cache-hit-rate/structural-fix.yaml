  - title: Next steps (after this proposal is approved)
    body: |
      1. **Approval gate**: render this YAML to HTML via `/dev-kit:proposal`
         → user reviews `./docs/proposals/cache-hit-rate/structural-fix.html`
      2. **Linear sync**: `/dev-kit:linear` registers the umbrella issue
         (cache-hit-rate-structural-fix) + 3 sub-issues (F1, A1, A2)
      3. **Plan**: `/dev-kit:plan` produces phase-by-phase PRD
         (F1 → A1 → A2 → measure)
      4. **Build**: `/dev-kit:build` ships the 4 file-adds + 4 file-mods
         + 4 new tests, all gated by G1–G6
      5. **Measure**: post-merge `--days 30 --json` re-run, compare to
         pre-merge snapshot, decide Phase 2 (D/E) by G7 outcome
      6. **Out of scope (separate proposal)**: `stale_cost_usd = 86.7%`
         is the dominant cost-lever — file `docs/proposals/stale-worktree-cleanup/`
         next, not bundled here

