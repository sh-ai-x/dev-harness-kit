title: Local pre-push gate migration — fix PR #829's silent sync-gate failure
status: draft
date: 2026-09-09
tags: [ci, gates, hooks, pre-push, issue-sync, workflow]
umbrella: local-pre-push-gates

sections:
  - title: One-paragraph summary
    body: |
      PR #829 was merged with `GitHub issue sync check` failing because
      the PR body referenced three closed issues (`#726`, `#397`, `#625`)
      alongside the one it closed (`#823`). The gate is deterministic
      (Python parser + `gh api`) and ran on GH Actions only — so the
      developer had no signal until after push. **Every push that
      triggered GH Actions burned $1-3 of provider tokens on LLM judges
      before the developer knew the push was broken.**

      This proposal installs a **minimal local pre-push hook** with
      **`issue-sync` as the recommended default** — the only gate
      that actually saves provider tokens. It catches the failure
      mode for **~9s wall-clock + <10MB RSS**: zero pytest, zero ruff,
      zero validate. Severity review (LLM judges that produce PR
      comments) **stays in GH Actions** — that's where provider tokens
      are intentionally spent and where comments land. Other Tier A
      gates (`test`/`validate`/`lint`/`cache-decay-audit`) ship as
      **opt-in** under `.dev-kit/local-gates.yaml` for users who want
      them; branch-policy and cost-flag are not in the hook at all
      (already covered by `git-guard.sh` / remote gate respectively).

      **Three-axis decision rule** (token cost × local resource cost ×
      fixability) replaces the simple Tier A/B/C split.

