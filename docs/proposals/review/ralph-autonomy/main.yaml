  - title: Tmux + long-running safety classification
    body: |
      Per feedback-tmux-long-running-safety:

      - **훅 추가?** NO — Ralph uses existing hooks.
      - **Subagent dispatch?** NO — allowed-tools excludes Agent.
      - **Persistent loop?** YES (loop-yes). Mitigation: durable
        state on every transition; attended_lock prevents
        mid-run interrupts; babysit-pr's MUST-RUN-INSIDE-WORKTREE
        still applies.
      - **MCP server?** NO.
      - **Network listener?** NO.

      → **Loop-yes**, tmux-safe. PR description must include:
      `tmux + long-running classification: loop-yes (attended_lock
      + durable state)`.

  - title: Risks
    body: |
      | 위험 | 출처 | 완화 |
      |---|---|---|
      | **4 gates slow the user** | new design | gates are short reads (research.md ≤ 1 page, ship-confirm ≤ 10 lines); proposal + PRD are full reads |
      | **Edit-then-approve multi-round** | iteration loop | rewind bounded (one target per reply); test forbids double-rewind |
      | **attended_lock blocks legitimate Asks** | new invariant | debug surface via `last_blocked_ask`; test covers forbidden case |
      | **Renderer schema bump breaks old proposals** | additive change | backward-compat verified by test_render_old_proposal_unchanged |
      | **--best-effort over-fires** | interview dedup_metric=2 cap | plan still demands evidence ≥3 + value_score ≥3.0 + ambiguity_score ≤3 |
      | **Babysit-pr MAX_ITERS burn** | generous cap | 3-consecutive-no-progress guard caps ~45 min |
      | **Skill frontmatter rename drift** | 6 underlying skills | smoke test on every PR touching any of the 6 |
      | **Mid-stream phase blocked** | build's blocked-step policy | ralph_progress.md surfaces state; non-zero exit |
      | **Human-merge boundary at the end** | MUST-NO-SKIP | USER_MERGE_REQUIRED terminal, not exit-0 |

  - title: Verification plan
    body: |
      ### Cold determinism gate (feedback-sub-agent-isolated-test)

      1. Spawn a fresh-context sub-agent (Agent tool, no
         isolation) passing only the path to skills/ralph/SKILL.md.
      2. Run /dev-kit:ralph "add a hello-world skill" end-to-end
         with --dry-run (research + proposal-render + plan +
         ship-confirm + build --dry-run + babysit --dry-run +
         ship --dry-run).
      3. Capture stdout + git diff --stat.
      4. Re-run with identical input — must produce byte-
         identical stdout + diff (the orchestrator is
         deterministic; --dry-run is the only stable mode).
      5. Spot-check test_attended_lock_forbids_ask + smoke
         tests fire and pass.

      ### 수동 e2e (5 시나리오)

      | 시나리오 | 기대 동작 |
      |---|---|
      | /dev-kit:ralph "X" (clean repo, X small) | 4 gates + ATTENDED_RUN; ~5-30 min wall |
      | /dev-kit:ralph "X" with Edit-then-approve at GATE 2 | rewind to PROPOSAL_GATE; re-render; re-ask |
      | /dev-kit:ralph "X" then user Aborts at GATE 1 | persist stage=RESEARCH_GATE, exit 0 |
      | /dev-kit:ralph "X" with --dry-run | chain runs through GATE 4; ATTENDED_RUN is no-op |
      | Re-invoke /dev-kit:ralph "X" after RECOVERY_REQUIRED | resume from .dev-kit/ralph/<session>.json last-stage |

      ### 회귀 / 메모리 격리

      - All 6 underlying skills pass their regression suites
        unchanged.
      - tests/test_render_proposal_html.py passes — old proposals
        render unchanged.
      - tests/test_skill_governance.py passes — Ralph's alpha:
        state declaration is honored.
      - Memory paths read/write-free in Ralph.

      ### PR 체크리스트

      - [ ] pytest tests/test_ralph_skill.py tests/test_render_proposal_html.py tests/test_skill_governance.py -v 통과
      - [ ] Cold sub-agent test byte-identical on --dry-run
      - [ ] 회귀: research/proposal/plan/build/babysit-pr/ship unchanged
      - [ ] skills/README.md 카운트 39→40
      - [ ] PR description에 "tmux + long-running classification: loop-yes (attended_lock + durable state)" 명시

