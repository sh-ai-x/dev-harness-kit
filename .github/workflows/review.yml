name: PR Review

# Auto-run /dev-kit:review (3-dim) and /dev-kit:security (10-dim OWASP) on every
# PR, in parallel. dev-kit plugin is installed from this checkout via a
# local marketplace symlink so the namespaced skills resolve.
#
# Severity gate + auto-approve (per claude-review-plugins spec):
#   Approve            (no critical, no major in BOTH review + security) → success + auto-approve
#   Changes Requested  (any major in either)                              → failure
#   Blocked            (any critical in either)                           → failure
#
# Empty-verdict gate: for pull_request events, missing verdict = exit 1
# (strict). For workflow_dispatch, missing verdict = warn + exit 0
# (manual override allowed).
#
# Secret name `MINIMAX_API_KEY` (provider = `minimax`). Earlier workflow
# iterations used the typo'd `MINMAX_API_KEY`; both the workflow references
# and the matching repo secret must use the same name, so this PR renames
# the workflow side AND requires the repo secret to be renamed in lock-step
# via:
#   gh secret delete MINMAX_API_KEY
#   gh secret set   MINIMAX_API_KEY --body "<new value>"
#
# Provider selection (pull_request events): resolved from the GitHub
# repo variable `vars.CI_REVIEW_PROVIDER` (one of `minimax` /
# `anthropic` / `deepseek`). Set it per repo via:
#   gh variable set CI_REVIEW_PROVIDER --body anthropic
# workflow_dispatch still accepts an explicit `review_provider` input
# that overrides the repo variable for a single manual run. When
# neither is set the workflow fails loud with a remediation hint —
# there is no committed default, because the same repo can be used
# by different operators with different providers (local `.env` is the
# per-user selector; the repo variable is the per-repo CI selector).
# Each provider requires its matching secret to be configured:
# `MINIMAX_API_KEY`, `ANTHROPIC_API_KEY`, or `DEEPSEEK_API_KEY`.
#
# Local provider selection lives in `.env:CI_REVIEW_PROVIDER` (managed
# via `bin/set-provider.sh <provider>`), which is gitignored and per-
# user. `.githooks/pre-commit` no longer rewrites anything — that
# silent `.env -> tracked-file` sync was removed in #230, and the
# tracked file itself was removed in this change.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Trusted maintainer-authored fork PRs run from the base branch context so
  # review credentials are available immediately without the manual fork
  # environment gate. The job conditions below restrict this event to
  # OWNER/MEMBER/COLLABORATOR authors.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (overrides vars.CI_REVIEW_PROVIDER)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - minimax
          - anthropic
          - deepseek
      pr_number:
        description: "PR number to review"
        required: false
        type: string

jobs:
  scope:
    name: scope (touches production code?)
    runs-on: ubuntu-latest
    # Single source of truth for "does this PR touch production code?",
    # consumed by `review`/`security` (skip the LLM judges entirely on
    # docs/test-only diffs — they're the most expensive gates, ~3-5 min
    # each) and by `gate` (L3-evidence-advisory + auto-approve eligibility).
    # Previously this logic was duplicated inline in `gate`'s touch_probe
    # step; extracted here so review/security can gate on it too instead
    # of unconditionally running on every PR regardless of what it touches.
    if: "!startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')"
    outputs:
      touches_prod: ${{ steps.touch_probe.outputs.touches_prod }}
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Touch-probe (does this PR touch production code?)
        id: touch_probe
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          # Kept in sync with bin/review-local.sh's own touch-probe
          # regex (the canonical source; pinned by
          # tests/test_review_yml_touch_probe.py). Previously missing
          # bin/ and commands/ here meant a PR that only touched
          # bin/*.sh or commands/*.md scripts was silently classified
          # as docs/infra-only, skipping the review/security jobs
          # below entirely.
          TOUCHES="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
              --json files --jq '.files[].path' 2>/dev/null \
            | grep -E '^(bin|commands|lib|tools|hooks|skills|\.githooks|\.claude|\.codex|\.github)/' \
            || true)"
          if [ -n "$TOUCHES" ]; then
            echo "touches_prod=true" >> "$GITHUB_OUTPUT"
            echo "Touched production roots:"
            printf '  %s\n' $TOUCHES | head -10
          else
            echo "touches_prod=false" >> "$GITHUB_OUTPUT"
            echo "docs/infra-only PR (no bin/commands/lib/tools/hooks/skills/.githooks/.claude/.codex/.github changes)"
          fi

  review:
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: scope
    # Skip on bump-PRs (title is `chore(release): bump dev-kit to vX.Y.Z`).
    # The bump content is version-bump.yml-generated and merged by a
    # human (auto-merge is disabled by policy). Running /dev-kit:review
    # on it would only confirm "plugin.json version bumped by 0.0.1" — no
    # reviewable change. Replaces the previous `[skip ci]` literal that
    # globally suppressed ALL workflows on the bump commit (which broke
    # the round-trip — see version-bump.yml).
    #
    # Also skip when the PR doesn't touch production code (docs/tests-only):
    # the auto-approve step in `gate` already refuses to approve such PRs
    # (touches_prod must be true), so running the ~3-5 min LLM review here
    # today buys nothing but CI minutes — the human-gate hand-off is
    # unaffected either way. `workflow_dispatch` always runs regardless
    # (explicit manual override intent).
    #
    # Also skip on the `pull_request` trigger when the PR's head repo is a
    # fork (`head.repo.full_name != github.repository`): GitHub caps
    # GITHUB_TOKEN to read-only and never issues an OIDC token for
    # `pull_request` runs originating from a fork, regardless of the
    # `permissions:` block below — the job would just fail loudly on the
    # OIDC fetch step. Fork PRs are reviewed via `fork-pr-review.yml`
    # instead, which requires maintainer approval (GitHub Environment
    # `fork-pr-review`) before dispatching THIS workflow via
    # `workflow_dispatch` — that dispatch is not a fork-origin `pull_request`
    # event, so it gets full permissions and reaches this same job normally.
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v') &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.scope.outputs.touches_prod == 'true' &&
         (github.event.pull_request.head.repo.full_name == github.repository ||
          (github.event_name == 'pull_request_target' &&
           contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))))
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          # verify the symlink + manifest exist
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/review
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="${{ vars.CI_REVIEW_PROVIDER }}"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          # Fallback: when the `vars.CI_REVIEW_PROVIDER` context returns
          # empty (GH-Actions can fail to render the var context even when
          # the variable is set via `gh variable set`), infer the
          # provider from the workflow-level MINIMAX_BASE_URL env — the
          # workflow inlines that env unconditionally, so its presence
          # is the strongest signal the operator intended `minimax`.
          # This is the same graceful fallback as `bin/review-local.sh`'s
          # local-auth path in lib/ci_setup.read_provider.
          if [ -z "$provider" ] && [ -n "$MINIMAX_BASE_URL" ]; then
            echo "::warning::vars.CI_REVIEW_PROVIDER was empty; falling back to MINIMAX_BASE_URL env inference"
            provider="minimax"
          fi
          if [ -z "$provider" ]; then
            echo "::error::No provider resolved. Set the GitHub repo variable:"
            echo "  gh variable set CI_REVIEW_PROVIDER --body anthropic"
            echo "or pass review_provider on a manual workflow_dispatch run."
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:review via MiniMax
        if: steps.provider.outputs.provider == 'minimax' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        # MiniMax channel: env-only (no with.anthropic_api_key to avoid mixed auth).
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output (PR summary at top, per-finding
            inline comments). The summary MUST begin with a single line exactly
            of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict strictly to severity (do NOT inflate):
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via DeepSeek
        if: steps.provider.outputs.provider == 'deepseek' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        # DeepSeek channel: env-only, same pattern as MiniMax above.
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'deepseek-v4-flash'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'deepseek-v4-flash'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via MiniMax (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh review "${{ steps.provider.outputs.pr_number }}"

      - name: Run /dev-kit:review via Claude Code opt-in (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'anthropic'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh review "${{ steps.provider.outputs.pr_number }}"

      - name: Run /dev-kit:review via DeepSeek (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'deepseek'
        env:
          ANTHROPIC_BASE_URL: 'https://api.deepseek.com/anthropic'
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh review "${{ steps.provider.outputs.pr_number }}"
      - name: Extract review verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          # Pick the MOST RECENT claude[bot] comment whose body contains
          # a `**Verdict:**` line, NOT the most recent comment overall
          # (otherwise the track_progress placeholder wins and the
          # verdict reports MISSING even when the run produced one).
          # Delegate the line-level extraction to the python helper so
          # the same regex the unit tests pin governs CI (no shell-only
          # awk drift that collapses "Changes Requested" to "Requested"
          # or accidentally matches a nested literal "**Verdict:**"
          # mention inside a paragraph).
          # `--paginate` is REQUIRED here — without it `gh api` returns
          # only the first page (default 30, even with ?per_page=100 on
          # a single page of 94+ comments the API has historically
          # returned an inconsistent snapshot mid-write). PRs with >30
          # comments would otherwise extract the verdict from the OLDEST
          # page-1 comment instead of the LLM judge's latest verdict.
          comment="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate --slurp \
            | jq -r '[.[] | .[] | select((.user.login // "") | (startswith("claude") or . == "github-actions[bot]")) | select(.body | test("\\*\\*Verdict:\\*\\*")) | select((.body | test("<!-- dev-kit-verdict-audit -->")) | not)] | sort_by(.updated_at) | .[-1].body // ""')"
          verdict="$(printf '%s' "$comment" | python3 -m lib.maintenance_gate --extract-verdict-from-stdin)"
          echo "review_verdict=${verdict:-<none>}"
          echo "verdict=${verdict:-}" >> "$GITHUB_OUTPUT"
          audit_body="$(python3 -m lib.maintenance_gate --format-audit \
            --run "${{ github.run_id }}" \
            --job review \
            --status "${{ job.status }}" \
            --verdict "${verdict:-MISSING}" \
            --source lib.maintenance_gate)"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  security:
    name: /dev-kit:security (10-dim OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: scope
    # Skip on bump-PRs, docs/tests-only PRs, and fork PRs on the
    # `pull_request` trigger — same rationale as `review:` above.
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v') &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.scope.outputs.touches_prod == 'true' &&
         (github.event.pull_request.head.repo.full_name == github.repository ||
          (github.event_name == 'pull_request_target' &&
           contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))))
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/security
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="${{ vars.CI_REVIEW_PROVIDER }}"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          # Fallback: when the `vars.CI_REVIEW_PROVIDER` context returns
          # empty (GH-Actions can fail to render the var context even when
          # the variable is set via `gh variable set`), infer the
          # provider from the workflow-level MINIMAX_BASE_URL env — the
          # workflow inlines that env unconditionally, so its presence
          # is the strongest signal the operator intended `minimax`.
          # This is the same graceful fallback as `bin/review-local.sh`'s
          # local-auth path in lib/ci_setup.read_provider.
          if [ -z "$provider" ] && [ -n "$MINIMAX_BASE_URL" ]; then
            echo "::warning::vars.CI_REVIEW_PROVIDER was empty; falling back to MINIMAX_BASE_URL env inference"
            provider="minimax"
          fi
          if [ -z "$provider" ]; then
            echo "::error::No provider resolved. Set the GitHub repo variable:"
            echo "  gh variable set CI_REVIEW_PROVIDER --body anthropic"
            echo "or pass review_provider on a manual workflow_dispatch run."
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:security via MiniMax
        if: steps.provider.outputs.provider == 'minimax' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary (per-category breakdown table + Verdict).
            The summary MUST begin with a single line exactly of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict per spec:
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via DeepSeek
        if: steps.provider.outputs.provider == 'deepseek' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'deepseek-v4-flash'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'deepseek-v4-flash'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          allowed_bots: '*'
          anthropic_oidc_audience: anthropic
          track_progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via MiniMax (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh security "${{ steps.provider.outputs.pr_number }}"

      - name: Run /dev-kit:security via Claude Code opt-in (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'anthropic'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh security "${{ steps.provider.outputs.pr_number }}"

      - name: Run /dev-kit:security via DeepSeek (workflow_dispatch workaround)
        if: github.event_name == 'workflow_dispatch' && steps.provider.outputs.provider == 'deepseek'
        env:
          ANTHROPIC_BASE_URL: 'https://api.deepseek.com/anthropic'
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/ci-claude-p.sh security "${{ steps.provider.outputs.pr_number }}"
      - name: Extract security verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          # Pick the MOST RECENT claude[bot] comment whose body contains
          # a `**Verdict:**` line, NOT the most recent comment overall.
          # Delegate line-level extraction to the python helper so the
          # same regex the unit tests pin governs CI (no nested-mention
          # false-positive from a literal `**Verdict:**` inside the
          # body prose).
          comment="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate --slurp \
            | jq -r '[.[] | .[] | select((.user.login // "") | (startswith("claude") or . == "github-actions[bot]")) | select(.body | test("\\*\\*Verdict:\\*\\*")) | select((.body | test("<!-- dev-kit-verdict-audit -->")) | not)] | sort_by(.updated_at) | .[-1].body // ""')"
          verdict="$(printf '%s' "$comment" | python3 -m lib.maintenance_gate --extract-verdict-from-stdin)"
          echo "security_verdict=${verdict:-<none>}"
          echo "verdict=${verdict:-}" >> "$GITHUB_OUTPUT"
          audit_body="$(python3 -m lib.maintenance_gate --format-audit \
            --run "${{ github.run_id }}" \
            --job security \
            --status "${{ job.status }}" \
            --verdict "${verdict:-MISSING}" \
            --source lib.maintenance_gate)"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  gate:
    name: severity gate (review + security)
    runs-on: ubuntu-latest
    needs: [scope, review, security]
    # Skip on bump-PRs: `review` and `security` are skipped via their own
    # `if:` filters above (bump PRs, and now also docs/tests-only PRs —
    # see `scope`); `needs: [...]` with `if: always()` would still cause
    # gate to run regardless of whether upstream jobs ran or were skipped.
    # Mirror the skip here so the entire job chain is silenced in one
    # logical place for bump PRs. The `if:` is wrapped in `always() && ...`
    # so the gate still runs on partial upstream failures/skips for
    # non-bump PRs.
    #
    # Also skip on the `pull_request` trigger for fork PRs (same condition
    # as `review`/`security` above) — running `gate` here would otherwise
    # default the missing (intentionally-skipped, not failed) verdicts to
    # Approve and silently bypass review for every fork PR. The
    # `fork-pr-review.yml` maintainer-approval gate dispatches a
    # `workflow_dispatch` run of THIS workflow instead, which reaches this
    # same `gate` job with real verdicts from `needs.review`/`needs.security`.
    if: |
      always() &&
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       (github.event_name == 'pull_request_target' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    # The auto-approve step casts `gh pr review --approve`, which
    # writes to the PR. The default GITHUB_TOKEN is read-only on most
    # operations; grant pull-requests: write so the auto-approve
    # call has the permission it needs. Other GITHUB_TOKEN scopes
    # stay at the workflow default; we don't widen the surface
    # beyond what the auto-approve path actually requires.
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout (seed git context for gh pr review)
        # The new "Auto-approve on clean verdict" step shells out to
        # `gh pr review --approve`, which in turn shells out to `git`
        # to resolve the current branch. The gate job has no prior
        # checkout, so without this seed the gh call exits 1 with
        # "fatal: not a git repository" and the severity gate goes
        # red instead of flipping reviewDecision=APPROVED.
        # persist-credentials: false so the token does not leak into
        # git config after the step.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: L3 evidence gate (PR body must quote test count)
        # Per iron-laws/index.md L3: "No completion claim without quoted exit
        # code / test count / build log." For PRs that touch production
        # code, the PR body MUST include a quoted pytest tail line matching
        # the strict format below. This is a stricter check than the
        # human-only "did you remember to paste it?" that the previous
        # template relied on — the regex here is also the format the
        # template's "Iron Law L3" fenced block invites the author to
        # paste, so template and gate are in lockstep.
        #
        # For docs/infra-only PRs (touches_prod != 'true'), this step is
        # advisory — it logs ::notice:: but does NOT fail the gate. The
        # human + verdict-gate still owns approval.
        env:
          TOUCHES_PROD: ${{ needs.scope.outputs.touches_prod || '' }}
        run: |
          set -uo pipefail
          PR_BODY="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json body --jq '.body // ""')"

          # pytest -q canonical summary line — any of these forms:
          #   all-green (no skips):    `<N> passed in <Ns>s`
          #   all-green (with skips):  `<N> passed, <N> skipped in <Ns>s`
          #   partial-red:             `<N> failed, <N> passed, <N> skipped in <Ns>s`
          #   total-red:               `<N> failed in <Ns>s`
          # The `skipped` (or `xfailed` / `xpassed`) segment is OPTIONAL —
          # pytest omits it when the count is 0, and we should not force
          # authors to fabricate a skip count or add a deliberate
          # `@unittest.skip` test just to satisfy the gate. The regex
          # accepts the natural pytest -q output for every state.
          PATTERN='[0-9]+ (passed|failed)(, [0-9]+ (skipped|xfailed|xpassed))? in [0-9.]+s'
          if printf '%s' "$PR_BODY" | grep -qE "$PATTERN"; then
            echo "L3-evidence OK: pytest tail line found in PR body"
            exit 0
          fi

          if [ "$TOUCHES_PROD" = "true" ]; then
            echo "::error::PR body lacks a quoted pytest tail line."
            echo "::error::Required (Iron Law L3): a pytest summary line of the form"
            echo "::error::  '<N> passed in <Ns>s'      (all-green, no skipped)"
            echo "::error::  '<N> passed, <N> skipped in <Ns>s'"
            echo "::error::  '<N> failed, <N> passed, <N> skipped in <Ns>s'"
            echo "::error::  '<N> failed in <Ns>s'"
            echo "::error::Use the .github/pull_request_template.md 'Iron Law L3' section,"
            echo "::error::paste the EXACT line from your local pytest run (not a paraphrase)."
            exit 1
          else
            echo "::notice::docs/infra-only PR; L3 evidence is advisory here."
            echo "  (PR did not touch bin/, commands/, lib/, tools/, hooks/, skills/, .githooks/, .claude/, .codex/, .github/.)"
            echo "  Consider still pasting a pytest tail if you ran any local verification."
          fi

      - name: Combined verdict gate
        id: combined_verdict
        run: |
          # Read verdicts directly from each job's outputs (set by the
          # 'Extract <skill> verdict' post-step in review + security jobs).
          # This is robust: no fragile comment-body matching required.
          R="${{ needs.review.outputs.verdict }}"
          S="${{ needs.security.outputs.verdict }}"
          EVENT="$EVENT_NAME"
          echo "review=$R  security=$S"

          # Capture the raw (undefaulted) values so the auto-approve
          # step can refuse to fire when either LLM judge returned no
          # verdict. The combined gate below is allowed to default
          # missing verdicts to Approve + ::warning:: for the human
          # gate, but auto-approve is a stricter path: a missing LLM
          # verdict must NOT silently synthesize an approval.
          echo "raw_review=${R:-}" >> "$GITHUB_OUTPUT"
          echo "raw_security=${S:-}" >> "$GITHUB_OUTPUT"

          # Tolerate missing verdicts in BOTH event modes. The previous
          # strict pull_request branch hard-failed on empty R or S, which
          # broke any PR whose agent skipped (workflow-validation skip on
          # the very PR that ADDS .github/workflows/review.yml, action
          # rate-limit, transient network error). The fix: default to
          # Approve + ::warning:: in both modes so the human gate
          # (REVIEW_REQUIRED / CHANGES_REQUESTED on the PR) is what
          # actually blocks merge, not a single missing agent verdict.
          [ -z "$R" ] && { echo "::warning::review verdict missing (event=$EVENT); defaulting to Approve"; R="Approve"; }
          [ -z "$S" ] && { echo "::warning::security verdict missing (event=$EVENT); defaulting to Approve"; S="Approve"; }

          # Issue #397: PARSE_FAILED is a parse-error sentinel, NOT an
          # unparseable verdict. Hard-fail so a broken parser can't mask
          # itself as a passing review. (Mirrors templates/ci/.github/
          # workflows/review.yml.)
          if [ "$R" = "PARSE_FAILED" ] || [ "$S" = "PARSE_FAILED" ]; then
            {
              echo "::error::review+security gate: verdict parser failed"
              echo "  review.verdict=$R  security.verdict=$S"
              echo "  The agent's output file couldn't be parsed into a"
              echo "  recognizable Verdict -- this is NOT a successful pass."
            } >&2
            exit 1
          fi

          # worst-of wins
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          echo "Combined worst verdict: $worst"
          # Surface the resolved verdict to downstream steps so the
          # auto-approve step can read it without re-computing.
          echo "verdict=$worst" >> "$GITHUB_OUTPUT"

          # Tolerate unparseable verdicts (e.g. "Requested", "Skipped", or
          # unexpected formats from the /dev-kit:* agents): treat as non-
          # blocking by analogy with the workflow_dispatch branch above — the
          # human gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what actually
          # blocks merge, not a single regex trip.
          if ! { [ "$worst" = "Approve" ] || [ "$worst" = "Changes Requested" ] || [ "$worst" = "Blocked" ]; }; then
            echo "::warning::Unparseable verdict '$worst' (review='$R' security='$S'); treating as non-blocking."
            exit 0
          fi

          case "$worst" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R security=$S)"; exit 1 ;;
          esac

      - name: Auto-approve on clean verdict
        # Implements the header-documented "Approve → success + auto-approve"
        # contract that the code never actually wired up: when (a) the combined
        # gate passed with verdict=Approve, (b) the L3 evidence gate was
        # actually enforced (PR touches production code), and (c) the PR is
        # open and not yet auto-approved, cast `gh pr review --approve` so
        # GitHub's `reviewDecision` flips to APPROVED and the branch-
        # protection gate unblocks merge.
        #
        # Fail-closed guards (the LLM maintenance judge flagged both of
        # these in the 2026-08-03 babysit incident for PR #559; this
        # commit addresses them):
        #   1. The if: predicate requires BOTH the combined verdict to
        #      be 'Approve' AND the raw (undefaulted) review + security
        #      verdicts to be non-empty. The combined gate is allowed to
        #      default missing verdicts to Approve + ::warning:: for the
        #      human gate, but auto-approve is a stricter path: a missing
        #      LLM verdict must NOT silently synthesize an approval.
        #   2. The script uses `set -eEuo pipefail` (with -e) and
        #      explicitly asserts that the gh API idempotency probe and
        #      the gh pr review call both exited 0. A rate-limit or
        #      network failure can no longer leave the step green while
        #      the approval is unposted.
        #
        # Runs as github-actions[bot], which is NOT the PR author — so
        # the GitHub "reviewer cannot approve own PR" rule does not
        # block this (the author's machine would have been blocked, see
        # the babysit incident of 2026-08-03 / PR #557).
        if: |
          success() &&
          steps.combined_verdict.outputs.verdict == 'Approve' &&
          needs.scope.outputs.touches_prod == 'true' &&
          steps.combined_verdict.outputs.raw_review != '' &&
          steps.combined_verdict.outputs.raw_security != ''
        run: |
          set -eEuo pipefail
          # Idempotency: skip if the PR already has an APPROVED review
          # (re-runs of this job must not stack duplicate events). The
          # REST `pulls/{n}` endpoint does NOT expose review_decision
          # — that field is only available via the GraphQL `gh pr
          # view --json reviewDecision` query. Using the wrong field
          # would make the // "" fallback always return empty, the
          # APPROVED check fall through, and a re-run on an
          # already-approved PR would re-cast the approval. (CC-6
          # finding from the 2026-08-03 maintenance review of
          # PR #559.)
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json reviewDecision --jq '.reviewDecision // ""')
          if [ "$EXISTING" = "APPROVED" ]; then
            echo "PR already has reviewDecision=APPROVED; skipping auto-approve (idempotent)."
            exit 0
          fi
          echo "Casting auto-approve for PR #${PR_NUMBER} (review=Approve, security=Approve, touches_prod=true, both raw verdicts present)."
          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved by review.yml on clean combined verdict (review + security both Approve, PR touches production code, L3 evidence gate passed). The operator still owns the final merge step."
          echo "Auto-approve posted."
