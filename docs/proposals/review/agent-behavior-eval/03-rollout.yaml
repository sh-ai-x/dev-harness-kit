title: "03 — 단계별 도입 + 결정 기록"
status: design-discussion
date: 2026-07-31
tags: [rollout, phases, decisions, locked]
sections:
  - title: 단계별 도입 (Phase 0 → 2)
    body: |
      | Phase | 목표 | 산출물 | 게이트 | 실패 시 |
      |-------|------|--------|--------|--------|
      | **Phase 0** (이번 분기) | 결정적 4 차원 + trace 인프라 + 회귀 도구 | `lib/trace_log.py`, `lib/behavior_scorers/{outcome,process,efficiency,safety,aggregate}.py`, `tools/{trace_diff,cost_dashboard}.py`, `eval/rubrics/agent-behavior.yaml`, tests | 기존 eval 회귀 0, 5 golden case 동작 | 롤백 |
      | **Phase 1** (다음 분기) | LLM judge 통합 + PR 코멘트 자동화 | `lib/behavior_scorers/{communication,trajectory}.py`, `eval/prompts/judge-communication.md`, `judge-trajectory.md`, GitHub Action | judge variance < 0.5 | LLM judge default-off 유지 |
      | **Phase 2** (분기 후) | Batch eval + 추세 + 회귀 자동화 | `tools/replay_regression.py`, `.dev-kit/agent-behavior-history.jsonl` 누적 | 1 주 운영 후 회귀 없음 | 수동 fallback |

      **각 Phase 는 직전 Phase 게이트 통과 필수**.

  - title: Phase 0 — 결정적 4 차원 + trace 인프라 (즉시)
    body: |
      ### 작업
      - [ ] `lib/trace_log.py` — `TraceLog` / `TraceStep` dataclass + `save()` / `load()` (1d)
      - [ ] `lib/behavior_scorers/registry.py` — `DIM_AXES_BEHAVIOR` + `SCORER_REGISTRY` (0.5d)
      - [ ] `lib/behavior_scorers/outcome.py` — D1 (1d)
      - [ ] `lib/behavior_scorers/process.py` — D2 (1d)
      - [ ] `lib/behavior_scorers/efficiency.py` — D3 + baseline 처리 (1d)
      - [ ] `lib/behavior_scorers/safety.py` — D4 (1d)
      - [ ] `lib/behavior_scorers/aggregate.py` — verdict 규칙 (0.5d)
      - [ ] `tools/trace_diff.py` — 두 trace 비교 (1d)
      - [ ] `tools/cost_dashboard.py` — 정적 HTML (1d)
      - [ ] `eval/rubrics/agent-behavior.yaml` — rubric 등록 (0.5d)
      - [ ] `tests/test_trace_log.py` + `tests/test_agent_behavior.py` + `tests/test_trace_diff.py` (2d)
      - [ ] `lib/eval_runner.py` 확장: `--agent-behavior` 모드 추가 (1d)

      ### Effort
      **11.5일, $0, 신규 인프라 0, 신규 의존성 0**

      ### 게이트
      - 기존 eval (per-dim, harness-quality, os-quality) 회귀 0
      - 5 golden case 에 대해 end-to-end 동작 (TraceLog write + per-dim score + verdict + report.md)
      - `tools/trace_diff.py` 가 동일 trace 사이 diff 0 + 다른 trace 사이 delta 정확히 표시
      - `tests/test_*.py` 신규 모두 pass

  - title: Phase 1 — LLM judge 통합 (다음 분기)
    body: |
      ### 작업
      - [ ] `lib/behavior_scorers/communication.py` — D5 (LLM judge, axes 5 개) (1d)
      - [ ] `lib/behavior_scorers/trajectory.py` — D7 heuristic + LLM (1.5d)
      - [ ] `eval/prompts/judge-communication.md` (0.5d)
      - [ ] `eval/prompts/judge-trajectory.md` (0.5d)
      - [ ] `--no-llm` CLI flag (CI 게이트용) (0.5d)
      - [ ] cross-validate 3-judge (existing `cross_validate.cross_validate_scores`) (0.5d)

      ### 게이트
      - judge variance < 0.5 (cross_validate threshold)
      - `--no-llm` 모드 결과가 `--with-llm` 의 verdict 와 ≥ 80% 일치 (LLM skip 안정성)

  - title: Phase 2 — Batch / 추세 (분기 후)
    body: |
      ### 작업
      - [ ] `tools/replay_regression.py` — 동일 spec N회 replay + diff (2d)
      - [ ] `.dev-kit/agent-behavior-history.jsonl` 누적 + 1주 단위 윈도우 평균 (1d)
      - [ ] GitHub Action — PR 코멘트 자동 작성 (1d)

      ### 게이트
      - 1 주 운영 후 회귀 없음 (추세 안정성)
      - batch consistency ≥ 3.5 (N=5 동일 spec)

  - title: 결정 기록 (locked decisions)
    body: |
      | # | 결정 | 근거 |
      |---|------|------|
      | **L1** | 데이터 소스 = worktree 로그 (git, hooks, hand-off, transcript) | 외부 telemetry 인프라 의존 회피. L7 정렬 (흡수 위험 낮음) |
      | **L2** | 결정적 70% + LLM 30% | CI gate 에서 LLM 호출 회피. 속도 + 비용 + 재현성 |
      | **L3** | PR gate = 상대 변화만, 절대 threshold 금지 (LLM judge 한정) | LLM judge 의 절대 anchor 부재. 상대 비교로 안전 |
      | **L4** | worktree 1개 = 평가 단위 1개 | 자연스러운 매핑. cross-worktree 는 Phase 2 batch 로 |
      | **L5** | TraceLog JSON = append-only, schema_version 명시 | 진화 가능. v1 → v2 마이그레이션 가능 |
      | **L6** | 외부 telemetry 플랫폼 = 도입 안 함 (현 규모) | TCO / 운영비 / 데이터 외부 유출 모두 ROI 불일치 |
      | **L7** | `lib/eval_runner.py` 확장 시 기존 API 100% backward-compat | 기존 --harness-quality, --os-quality 모드 영향 0 |
      | **L8** | 신규 의존성 = 0 | 모두 표준 라이브러리 + 기존 `lib/llm_judge.py` 재사용 |

  - title: 비목표 (Out of scope)
    body: |
      - prompt engineering 자체 (judge prompt 품질은 별도 제안)
      - multi-tenant eval infra 공유 (팀 10+ 시점)
      - 외부 telemetry 플랫폼 (자체 인프라로 충분)
      - eval case 수 확장 (현재 12 case 유지)

  - title: 다음 단계
    body: |
      - **즉시**: Phase 0 작업 시작 (별도 worktree + PR)
      - **다음 분기**: Phase 1 — LLM judge 통합
      - **분기 후**: Phase 2 — Batch / 추세
