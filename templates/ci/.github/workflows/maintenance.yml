name: PR Maintenance Gate

# Thin consumer wrapper for sh-ai-x/dev-harness-kit-gates' reusable
# maintenance judge (Phase 4 migration, issue #12). The judge agent,
# 20-checkbox rubric application, verdict extraction, and severity
# gate all live in that repo now; this file only wires GitHub context
# + this repo's own vars/secrets/lib/ into the reusable's
# workflow_call inputs.
#
# docs_check_cmd / format_audit_cmd point at THIS repo's own
# `lib/maintenance_gate.py` -- a workflow_call reusable's `actions/checkout`
# (with no explicit `repository:` override) checks out the CALLER's repo,
# not the gates repo itself (GitHub Actions: `github.repository` inside a
# called reusable always resolves to the caller). So the reusable's
# `gate:` job, when invoked from here, has this repo's `lib/` directory
# available on disk -- these commands work exactly as they did when the
# logic was inline.
#
# Fork handling (unchanged from pre-migration): trusted fork PRs
# (author_association in OWNER/MEMBER/COLLABORATOR) still get a
# maintenance review via `pull_request_target`; the resolve/maintenance
# jobs' own `if:` does this vetting BEFORE the reusable ever runs, so
# `pr_is_from_fork` is always passed as 'false' -- the reusable's blanket
# fork skip is a courtesy for consumers with no finer-grained trust
# policy of their own; this consumer already has one.
#
# `severity_gate_enabled` is computed HERE (not just forwarded) so the
# unset-var-means-gate-runs backward-compat contract (see
# tests/test_workflow_gates_var.py and tests/test_maintenance_template.py)
# stays pinned in this file -- the repo variable that gates the
# maintenance job's deterministic check is read exactly once, below.
#
# Secret name `MINIMAX_API_KEY` is preserved from the prior workflow —
# do not rename (would break existing repo secret config).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (overrides vars.CI_REVIEW_PROVIDER)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - minimax
          - anthropic
          - deepseek
      pr_number:
        description: "PR number to maintenance-review"
        required: false
        type: string

jobs:
  resolve:
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name != github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.resolve.outputs.provider }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
    steps:
      - id: resolve
        run: |
          provider="${{ github.event.inputs.review_provider }}"
          [ -z "$provider" ] && provider="${{ vars.CI_REVIEW_PROVIDER }}"
          [ -z "$provider" ] && provider="minimax"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          pr_number="${{ github.event.pull_request.number }}"
          [ -z "$pr_number" ] && pr_number="${{ github.event.inputs.pr_number }}"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          {
            echo "pr_title<<EOF"
            printf '%s\n' "${{ github.event.pull_request.title }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  maintenance:
    needs: resolve
    uses: sh-ai-x/dev-harness-kit-gates/.github/workflows/maintenance.yml@v0.3.1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      provider: ${{ needs.resolve.outputs.provider }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      pr_title: ${{ needs.resolve.outputs.pr_title }}
      pr_is_from_fork: 'false'
      run_id: ${{ github.run_id }}
      severity_gate_enabled: ${{ vars.GATES_MAINTENANCE_ENABLED != 'false' }}
      bump_pr_skip_pattern: 'chore(release): bump dev-kit to v'
      docs_check_cmd: "python3 -m lib.maintenance_gate"
      format_audit_cmd: "python3 -m lib.maintenance_gate --format-audit"
    secrets:
      install_token: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}
      provider_api_key: ${{ needs.resolve.outputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || needs.resolve.outputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || secrets.MINIMAX_API_KEY }}
