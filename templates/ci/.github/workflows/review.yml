name: PR Review

# Auto-run /dev-kit:review (3-dim) and /dev-kit:security (10-dim OWASP) on every
# PR, in parallel. dev-kit plugin is installed from this checkout via a
# local marketplace symlink so the namespaced skills resolve.
#
# Severity gate + auto-approve (per claude-review-plugins spec):
#   Approve            (no critical, no major in BOTH review + security) → success + auto-approve
#   Changes Requested  (any major in either)                              → failure
#   Blocked            (any critical in either)                           → failure
#
# Empty-verdict gate (0.1.3+): missing verdict defaults to Approve with
# ::warning:: in BOTH pull_request and workflow_dispatch modes. The
# human gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what blocks merge.
#
# Why `pull_request` (not `pull_request_target`):
#   `anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1` does an OIDC token exchange by
#   default. With `pull_request_target` the exchanged token is rejected
#   with 401 Invalid OIDC token in any consumer repo that does not have
#   OIDC trust configured at the org/repo level. `pull_request` issues
#   a token the action's federation endpoint accepts, so the agent runs
#   and posts a verdict.
#
#   Trade-off: on `pull_request`, the action's workflow-validation gate
#   skips runs when the workflow file itself is modified on the PR head.
#   The first PR that ADDS `.github/workflows/review.yml` is the obvious
#   example; the verdict comes back empty, the severity gate defaults to
#   Approve + ::warning::, and the human review state is what actually
#   blocks merge. Normal PRs (not touching the workflow file) get a real
#   agent review.
#
#   The dev-harness-kit repo's own review.yml has always used
#   `pull_request` for this reason. The consumer template previously
#   used `pull_request_target` to attempt reviews on workflow-modifying
#   PRs, at the cost of breaking consumer repos without OIDC trust.
#
# Fork safety: `pull_request` runs in PR-head context (untrusted code
# from forks), but fork PRs still receive NO repo secrets (only
# GITHUB_TOKEN). The fork-safety guard
#   github.event.pull_request.head.repo.full_name == github.repository
# skips fork PRs BEFORE any step executes. workflow_dispatch is exempt
# (manual operator action).
#
# Secret name `MINIMAX_API_KEY` is preserved from prior workflow — do not
# rename (would break existing repo secret config).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (overrides vars.CI_REVIEW_PROVIDER)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - minimax
          - anthropic
      pr_number:
        description: "PR number to review"
        required: false
        type: string

# Cancel superseded re-runs on the same PR (e.g. force-push mid-review).
# workflow_dispatch runs are independent and use a separate group.
concurrency:
  group: review-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    # Fork-safety guard: skip silently for fork PRs (fork PRs have no
    # access to MINIMAX_API_KEY / DEV_KIT_GITHUB_TOKEN, so we don't even
    # run the install step on them). workflow_dispatch is exempt -- the
    # operator is trusted.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
      verdict_source: ${{ steps.extract_verdict.outputs.verdict_source }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
      # Used by the consumer-install branch of the install step below when
      # the dev-harness-kit source is private. Optional for self-install.
      DEV_KIT_GITHUB_TOKEN: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Checkout PR head sha. With `pull_request`, the action defaults
          # to the PR head ref, but we pin the explicit sha so the agent
          # reads the exact files in the diff.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install dev-kit plugin
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          # Self-aware install: if the checkout IS the dev-kit plugin
          # (has the manifest + required skills), symlink it.
          # Otherwise (consumer repo via ci-setup), clone the source.
          # When the source is private, the consumer must provision a
          # fine-grained PAT with contents:read on sh-ai-x/dev-harness-kit
          # as a repo secret named DEV_KIT_GITHUB_TOKEN.
          if [ -f "$GITHUB_WORKSPACE/.claude-plugin/plugin.json" ] \
             && [ -d "$GITHUB_WORKSPACE/skills/review" ] \
             && [ -d "$GITHUB_WORKSPACE/skills/security" ]; then
            ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
            echo "::notice::dev-kit self-install: symlinked $GITHUB_WORKSPACE"
          else
            if [ -z "$DEV_KIT_GITHUB_TOKEN" ]; then
              echo "::error::DEV_KIT_GITHUB_TOKEN secret is required for consumer-install."
              echo "  sh-ai-x/dev-harness-kit is private; provision a fine-grained"
              echo "  PAT with contents:read on sh-ai-x/dev-harness-kit and set it"
              echo "  as a repo secret named DEV_KIT_GITHUB_TOKEN in this repo's"
              echo "  Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::notice::dev-kit consumer-install: cloning sh-ai-x/dev-harness-kit via DEV_KIT_GITHUB_TOKEN"
            git clone --depth 1 \
              "https://x-access-token:${DEV_KIT_GITHUB_TOKEN}@github.com/sh-ai-x/dev-harness-kit.git" \
              ~/.claude/plugins/marketplaces/dev-kit
          fi
          # Always verify the install succeeded (catches both paths).
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/review
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/security
          echo "dev-kit plugin installed: $(readlink ~/.claude/plugins/marketplaces/dev-kit || echo 'real')"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="${{ vars.CI_REVIEW_PROVIDER }}"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$provider" ]; then
            echo "::error::No provider resolved. Set the GitHub repo variable:"
            echo "  gh variable set CI_REVIEW_PROVIDER --body anthropic"
            echo "or pass review_provider on a manual workflow_dispatch run."
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:review via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        # MiniMax channel: env-only (no with.anthropic_api_key to avoid mixed auth).
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          track_progress: false  # force per-line inline comments (track_progress: true suppresses them)
          prompt: |
            Load the /dev-kit:review skill from $HOME/.claude/plugins/marketplaces/dev-kit/skills/review/SKILL.md
            (use the Read tool). Follow its protocol. After analysis, post the
            Layer-2 summary as a single PR comment via:
              gh pr comment "${{ steps.provider.outputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>" so trailing prose that echoes this example
            won't accidentally satisfy the gate.)

            Render the standard two-layer output (PR summary at top, per-finding
            inline comments). The summary MUST begin with a single line exactly
            of the form:

              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked

            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)

            Map verdict strictly to severity (do NOT inflate):
              - 🔴 critical ≥ 1          → Verdict: Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → Verdict: Changes Requested
              - no 🔴, no 🟠             → Verdict: Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false  # force per-line inline comments (track_progress: true suppresses them)
          prompt: |
            Load the /dev-kit:review skill from $HOME/.claude/plugins/marketplaces/dev-kit/skills/review/SKILL.md
            (use the Read tool). Follow its protocol. After analysis, post the
            Layer-2 summary as a single PR comment via:
              gh pr comment "${{ steps.provider.outputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>" so trailing prose that echoes this example
            won't accidentally satisfy the gate.)

            Render the standard two-layer output. The summary MUST begin
            with a single line exactly of the form:

              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked

            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Detect bootstrap-PR fallback
        id: fallback
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needs_fallback=false (workflow_dispatch)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 skips when the PR head's
          # .github/workflows/*.yml differs from the default branch.
          workflow_files=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null \
            | grep -E '^\.github/workflows/.+\.ya?ml$' || true)
          if [ -n "$workflow_files" ]; then
            listed=$(echo "$workflow_files" | paste -sd, -)
            echo "::notice::PR modifies workflow files (${listed}); claude-code-action will skip."
            echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fallback verdict comment (review)
        if: steps.fallback.outputs.needs_fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Verdict: Approve"
            echo
            echo "LLM review (3-dim) skipped -- workflow validation guard"
            echo
            echo 'anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 refused to run because this PR modifies one or more files under .github/workflows/. The action enforces identical content with the default branch as a self-protection guard.'
            echo
            echo "Action required: manual review of the workflow changes by a maintainer before merge."
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Extract review verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          if [ "${{ steps.fallback.outputs.needs_fallback }}" = "true" ]; then
            echo "review_verdict=Approve (fallback: PR modifies workflow files)"
            echo "verdict=Approve" >> "$GITHUB_OUTPUT"
            echo "verdict_source=needs-fallback-bootstrap-pr" >> "$GITHUB_OUTPUT"
            # Issue #219 Bug 2: in the fallback branch, the agent never ran —
            # claude-code-action@v1's workflow-validation guard refused it.
            # The hardcoded agent_ran=true previously masked the skip as a
            # silent pass, defeating the gate's agent_ran=false → exit 1
            # hard-fail. Report the real state so the gate can surface the
            # bootstrap-PR remediation message.
            echo "agent_ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Issue #244 root-cause fix: read the verdict from the agent's
          # actual output file (claude-execution-output.json) instead of
          # grepping PR comments. The comment-grep fallback was the source
          # of deterministic gate flapping on boilerplate-web PR #18: the
          # `grep | tail -1` picked up a stale "Verdict: Changes Requested"
          # from the previous push, defeating the severity gate's own
          # "default to Approve on empty verdict" tolerance.
          AGENT_OUTPUT="${{ runner.temp }}/claude-execution-output.json"
          if [ ! -f "$AGENT_OUTPUT" ]; then
            AGENT_OUTPUT="/home/runner/work/_temp/claude-execution-output.json"
          fi
          # Issue #625: fetch PR comments for THIS run (filtered by run_id) so
          # extract-verdict.py can recover the verdict when the MINIMAX
          # provider drops the assistant stream from the execution file.
          # The run_id filter defeats #244's stale-comment flap — by
          # construction only comments posted in THIS run are candidates.
          COMMENTS_FILE="${{ runner.temp }}/pr-comments-this-run.json"
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.inputs.pr_number }}/comments" \
              --jq ".[] | select(.body | contains(\"run=${{ github.run_id }}\")) | {body: .body}" \
              > "$COMMENTS_FILE" 2>/dev/null || echo "[]" > "$COMMENTS_FILE"
          file_verdict=""
          if [ -f "$AGENT_OUTPUT" ]; then
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract-verdict.py" "$AGENT_OUTPUT" "$COMMENTS_FILE" 2>/dev/null || echo '')"
          else
            # Execution file genuinely missing — still try the comments
            # fallback before defaulting.
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract-verdict.py" /dev/null "$COMMENTS_FILE" 2>/dev/null || echo '')"
          fi
          # Track which path produced the verdict for the audit comment.
          # file-only path → agent-output-file; comments fallback → agent-pr-comment.
          comment_fallback_used="false"
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            # Issue #612 fix: extract-verdict.py saw the file existed
            # with parseable content but no recognizable `Verdict:`
            # line — the agent ran but did not follow the verdict
            # contract. Thread the PARSE_FAILED sentinel through to
            # the gate so it hard-fails with the dedicated remediation
            # message (see the gate's PARSE_FAILED branch) instead of
            # silently defaulting to Approve (the old consumer-facing
            # bug). The audit comment's source field now records
            # `parse-failed-no-verdict` so the reviewer can see the
            # actual failure mode without re-reading the gate logs.
            #
            # Issue #625 exception: when MINIMAX is the provider, the
            # execution file lacks assistant messages even though the
            # agent DID post a verdict as a PR comment. extract-verdict.py
            # tried the comments fallback internally — if it found a
            # verdict there, file_verdict is no longer PARSE_FAILED.
            # If we got here with PARSE_FAILED still set, the comments
            # fallback ALSO didn't find a verdict, so the original
            # #612 hard-fail logic still applies.
            echo "::warning::review verdict missing (file=${AGENT_OUTPUT} produced no parseable 'Verdict:' line); gate will hard-fail with parse-failed-no-verdict remediation"
            verdict="PARSE_FAILED"
            verdict_source="parse-failed-no-verdict"
            agent_ran="true"
          elif [ -n "$file_verdict" ]; then
            verdict="$file_verdict"
            # The PR-comments fallback is engaged when the execution
            # file was missing / unreadable / HTML / PARSE_FAILED — the
            # script's contract is "file verdict wins when present;
            # fall through to comments otherwise". Infer which path
            # produced this verdict from the AGENT_OUTPUT state.
            if [ ! -f "$AGENT_OUTPUT" ]; then
              verdict_source="agent-pr-comment"
              comment_fallback_used="true"
            else
              verdict_source="agent-output-file"
            fi
            agent_ran="true"
          else
            # Genuine no-file path: extract-verdict.py returned empty
            # because the file is missing / HTML / unreadable /
            # suspiciously small AND the comments fallback also found
            # nothing. Tolerance is appropriate for these transient
            # filesystem / network cases — the gate's existing
            # contract treats empty as "I couldn't read the file"
            # rather than "the agent ran but produced no verdict"
            # (that case now flows through the PARSE_FAILED arm above).
            case "${{ job.status }}" in
              cancelled|failure)
                # Issue #638: cancelled/failed upstream agent is NOT
                # default-Approve. agent_ran=false routes through the
                # gate's "AI agent was skipped" hard-fail branch (gate
                # L812-861); the empty-file `*)` arm below keeps its
                # existing tolerance (file genuinely missing).
                echo "::warning::review verdict missing (job.status=${{ job.status }}, transient); gate will hard-fail via agent_ran=false"
                verdict=""
                verdict_source="default-no-verdict-job-${{ job.status }}"
                agent_ran="false"
                ;;
              *)
                echo "::warning::review verdict missing (no agent output file at ${AGENT_OUTPUT}); defaulting to Approve"
                verdict="Approve"
                verdict_source="default-approve-no-file"
                agent_ran="false"
                ;;
            esac
          fi
          # Issue #625 comment-derived fallback: only attempts when
          # extract-verdict.py returned PARSE_FAILED (e.g. provider=minimax
          # wrapper-format envelope). The cutoff filter on createdAt avoids
          # resurrecting stale verdicts from previous pushes (issue #244
          # root-cause). When no comment matches, the PARSE_FAILED sentinel
          # stands and the gate hard-fails with the remediation message.
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            CUTOFF="${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}"
            comments_json=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.author.login | startswith("claude")) | {body, createdAt}' 2>/dev/null || true)
            if [ -n "$comments_json" ]; then
              comment_verdict=$(printf '%s' "$comments_json" | VERDICT_COMMENT_CUTOFF="$CUTOFF" python3 "${{ github.workspace }}/.github/workflows/_verdict_from_comment.py" 2>/dev/null || true)
              if [ -n "$comment_verdict" ]; then
                verdict="$comment_verdict"
                verdict_source="comments-fallback"
                agent_ran="true"
                echo "::notice::review verdict recovered from PR comments: ${verdict}"
              fi
            fi
          fi
          echo "review_verdict=${verdict}  source=${verdict_source}  agent_ran=${agent_ran}"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "verdict_source=${verdict_source}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"
          audit_body="<!-- dev-kit-verdict-audit --> run=${{ github.run_id }} job=review status=${{ job.status }} verdict=${verdict:-MISSING} source=${verdict_source:-unknown}"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  security:
    # See review-job comment above; same fork-safety contract.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: /dev-kit:security (10-dim OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
      verdict_source: ${{ steps.extract_verdict.outputs.verdict_source }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
      DEV_KIT_GITHUB_TOKEN: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Checkout PR head sha. With `pull_request`, the action defaults
          # to the PR head ref, but we pin the explicit sha so the agent
          # reads the exact files in the diff.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install dev-kit plugin
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          # Self-aware install: if the checkout IS the dev-kit plugin
          # (has the manifest + required skills), symlink it.
          # Otherwise (consumer repo via ci-setup), clone the source.
          # When the source is private, the consumer must provision a
          # fine-grained PAT with contents:read on sh-ai-x/dev-harness-kit
          # as a repo secret named DEV_KIT_GITHUB_TOKEN.
          if [ -f "$GITHUB_WORKSPACE/.claude-plugin/plugin.json" ] \
             && [ -d "$GITHUB_WORKSPACE/skills/review" ] \
             && [ -d "$GITHUB_WORKSPACE/skills/security" ]; then
            ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
            echo "::notice::dev-kit self-install: symlinked $GITHUB_WORKSPACE"
          else
            if [ -z "$DEV_KIT_GITHUB_TOKEN" ]; then
              echo "::error::DEV_KIT_GITHUB_TOKEN secret is required for consumer-install."
              echo "  sh-ai-x/dev-harness-kit is private; provision a fine-grained"
              echo "  PAT with contents:read on sh-ai-x/dev-harness-kit and set it"
              echo "  as a repo secret named DEV_KIT_GITHUB_TOKEN in this repo's"
              echo "  Settings → Secrets and variables → Actions."
              exit 1
            fi
            echo "::notice::dev-kit consumer-install: cloning sh-ai-x/dev-harness-kit via DEV_KIT_GITHUB_TOKEN"
            git clone --depth 1 \
              "https://x-access-token:${DEV_KIT_GITHUB_TOKEN}@github.com/sh-ai-x/dev-harness-kit.git" \
              ~/.claude/plugins/marketplaces/dev-kit
          fi
          # Always verify the install succeeded (catches both paths).
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/review
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/security
          echo "dev-kit plugin installed: $(readlink ~/.claude/plugins/marketplaces/dev-kit || echo 'real')"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="${{ vars.CI_REVIEW_PROVIDER }}"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$provider" ]; then
            echo "::error::No provider resolved. Set the GitHub repo variable:"
            echo "  gh variable set CI_REVIEW_PROVIDER --body anthropic"
            echo "or pass review_provider on a manual workflow_dispatch run."
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:security via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          track_progress: false  # force per-line inline comments (track_progress: true suppresses them)
          prompt: |
            Load the /dev-kit:security skill from $HOME/.claude/plugins/marketplaces/dev-kit/skills/security/SKILL.md
            (use the Read tool). Follow its protocol. After analysis, post the
            security summary as a single PR comment via:
              gh pr comment "${{ steps.provider.outputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>" so trailing prose that echoes this example
            won't accidentally satisfy the gate.)

            Render the security summary (per-category breakdown table + Verdict).
            The summary MUST begin with a single line exactly of the form:

              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked

            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)

            Map verdict per spec:
              - 🔴 critical ≥ 1          → Verdict: Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → Verdict: Changes Requested
              - no 🔴, no 🟠             → Verdict: Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false  # force per-line inline comments (track_progress: true suppresses them)
          prompt: |
            Load the /dev-kit:security skill from $HOME/.claude/plugins/marketplaces/dev-kit/skills/security/SKILL.md
            (use the Read tool). Follow its protocol. After analysis, post the
            security summary as a single PR comment via:
              gh pr comment "${{ steps.provider.outputs.pr_number }}" --body "..."

            The body MUST begin with a single line of exactly one of:
              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked
            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>" so trailing prose that echoes this example
            won't accidentally satisfy the gate.)

            Render the security summary. The summary MUST begin with a single
            line exactly of the form:

              Verdict: Approve
              Verdict: Changes Requested
              Verdict: Blocked

            (Do not use the bold-wrapped form here; the gate's regex parses
            only "Verdict: <value>".)
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Detect bootstrap-PR fallback
        id: fallback
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needs_fallback=false (workflow_dispatch)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 skips when the PR head's
          # .github/workflows/*.yml differs from the default branch.
          workflow_files=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null \
            | grep -E '^\.github/workflows/.+\.ya?ml$' || true)
          if [ -n "$workflow_files" ]; then
            listed=$(echo "$workflow_files" | paste -sd, -)
            echo "::notice::PR modifies workflow files (${listed}); claude-code-action will skip."
            echo "needs_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fallback verdict comment (security)
        if: steps.fallback.outputs.needs_fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Verdict: Approve"
            echo
            echo "LLM security (10-dim OWASP) skipped -- workflow validation guard"
            echo
            echo 'anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 refused to run because this PR modifies one or more files under .github/workflows/. The action enforces identical content with the default branch as a self-protection guard.'
            echo
            echo "Action required: manual review of the workflow changes by a maintainer before merge."
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Extract security verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          if [ "${{ steps.fallback.outputs.needs_fallback }}" = "true" ]; then
            echo "security_verdict=Approve (fallback: PR modifies workflow files)"
            echo "verdict=Approve" >> "$GITHUB_OUTPUT"
            echo "verdict_source=needs-fallback-bootstrap-pr" >> "$GITHUB_OUTPUT"
            # Issue #219 Bug 2: same defect as the review extract step —
            # report agent_ran=false so the severity gate can hard-fail
            # with the bootstrap-PR remediation message.
            echo "agent_ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Issue #244 root-cause fix: same as the review extract step —
          # read from the agent's output file, never grep PR comments.
          AGENT_OUTPUT="${{ runner.temp }}/claude-execution-output.json"
          if [ ! -f "$AGENT_OUTPUT" ]; then
            AGENT_OUTPUT="/home/runner/work/_temp/claude-execution-output.json"
          fi
          # Issue #625: same comment-fallback fetch as the review job — see
          # that step for the rationale (MINIMAX provider drops the
          # assistant stream; recover from PR comments filtered by run_id).
          COMMENTS_FILE="${{ runner.temp }}/pr-comments-this-run.json"
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.inputs.pr_number }}/comments" \
              --jq ".[] | select(.body | contains(\"run=${{ github.run_id }}\")) | {body: .body}" \
              > "$COMMENTS_FILE" 2>/dev/null || echo "[]" > "$COMMENTS_FILE"
          file_verdict=""
          if [ -f "$AGENT_OUTPUT" ]; then
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract-verdict.py" "$AGENT_OUTPUT" "$COMMENTS_FILE" 2>/dev/null || true)"
          else
            file_verdict="$(python3 "${{ github.workspace }}/scripts/extract-verdict.py" /dev/null "$COMMENTS_FILE" 2>/dev/null || true)"
          fi
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            # Issue #612 fix (symmetric with the review job): the agent
            # ran (file exists, JSONL parseable) but did not emit a
            # recognizable `Verdict:` line. Thread the PARSE_FAILED
            # sentinel through to the gate so it hard-fails with the
            # dedicated remediation message instead of silently
            # defaulting to Approve (the old consumer-facing bug).
            #
            # Issue #625 exception: see review-job comment for the
            # MINIMAX-fallback rationale.
            echo "::warning::security verdict missing (file=${AGENT_OUTPUT} produced no parseable 'Verdict:' line); gate will hard-fail with parse-failed-no-verdict remediation"
            verdict="PARSE_FAILED"
            verdict_source="parse-failed-no-verdict"
            agent_ran="true"
          elif [ -n "$file_verdict" ]; then
            verdict="$file_verdict"
            if [ ! -f "$AGENT_OUTPUT" ]; then
              verdict_source="agent-pr-comment"
            else
              verdict_source="agent-output-file"
            fi
            agent_ran="true"
          else
            # Genuine no-file path: extract-verdict.py returned empty
            # because the file is missing / HTML / unreadable /
            # suspiciously small AND the comments fallback also found
            # nothing. Tolerance is appropriate for these transient
            # filesystem / network cases — see the review-job comment
            # above for the full rationale.
            case "${{ job.status }}" in
              cancelled|failure)
                # Issue #638 fix (symmetric with the review job above):
                # a cancelled or failed upstream agent MUST be treated
                # as agent_ran=false so the severity gate's "AI agent
                # was skipped" hard-fail branch fires. Do NOT default-
                # Approve on a missed upstream run.
                echo "::warning::security verdict missing (job.status=${{ job.status }}, transient); gate will hard-fail via agent_ran=false"
                verdict=""
                verdict_source="default-no-verdict-job-${{ job.status }}"
                agent_ran="false"
                ;;
              *)
                echo "::warning::security verdict missing (no agent output file at ${AGENT_OUTPUT}); defaulting to Approve"
                verdict="Approve"
                verdict_source="default-approve-no-file"
                agent_ran="false"
                ;;
            esac
          fi
          # Issue #625 comment-derived fallback: symmetric with the review
          # job — when extract-verdict.py returned PARSE_FAILED, attempt
          # to recover the verdict from the most recent claude-prefixed
          # PR comment. Cutoff filter avoids stale verdicts (issue #244).
          if [ "$file_verdict" = "PARSE_FAILED" ]; then
            CUTOFF="${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}"
            comments_json=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.author.login | startswith("claude")) | {body, createdAt}' 2>/dev/null || true)
            if [ -n "$comments_json" ]; then
              comment_verdict=$(printf '%s' "$comments_json" | VERDICT_COMMENT_CUTOFF="$CUTOFF" python3 "${{ github.workspace }}/.github/workflows/_verdict_from_comment.py" 2>/dev/null || true)
              if [ -n "$comment_verdict" ]; then
                verdict="$comment_verdict"
                verdict_source="comments-fallback"
                agent_ran="true"
                echo "::notice::security verdict recovered from PR comments: ${verdict}"
              fi
            fi
          fi
          echo "security_verdict=${verdict}  source=${verdict_source}  agent_ran=${agent_ran}"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "verdict_source=${verdict_source}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"
          audit_body="<!-- dev-kit-verdict-audit --> run=${{ github.run_id }} job=security status=${{ job.status }} verdict=${verdict:-MISSING} source=${verdict_source:-unknown}"
          gh pr comment "$PR_NUMBER" --body "$audit_body"

  gate:
    # Severity gate: same fork-safety guard. Pull from job outputs --
    # the if: always() needs to stay so the gate runs even when agents
    # were skipped, so we AND it with the fork check.
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    name: severity gate (review + security)
    runs-on: ubuntu-latest
    needs: [review, security]
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout (for gh CLI git discovery)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Combined verdict gate
        run: |
          # Read verdicts directly from each job's outputs (set by the
          # 'Extract <skill> verdict' post-step in review + security jobs).
          # This is robust: no fragile comment-body matching required.
          R="${{ needs.review.outputs.verdict }}"
          S="${{ needs.security.outputs.verdict }}"
          # agent_ran: false when anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 SKIPPED
          # the run due to workflow-validation. Set by the 'Extract <skill>
          # verdict' post-step based on whether any claude-prefixed comment
          # exists on the PR. The action skips silently on PRs that touch
          # .github/workflows/* (and on bootstrap-PRs that add the file).
          R_AGENT="${{ needs.review.outputs.agent_ran }}"
          S_AGENT="${{ needs.security.outputs.agent_ran }}"
          # verdict_source: classifier that produced the verdict (issue #625).
          # Used by the agent_ran=false arm to pick the correct remediation
          # text: 'needs-fallback-bootstrap-pr' (PR touches a workflow file
          # so the action skipped) vs 'default-approve-no-file' (action ran
          # but produced no execution file -- distinct failure mode).
          R_SOURCE="${{ needs.review.outputs.verdict_source }}"
          S_SOURCE="${{ needs.security.outputs.verdict_source }}"
          # Job-level results: success | failure | cancelled | skipped.
          # Issue #212-C1: if the upstream agent job FAILED, the empty
          # verdict is "agent never ran" (e.g. DEV_KIT_GITHUB_TOKEN missing,
          # action rate-limit, install error), NOT "agent ran and gave
          # no severity". Distinct failure mode → distinct gate behavior:
          # hard-fail (exit 1) so the install problem surfaces instead of
          # being papered over by the Approve default.
          R_RESULT="${{ needs.review.result }}"
          S_RESULT="${{ needs.security.result }}"
          EVENT="$EVENT_NAME"
          echo "review=$R (result=$R_RESULT, agent_ran=$R_AGENT)"
          echo "security=$S (result=$S_RESULT, agent_ran=$S_AGENT)"

          # Issue #212-C1-fix: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 exits 0 with
          # a "workflow validation skip" warning when the PR's head differs
          # from the default branch under .github/workflows/*. Result is
          # "success" (the action's exit-0 mask), but the agent never ran —
          # `agent_ran=false` is the unambiguous signal. Defaulting to
          # Approve on empty verdict in this case masked the skip as a
          # silent pass (the bootstrap-PR / PR-modifies-workflow scenario).
          # Hard-fail with a remediation message so the user knows to merge
          # the workflow change first and re-push from a clean branch.
          # Issue #625: split the agent_ran=false remediation text by
          # verdict_source. The bootstrap-PR text below only applies when
          # the workflow-validation guard actually skipped the action
          # (verdict_source=needs-fallback-bootstrap-pr). On PRs that do
          # NOT touch .github/workflows/* but still see agent_ran=false
          # (e.g. provider=minimax returns no execution file -- the parser
          # defaults to default-approve-no-file), print a generic "no
          # execution file" remediation pointing at the action logs /
          # provider switch instead of the misleading workflow-merge
          # message.
          #
          # Backward-compat: when R_SOURCE / S_SOURCE is empty (older
          # extract-verdict versions that did not emit a source label, or
          # future call sites that forget to set it), default to the
          # bootstrap arm so existing tests / workflows still behave
          # like before this split. The new "no execution file" arm
          # fires only when the source is explicitly set to a non-
          # bootstrap value (default-approve-no-file, parse-failed-no-
          # verdict, etc.).
          if [ "$R_AGENT" = "false" ] || [ "$S_AGENT" = "false" ]; then
            if [ "$R_SOURCE" = "needs-fallback-bootstrap-pr" ] || [ "$S_SOURCE" = "needs-fallback-bootstrap-pr" ] || [ -z "$R_SOURCE$S_SOURCE" ]; then
              {
                echo "::error::review+security gate: AI agent was skipped"
                echo "  review.agent_ran=$R_AGENT verdict=$R source=$R_SOURCE"
                echo "  security.agent_ran=$S_AGENT verdict=$S source=$S_SOURCE"
                echo
                echo "  anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 refused to run on this PR."
                echo "  The action refuses any PR whose head differs from the"
                echo "  default branch under .github/workflows/*. Result is"
                echo "  success (exit-0), but no claude[bot] comment was posted"
                echo "  -- the 'Approve' verdict in the gate was the empty-verdict"
                echo "  tolerance, NOT an actual AI review."
                echo
                echo "  Fix:"
                echo "    1. Merge this PR's workflow changes to main first."
                echo "    2. Re-open or sync from the updated default branch."
                echo "    3. Future PRs (without workflow modifications) will run"
                echo "       the agent normally and post real verdicts + inline"
                echo "       comments."
              } >&2
              exit 1
            fi
            {
              echo "::error::review+security gate: AI agent produced no execution file"
              echo "  review.agent_ran=$R_AGENT verdict=$R source=$R_SOURCE"
              echo "  security.agent_ran=$S_AGENT verdict=$S source=$S_SOURCE"
              echo
              echo "  anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 exited 0 but did not produce"
              echo "  a claude-execution-output.json at the expected path."
              echo "  This is NOT the workflow-validation skip (the PR does"
              echo "  not touch .github/workflows/*); the action ran but"
              echo "  its output envelope was empty or unreadable."
              echo
              echo "  Common causes:"
              echo "    - provider=minimax occasionally returns no execution"
              echo "      file when the conversation stream is missing (see"
              echo "      issue #625). Consider switching CI_REVIEW_PROVIDER"
              echo "      to 'anthropic' for this PR."
              echo "    - action rate-limit masked by exit-0"
              echo "    - transient filesystem / network error"
              echo
              echo "  Fix:"
              echo "    - Inspect the 'Run anthropics/claude-code-action' step"
              echo "      logs in the GH Actions run for the actual reason."
              echo "    - If the failure mode is recurring for provider=minimax,"
              echo "      set CI_REVIEW_PROVIDER=anthropic via 'gh variable set'."
            } >&2
            exit 1
          fi

          # Hard-fail gate if EITHER upstream job actually failed (not
          # skipped/cancelled). An empty verdict + failure result is the
          # canonical "install is broken" signature from issue #212.
          if [ "$R_RESULT" = "failure" ] || [ "$S_RESULT" = "failure" ]; then
            {
              echo "::error::review+security gate: upstream agent job failed"
              echo "  review.result=$R_RESULT verdict=$R"
              echo "  security.result=$S_RESULT verdict=$S"
              echo
              echo "  This means the /dev-kit:* agent never produced a verdict,"
              echo "  most often because one of:"
              echo "    - DEV_KIT_GITHUB_TOKEN secret missing or expired"
              echo "    - MINIMAX_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY missing"
              echo "    - dev-kit plugin install failed (see 'Install dev-kit plugin' step)"
              echo "    - anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1 rate-limit / transient network error"
              echo
              echo "  The severity gate does NOT default to Approve on failure"
              echo "  (that would mask install bugs -- issue #212-C1)."
            } >&2
            exit 1
          fi

          # Tolerate missing verdicts in BOTH event modes WHEN the upstream
          # job actually succeeded / was skipped (workflow-validation skip on
          # the very PR that ADDS .github/workflows/review.yml, action
          # rate-limit masked by success, transient network error). The
          # fix: default to Approve + ::warning:: so the human gate
          # (REVIEW_REQUIRED / CHANGES_REQUESTED on the PR) is what
          # actually blocks merge, not a single missing agent verdict.
          [ -z "$R" ] && { echo "::warning::review verdict missing (event=$EVENT, result=$R_RESULT); defaulting to Approve"; R="Approve"; }
          [ -z "$S" ] && { echo "::warning::security verdict missing (event=$EVENT, result=$S_RESULT); defaulting to Approve"; S="Approve"; }

          # Issue #397: PARSE_FAILED is a parse-error sentinel, NOT an
          # "unparseable verdict" in the tolerance sense. The extract
          # step emits the literal string `PARSE_FAILED` when the agent's
          # output file existed and the agent ran, but the parser could
          # not extract a recognizable `**Verdict:** <value>` line from
          # the JSON envelope (e.g. the agent posted an inline comment
          # but no summary, or the wrapper changed the message shape).
          # The previous tolerance treated `PARSE_FAILED` as just another
          # unparseable string and exited 0 — masking a broken parser as
          # a passing review. Hard-fail here so the user MUST fix the
          # parser instead of silently letting the gate pass on an
          # inconclusive review. Distinct from `agent_ran=false` (skip)
          # and `R_RESULT=failure` (install broken) — those fire earlier;
          # this fires when the agent DID run but the parser couldn't
          # read its output.
          if [ "$R" = "PARSE_FAILED" ] || [ "$S" = "PARSE_FAILED" ]; then
            {
              echo "::error::review+security gate: verdict parser failed"
              echo "  review.verdict=$R  security.verdict=$S"
              echo "  The agent ran (output file existed + was parseable"
              echo "  JSONL) but no assistant message contained a"
              echo "  recognizable 'Verdict:' line. This is NOT a"
              echo "  successful pass -- the review is inconclusive."
              echo
              echo "  Common causes:"
              echo "    - Agent ran but did not post the verdict summary"
              echo "      (issue #612 consumer bug: provider ran"
              echo "      successfully, posted inline comments, but the"
              echo "      final summary was missing or malformed)"
              echo "    - Agent's output envelope changed (the parser"
              echo "      reads a different JSON field than the wrapper"
              echo "      now emits)"
              echo "    - Agent output was truncated or empty"
              echo
              echo "  Fix:"
              echo "    - Update extract-verdict.py to handle the new"
              echo "      output shape, OR"
              echo "    - Update the agent's prompt to always emit a"
              echo "      single-line 'Verdict: Approve|Changes Requested|Blocked'"
              echo "      summary (extract-verdict.py uses a non-bold regex;"
              echo "      see templates/ci/scripts/extract-verdict.py:VERDICT_RE)"
            } >&2
            exit 1
          fi

          # worst-of wins
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          echo "Combined worst verdict: $worst"

          # Tolerate unparseable verdicts (e.g. "Requested", "Skipped", or
          # unexpected formats from the /dev-kit:* agents): treat as non-
          # blocking by analogy with the workflow_dispatch branch above — the
          # human gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what actually
          # blocks merge, not a single regex trip.
          if ! { [ "$worst" = "Approve" ] || [ "$worst" = "Changes Requested" ] || [ "$worst" = "Blocked" ]; }; then
            echo "::warning::Unparseable verdict '$worst' (review='$R' security='$S'); treating as non-blocking."
            exit 0
          fi

          case "$worst" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R security=$S)"; exit 1 ;;
            *) echo "::error::Unparseable verdict '$worst' (review=$R security=$S)"; exit 1 ;;
          esac

      - name: Auto-approve on Approve verdict
        if: success() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only auto-approve on Approve (lowest severity — no 🔴 critical,
          # no 🟠 major). Fail-open: if the API rejects (GitHub's default
          # GITHUB_TOKEN cannot approve PRs), log a warning. Set APPROVE_TOKEN
          # secret to a PAT with 'repo' scope for real auto-approval.
          R="${{ needs.review.outputs.verdict }}"
          S="${{ needs.security.outputs.verdict }}"
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          if [ "$worst" = "Approve" ]; then
            echo "Verdict is Approve — attempting auto-approve."
            TOKEN="${APPROVE_TOKEN:-$GH_TOKEN}"
            gh pr review "$PR_NUMBER" --approve \
              --body "Auto-approved by /dev-kit:review + /dev-kit:security: lowest severity (no 🔴 critical, no 🟠 major)." \
              || echo "::warning::gh pr review --approve rejected. Set APPROVE_TOKEN secret to a PAT for real auto-approval; verdict itself was Approve."
          else
            echo "Verdict is '$worst' -- not auto-approving."
          fi
