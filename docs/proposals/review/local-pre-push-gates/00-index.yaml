  - title: Net-net
    body: |
      | Dimension | Before | After Phase 1 (core) | After Phase 2 (opt-in) |
      |---|---|---|---|
      | Provider tokens on a stale-ref push | $1-3 (LLM judges fire) | **$0** (issue-sync catches pre-LLM) | $0 (same) |
      | Provider tokens on a failing-test push | $1-3 | $1-3 (opt-in off by default) | **$0** (if user opts in) |
      | Local wall-clock per push | 0s | **<10s** (issue-sync) | 30-120s (test/validate/lint) |
      | Local CPU/memory per push | 0 | **negligible** | 200-500MB RAM (opt-in) |
      | Local hooks added | 0 | 1 (`hooks/pre-push.sh`) | same hook, opt-in config |
      | Severity review (LLM fan-out + comments) | GitHub Actions | **GitHub Actions** (unchanged — MUST stay remote) | unchanged |
      | Lines of code changed | n/a | ~250 (1 hook + 1 parser flag + 4 tests) | +30 (opt-in config) |

      **Three constraints balanced**:
      1. **Provider tokens** (primary win) — Phase 1 alone saves $1-3
         per stale-ref push.
      2. **Local CPU/memory** (user-flagged concern) — Phase 1 is
         negligible; Phase 2 is opt-in precisely to preserve resources.
      3. **Wall-clock** (explicitly NOT the goal) — secondary; only
         Phase 2 trades wall-clock for more token savings.

      **Apply? YES (Phase 0 → Phase 1 → Phase 2 opt-in).**
