title: Notify-mode hooks with prompt-cache-stable LLM channel and timeout-free design
status: draft
date: 2026-09-10
tags: [hooks, tdd-guard, worktree-guard, tdd-scope, context-window-guard, prompt-cache, session-state, lvm-channel, hook-timeout, fail-open, cwd-skill]

before:
  summary: |
    PR #836 (`fix/remove-userpromptsubmit-advisories`) deleted three
    hooks — `worktree-auto-cut`, `tdd-scope-judge`,
    `context-window-guard` — because they were slow on `UserPromptSubmit`.
    Two of the three were restored in the review cycle (commits
    `4114eb49`, `1262849a`), but the underlying contract problem is
    unresolved: hooks were authored for the operator consumer, not
    the LLM consumer. Review verdicts on both `5832b907` and
    `4114eb49+1262849a` are `Blocked` on review / security /
    maintenance.

    Four concrete symptoms:

    1. `hooks/worktree-guard.sh:128-140` runs `git worktree list
       --porcelain` and embeds the full output in the deny JSON's
       stdout channel. With ~220 worktrees on the dev-kit admin's
       machine, the deny payload is ~30 lines of variable path
       content. Per `rules/session-hygiene.md` Iron Law 3, volatile
       content in the user-message prefix busts the prompt cache on
       every retry after a denial. The LLM reads the payload, finds
       no actionable signal, and emits the same Edit call again.
    2. `hooks/tdd-guard.sh:30` calls `python3 -m lib.tdd_scope_policy`
       on every Edit. Classification should happen at build-step
       entry, not at hook time. The Python cold-start cost is the
       actual latency that triggered the UserPromptSubmit complaint
       in #836; moving it to the hook is not a fix.
    3. `hooks/tdd-guard.sh` emits JSON only on the *deny* path
       (`hooks/lib/payload-parse.sh::deny`). On the happy path the
       LLM sees no reminder of the RED-evidence contract. When RED
       evidence is genuinely missing, the deny fires cold with no
       prior signal.
    4. `hooks/hooks.json` wires five `UserPromptSubmit` hooks with
       `timeout:` values 10-120s:
       - `tdd-scope-judge.sh:83` — `timeout: 120`
       - `worktree-auto-cut.sh:89` — `timeout: 120`
       - `notification-collapse.sh:100` — `timeout: 10`
       - `context-window-guard.sh:106` — `timeout: 30`
       - `linear-task-change.sh:95` — no timeout field

       Claude Code's documented hard cap on hook execution time is
       10s. When exceeded, output is silently discarded and the LLM
       proceeds with NO contract reminder. A `timeout: 120` setting
       is theatre: any work past the cap is invisible to the LLM.
       Either the hook completes in <10s on the critical path or it
       does not belong on the hook path.

  evidence:
    - "`hooks/worktree-guard.sh:128-140` — `_worktree_list_rich()` runs `git worktree list --porcelain`; today the output goes to the LLM channel (stdout) where it busts the cache"
    - "`hooks/worktree-guard.sh:142-166` — deny `MSG` block has variable session-state (branch name, env config, worktree list) embedded inline"
    - "`hooks/tdd-guard.sh:30` — `python3 -m lib.tdd_scope_policy` called per Edit, doing classification at hook time"
    - "`hooks/tdd-guard.sh:36-38` — deny JSON emitted only when RED evidence missing; happy path has no LLM-visible reminder"
    - "`hooks/tdd-scope-judge.sh` (deleted in #836 `5832b907`, restored in `1262849a`) — still on `UserPromptSubmit` matcher with `timeout: 120`"
    - "`hooks/worktree-auto-cut.sh` (deleted in #836 `5832b907`, replaced by `session-start-worktree-cut.sh` in `4114eb49`) — replaced with a hook instead of demoted to a skill"
    - "`hooks/context-window-guard.sh:90` — `jq -rs '.[-100:] | select(.message.usage)'` errors because `.[-100:]` returns an array; the broken form is what PR #836 left behind"
    - "`.dev-kit/guard-mode.session.json` — session-scoped bypass already exists; `lib/guard_mode_state.py` already wired into both guards"
    - "`rules/session-hygiene.md` Iron Law 3 — 'volatile content stays in the prompt tail, never the prefix'; embedded worktree list is exactly this anti-pattern"
    - "`rules/session-hygiene.md` Iron Law 2 — 'Cartography, not re-reads'; long deny JSON forces the LLM to re-read previous tool result"
    - "`docs/proposals/review/babysit-approval-loop/00-index.yaml:107-111` — approval-distance typed vector pattern: each component moves deterministically, not optimistically"
    - "PR review verdicts: `Blocked` on review / security / maintenance for both force-push rounds of #836"
    - "`tests/test_tdd_guard.py` — only covers the deny-path; no coverage for the happy-path LLM-visible contract"
    - "`hooks/hooks.json` — `timeout:` keys stripped in UserPromptSubmit blocks (PR #836 `5832b907`) so any future UserPromptSubmit hook cannot exceed 5s"

after:
  summary: |
    Adopt the channel-split hook contract: every hook's
    `hookSpecificOutput.additionalContext` is byte-stable for a
    given `(file_class, hook_name, branch_class)`, and operator-only
    data (full worktree list, full RED log, debug dumps) is written
    to stderr the LLM does not see. Deliver in three PRs that
    together close #836 and resolve every previously-identified
    weakness in this proposal's design.

    **PR 1 (`fix/hook-stable-prefix`)**: ~180 lines, fully reversible. `Closes #836`.

    - `hooks/worktree-guard.sh:121-167` — keep `_worktree_list_rich()`
      and the worktree enumeration. Operator visibility is correct
      as-is. The fix is **where the output goes**: route the
      worktree list to **stderr** (operator channel). The hook's
      stdout (LLM channel) becomes one byte-stable deny MSG with
      the canonical `.worktrees/<slug>` cut command. The LLM sees
      NO variable worktree list.
    - `hooks/tdd-guard.sh` — keep deny as fallback; ADD a happy-path
      `additionalContext` emit that names the RED-evidence contract
      and the `/dev-kit:guard-mode off` bypass. Same channel-split.
    - `hooks/context-window-guard.sh` — fix the `select()` bug
      identified in PR #836 review. Rewrite the broken
      `.[-100:] | select(.message.usage)` as
      `[.[-100:] | map(select(.message.usage))] | add // {}` so the
      array-vs-stream error is gone. Drop the `timeout:` field.
    - `hooks/hooks.json` — remove the `timeout:` key from every hook
      entry that has one (4 entries today).
    - `tools/regenerate_active_hooks.py` — extend the existing lint
      to **hard-reject the `timeout:` key on any event**.
    - `.github/workflows/test.yml` — add a step that runs the lint
      and the no-timeout test, so CI catches manual edits to
      `hooks.json`.
    - `tests/test_hook_additional_context.py` — assert byte-stability
      across N=10 runs.
    - `tests/test_no_hook_timeouts.py` — walk `hooks.json`, assert
      no `timeout:` key on any hook entry. Wire into CI.
    - `tests/test_context_window_guard.py` — behavioral test; runs
      the hook against a fixture JSONL with mixed-shape messages
      and asserts the slim-mode report is produced (the broken form
      currently silently swallows the error and returns `0`). This
      replaces PR #836's substring-only test.

    **PR 2 (`refactor/tdd-scope-classify-move`)**: ~120 lines, fully reversible.

    - `hooks/tdd-scope-judge.sh` — DELETE entirely. No replacement hook.
    - `lib/tdd_classify.py` — NEW. Pure function `classify(file_path)
      -> Literal["exempt", "required"]` reading
      `lib/tdd_scope_policy.py` as a library, NOT a subprocess.
    - `skills/build-tdd/SKILL.md` — Step 1 now runs `lib.tdd_classify`
      first; failure aborts the build step with a clear message.
    - `hooks/tdd-guard.sh` — read `.dev-kit/.tdd-scope.json` only;
      remove the `python3 -m lib.tdd_scope_policy` subprocess call.
    - `hooks/session-start-guard-mode-reset.sh` — extend to also
      verify `.dev-kit/.tdd-scope.json` exists and is non-empty; if
      absent, log a stderr warning naming `/dev-kit:build-tdd` as
      the remediation. Doesn't block; gives the LLM an early nudge
      on first Edit.
    - `tests/test_tdd_classify_move.py` — three sub-tests.

    **PR 3 (`feat/cwd-skill`)**: ~80 lines, fully reversible.

    - `skills/cwd/SKILL.md` — operator-invoked skill that suggests a
      `<type>/<slug>` per `rules/git-workflow.md` and runs
      `git worktree add -b <type>/<slug> .worktrees/<slug> origin/main`
      with operator confirmation. Replaces the wrong-surface
      `session-start-worktree-cut.sh` hook from PR #836 commit
      `4114eb49` (whose own existence is one more proof that
      auto-cutting a worktree at session start was the wrong
      surface).
    - `tests/test_cwd_skill.py` — proves the suggested slug obeys
      kebab-case, length, and forbidden-word rules
      (`tests/test_git_workflow.py::FORBIDDEN_RE`).

    Session toggle already exists
    (`.dev-kit/guard-mode.session.json`). No new session-state
    machinery. The three PRs together close every previously-
    identified weakness in this design — the pros/closed-questions
    lists at the end make this auditable.

