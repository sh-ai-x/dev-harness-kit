name: linear-pr-sync

# Sync the Linear issue state to the PR's lifecycle.
#
# Mapping (declarative — see tools/linear_pr_sync.py EVENT_STATE_MAP):
#
#   PR opened (draft=false)       → In Progress
#   PR opened (draft=true)        → no-op (drafts sync on ready_for_review)
#   PR ready_for_review           → In Review
#   PR reopened                   → In Review
#   PR synchronize (new commits)  → In Review
#   PR closed (merged=true)       → Done
#   PR closed (merged=false)      → Canceled
#
# The workflow is non-blocking: every step has `continue-on-error: true`
# so a flaky Linear API never blocks the PR pipeline.

on:
  pull_request:
    types: [opened, ready_for_review, closed, reopened, edited, synchronize]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to sync (defaults to ref_name)'
        required: false
      event:
        description: 'Synthetic event name (opened, ready_for_review, closed)'
        required: false
      state:
        description: 'Target state name (used by bulk-update)'
        required: false

jobs:
  sync:
    name: sync linear state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_PROJECT_NAME: dev-harness-kit
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: tools/linear_pr_sync.py

      - name: sync linear state
        env:
          # Move attacker-influenced fields out of the `run:` block. GitHub
          # Actions substitutes `${{ … }}` textually into the shell source
          # before bash ever sees it, so a PR title containing `'` could
          # previously break out of the single-quoted assignment and run
          # arbitrary code in a step whose env holds `LINEAR_API_KEY`
          # (env block at lines 39-41 above). env: values are passed via
          # the step's environment, not spliced into shell source.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_FROM_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          EVENT='${{ github.event.action }}'
          MERGED='${{ github.event.pull_request.merged }}'
          BRANCH="$BRANCH_FROM_HEAD"
          PR_NUMBER='${{ github.event.number }}'
          PR_DRAFT='${{ github.event.pull_request.draft }}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH='${{ inputs.branch }}'
            EVENT='${{ inputs.event }}'
            MERGED='false'
            PR_DRAFT='false'
          fi

          if [ -z "$BRANCH" ]; then
            echo "no branch resolved; skipping"
            exit 0
          fi

          if [ -n "${{ inputs.state }}" ]; then
            python3 tools/linear_pr_sync.py bulk-update --state "${{ inputs.state }}"
          else
            python3 tools/linear_pr_sync.py sync \
              --branch "$BRANCH" \
              --event "$EVENT" \
              --merged "$MERGED" \
              --pr-number "$PR_NUMBER" \
              --pr-title "$PR_TITLE" \
              --pr-draft "$PR_DRAFT"
          fi
        continue-on-error: true

      - name: smoke (key + project + state ids)
        # Skip the step entirely when LINEAR_API_KEY is not configured
        # for this repository. Repos without the secret stay green
        # instead of failing every PR; configured-but-misconfigured
        # cases still surface loudly in the step log because the smoke
        # script prints "project not found" / "state not configured"
        # before exiting 1, but the step itself does NOT block the
        # job (continue-on-error). Rationale: a Linear-side rate limit
        # (HTTP 429 "2500 requests / 1 hour") makes the smoke call fail
        # with the same "project not found" exit-1 — that's a transient
        # outage, not a misconfiguration, and must not block every PR
        # until the hourly window elapses. The earlier hard-fail here
        # meant the rate-limit window on a busy Linear team shut the
        # gate red across every PR for up to an hour, which is the
        # exact non-blocking contract the workflow's header documents.
        if: ${{ env.LINEAR_API_KEY != '' }}
        continue-on-error: true
        run: python3 tools/linear_pr_sync.py smoke
