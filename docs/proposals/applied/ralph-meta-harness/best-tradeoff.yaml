title: "Best Trade-off — Bounded Self-Improving RALPH Meta-Harness"
status: accepted
date: 2026-09-21
started: 2026-09-21
tags: [ralph, long-running, thin-harness, self-improvement, safety, security, replay, holdout, metrics, project-fit]

before:
  summary: |
    The repository has durable Ralph state, bounded collection, append-only
    traces, and promotion evidence, but Stop and SessionEnd still sit too close
    to completion semantics. A worker session can end without a durable
    next-cycle checkpoint, and a session boundary can look like workflow
    completion.
  evidence:
    - '`hooks/stop-verify.sh` blocks completion claims at the wrong boundary for RALPH.'
    - '`hooks/trace-session-end.sh` emits completed session evidence without a RALPH worker/workflow distinction.'
    - '`lib/effectiveness_collection.py`, `lib/trace_log.py`, and `lib/ralph_promote.py` already provide reusable local-first seams.'

after:
  summary: |
    Use two planes: a tiny runtime plane for checkpoint, safety, and completion
    evidence; and an offline improvement plane using existing evaluate/meta-eval
    mechanisms for replay, protected holdout, canary pointer, and rollback.
    The runtime remains file-backed and local-first. Normal RALPH Stop never
    stops the workflow, while emergency safety remains fail-closed.
  files:
    - path: lib/ralph_controller.py
      change: 'Add a small file-backed checkpoint/session-close adapter using existing Ralph state and trace primitives.'
    - path: lib/ralph_promote.py
      change: 'Publish a deterministic completion receipt with artifact hashes and verifier provenance.'
    - path: lib/effectiveness_collection.py
      change: 'Keep measurement best-effort and bounded; add no universal Tool telemetry.'
    - path: lib/trace_log.py
      change: 'Retain candidate/replay/checkpoint references in the existing append-only event stream.'
    - path: hooks/stop-verify.sh
      change: 'Bypass prose completion blocking in RALPH mode and record a checkpoint.'
    - path: hooks/trace-session-end.sh
      change: 'Record worker session closure without synthesizing workflow completion in RALPH mode.'
    - path: lib/meta_eval.py
      change: 'Expose candidate replay/holdout results through the existing offline evaluator.'
    - path: skills/ralph/SKILL.md
      change: 'Document the worker/session boundary, evidence receipt, and offline improvement loop.'
    - path: docs/observability/meta-harness-metrics.md
      change: 'Define small hard-gate, continuity, latency, context, and handoff metrics.'

pros:
  - 'Preserves long-running AI leverage while keeping the hot path thin.'
  - 'Reuses existing dev-kit files, state, hooks, worktrees, pytest, and evaluation commands.'
  - 'Prevents false completion and separates emergency safety from normal Stop.'
  - 'Makes harness improvement measurable without introducing a service platform.'

cons:
  - 'Offline candidate validation delays activation of improvements, but never blocks the current low-risk RALPH workflow.'
  - 'Compact evidence is less verbose than a raw payload mirror; hashes, bounded summaries, and local references preserve replayability.'
  - 'High-risk actions retain a human decision point by design.'

limitations:
  - 'Telemetry cannot prove semantic correctness without deterministic checks, independent verification, or a human.'
  - 'Opaque provider internals remain unknown until an explicit adapter exists; unknown coverage is never treated as verified.'

sections:
  - title: "Runtime contract"
    body: |
      A worker session is disposable. In RALPH mode, Stop means checkpoint and
      next cycle, not workflow termination. `COMPLETED` requires a valid
      promotion receipt; prose, exit 0, or SessionEnd alone is insufficient.
  - title: "Self-improvement contract"
    body: |
      `observe → diagnose → propose → replay → holdout → canary → promote/rollback`
      runs offline through existing local evaluation paths and affects future
      cycles only. Security rules, kernel boundaries, metric definitions,
      protected holdout, retry ceilings, and product code cannot be
      self-promoted.
  - title: "Metrics and gates"
    body: |
      Hard gates: safety incidents `0`, false completion `0` for release/
      destructive/unattended work, holdout regression `0`, evidence orphan `0`,
      immutable-kernel changes `0`. Performance budgets: resume success `≥99%`,
      p95 wall-clock delta `≤+5%`, p95 hook overhead `≤50ms`, context overhead
      `≤5%`, unnecessary handoff within baseline `+0.5pp`.
  - title: "Project-fit boundary"
    body: |
      No daemon, database, queue, external collector, universal Tool wrapper,
      or cross-machine scheduler. The implementation is a small adapter around
      `.dev-kit`, JSON/JSONL, existing hooks, worktrees, pytest, and the
      `/dev-kit:*` skills.
