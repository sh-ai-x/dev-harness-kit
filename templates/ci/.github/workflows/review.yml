name: PR Review

# Thin consumer wrapper for sh-ai-x/dev-harness-kit-gates' reusable
# review judge (Phase 4 migration, issue #12). The judge agent,
# verdict-extraction, and severity-gate logic all live in that repo
# now; this file only wires GitHub context + this repo's own
# vars/secrets into the reusable's workflow_call inputs.
#
# Why `pull_request` (not `pull_request_target`): see the gates repo's
# review.yml header comment for the full OIDC-trust rationale. Same
# applies here since the reusable inherits the caller's event context.
#
# Fork safety: fork PRs never reach the `resolve`/`review` jobs at all
# (the `if:` below gates on same-repo-or-dispatch before any step runs,
# same as before).
#
# `severity_gate_enabled` is computed HERE (not just forwarded) so the
# vars.GATES_REVIEW_ENABLED-vs-'false' backward-compat contract
# (unset var -> gate runs; see tests/test_workflow_gates_var.py) stays
# pinned in this file. The reusable's OWN `if: inputs.severity_gate_enabled
# != 'false'` then receives an already-normalized "true"/"false" string --
# functionally identical to the pre-migration inline `if:`.
#
# Secret name `MINIMAX_API_KEY` is preserved from the prior workflow —
# do not rename (would break existing repo secret config). It is mapped
# to the reusable's generic `provider_api_key` secret at call time.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (overrides vars.CI_REVIEW_PROVIDER)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - minimax
          - anthropic
      pr_number:
        description: "PR number to review"
        required: false
        type: string

concurrency:
  group: review-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.resolve.outputs.provider }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - id: resolve
        run: |
          provider="${{ github.event.inputs.review_provider }}"
          [ -z "$provider" ] && provider="${{ vars.CI_REVIEW_PROVIDER }}"
          [ -z "$provider" ] && provider="minimax"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          pr_number="${{ github.event.pull_request.number }}"
          [ -z "$pr_number" ] && pr_number="${{ github.event.inputs.pr_number }}"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

  review:
    needs: resolve
    uses: sh-ai-x/dev-harness-kit-gates/.github/workflows/review.yml@v0.3.1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      provider: ${{ needs.resolve.outputs.provider }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      pr_is_from_fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      pr_updated_at: ${{ github.event.pull_request.updated_at }}
      run_id: ${{ github.run_id }}
      severity_gate_enabled: ${{ vars.GATES_REVIEW_ENABLED != 'false' }}
    secrets:
      install_token: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}
      provider_api_key: ${{ needs.resolve.outputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || secrets.MINIMAX_API_KEY }}
