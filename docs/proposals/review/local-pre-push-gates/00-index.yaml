  - title: Net-net
    body: |
      | Dimension | Before | After | Delta |
      |---|---|---|---|
      | Time from "bad PR" to "know it's bad" | push → GH Actions queue → 9s | push → pre-push hook → <1s | **-90%** |
      | LLM-judge runs per push | 1 (review) + 1 (security) | 0 (deferred to remote) | **-2 calls** |
      | Local hooks added | 0 | 1 (`hooks/pre-push.sh`) | +1 hook |
      | Existing behavior changed | n/a | none (additive only) | 0 |
      | Lines of code changed | n/a | ~250 (1 hook + 1 parser flag + 4 tests) | additive |

      **Apply? YES (Phase 1 — issue-sync + tier-A migration matrix).**
