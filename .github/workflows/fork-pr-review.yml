name: Fork PR Review Gate (manual fallback)

# Fork PRs never get a write-scoped GITHUB_TOKEN or an OIDC token on the
# `pull_request` trigger, no matter what `permissions:` a job declares —
# that's GitHub's platform-level anti-abuse restriction, not something a
# workflow change can lift. review.yml / maintenance.yml skip their
# LLM-judge jobs for fork PRs on `pull_request` (see the `if:` conditions
# there) and instead auto-run via `pull_request_target` (which has full
# permissions and reads the trusted base-branch workflow file).
#
# This workflow is now an OPT-IN MANUAL FALLBACK. Its job is gated on
# `vars.AUTO_REVIEW_FORKS == 'false'` — i.e. it only fires when an
# operator has explicitly disabled the default auto-review path on fork
# PRs and wants the human-in-the-loop approval back. Default behavior
# (variable unset / empty / any value other than literal `false`) is
# that this workflow is skipped entirely; review.yml and maintenance.yml
# run automatically via `pull_request_target` and post their AI-judge
# verdicts as PR comments without waiting on a maintainer click.
#
# When active (AUTO_REVIEW_FORKS=false), this workflow runs on
# `pull_request_target` (workflow file is read from the trusted `main`
# branch, not the fork, so it is safe to grant it write permissions) and
# sits behind the `fork-pr-review` GitHub Environment, which requires an
# explicit maintainer approval click in the Actions tab before the job
# runs. It never checks out the fork's code and never executes it — its
# only action is to dispatch review.yml / maintenance.yml via
# `workflow_dispatch` (a manual-trigger context, not a fork-origin
# `pull_request` event, so THAT run gets full normal permissions).
#
# Same-repo PRs (including the repo owner's own) are untouched by this
# workflow entirely — review.yml / maintenance.yml keep running fully
# automatically on `pull_request` for those, exactly as before.
#
# Why this workflow also writes commit status (not just dispatching):
# review.yml and maintenance.yml run on `pull_request`, which auto-attaches
# their job-level checks to the PR commit. When they fire via
# `workflow_dispatch` instead (this gate's path), GitHub does NOT auto-link
# the dispatched jobs to the PR commit — so the PR's "Checks" tab keeps
# showing the original pull_request run's "skipped" verdict indefinitely.
# To make the AI-judge outcome visible in the PR Checks tab, this gate
# polls the two dispatched runs and posts an aggregate `fork-pr-review/ai-judges`
# commit status (`pending` while running, `success`/`failure` after).
#
# To re-enable the manual gate after auto-review has been the default:
#   gh variable set AUTO_REVIEW_FORKS --body false
# To restore the default auto-review path:
#   gh variable delete AUTO_REVIEW_FORKS

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  gate:
    name: fork PR review (awaiting maintainer approval)
    runs-on: ubuntu-latest
    # Active only when the operator has explicitly opted OUT of the
    # default auto-review path by setting `vars.AUTO_REVIEW_FORKS=false`.
    # On the default path (variable unset / empty / `true` / anything
    # other than literal `false`), this job is skipped entirely — the
    # LLM judges run directly in review.yml / maintenance.yml via the
    # `pull_request_target` event they also trigger on. Same-repo PRs
    # are filtered out by the `head.repo.full_name` check (they have
    # their own same-repo auto-review path).
    if: |
      github.event.pull_request.head.repo.full_name != github.repository &&
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v') &&
      vars.AUTO_REVIEW_FORKS == 'false'
    environment: fork-pr-review
    permissions:
      actions: write
      pull-requests: write
      statuses: write
    # Job-level env so every `gh` invocation knows the API host + repo
    # without an `actions/checkout` step. Without these, gh falls back
    # to `git rev-parse` to resolve the host (no `.git` on the runner)
    # and aborts with `failed to determine base repo: ... fatal: not a
    # git repository`. Step 6's `Post final AI-judge status to PR
    # commit` was the visible failure under `set -e`; step 4's
    # `Wait for dispatched AI judges` swallowed the same error behind
    # `|| true`.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch AI review workflows
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `gh workflow run` returns the run URL on stdout/stderr across all
          # supported gh CLI versions; older versions don't accept `--jq`.
          # Parse the numeric run id out of the URL so we can wait on it.
          parse_run_id() {
            grep -oE 'runs/[0-9]+' <<<"$1" | head -n1 | sed 's|runs/||'
          }
          REVIEW_URL="$(gh workflow run review.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" 2>&1)"
          MAINT_URL="$(gh workflow run maintenance.yml \
            --repo "${{ github.repository }}" --ref main -f pr_number="$PR_NUMBER" 2>&1)"
          REVIEW_RUN="$(parse_run_id "$REVIEW_URL")"
          MAINT_RUN="$(parse_run_id "$MAINT_URL")"
          if [ -z "$REVIEW_RUN" ] || [ -z "$MAINT_RUN" ] \
             || ! [ "$REVIEW_RUN" -gt 0 ] 2>/dev/null \
             || ! [ "$MAINT_RUN" -gt 0 ] 2>/dev/null; then
            echo "::error::failed to parse run id; review_url=$REVIEW_URL maint_url=$MAINT_URL review_run=$REVIEW_RUN maint_run=$MAINT_RUN"
            exit 1
          fi
          {
            echo "REVIEW_RUN=$REVIEW_RUN"
            echo "MAINT_RUN=$MAINT_RUN"
          } >> "$GITHUB_ENV"
          echo "Dispatched review.yml run=$REVIEW_RUN maintenance.yml run=$MAINT_RUN"

      - name: Resolve PR commit SHA
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Resolved PR commit SHA=$SHA"

      - name: Mark PR commit as AI-review-pending
        run: |
          set -euo pipefail
          # `gh api` reads GH_HOST + GH_REPO from the job-level env so the
          # path-only URL can resolve the API endpoint on a runner that has
          # no .git directory (pull_request_target). See the job-level env
          # block for the rationale.
          gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state=pending \
            -f context='fork-pr-review/ai-judges' \
            -f description="AI judges dispatched (review=$REVIEW_RUN maintenance=$MAINT_RUN); awaiting verdict" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Wait for dispatched AI judges
        run: |
          set -uo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            gh run watch "$RUN" --exit-status || true
          done

      - name: Post per-judge commit statuses
        run: |
          set -euo pipefail
          for RUN in "$REVIEW_RUN" "$MAINT_RUN"; do
            JOBS_JSON="$(gh api "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/jobs")"
            for NAME in "/dev-kit:review (3-dim)" "/dev-kit:security (10-dim OWASP)" "/dev-kit:maintenance (code-sanity + docs)"; do
              JOB_URL="$(echo "$JOBS_JSON" | jq -r --arg n "$NAME" '.jobs[] | select(.name==$n) | .html_url // empty')"
              CONCL="$(echo "$JOBS_JSON" | jq -r --arg n "$NAME" '.jobs[] | select(.name==$n) | .conclusion')"
              if [ -z "$CONCL" ] || [ "$CONCL" = "null" ]; then continue; fi
              case "$CONCL" in
                success)          STATE="success" ;;
                failure|timed_out) STATE="failure" ;;
                *) continue ;;  # skipped/cancelled/action_required/neutral/stale — non-blocking, don't post
              esac
              TARGET_URL="${JOB_URL:-https://github.com/${{ github.repository }}/actions/runs/$RUN}"
              gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
                -f state="$STATE" \
                -f context="$NAME" \
                -f description="judge job conclusion=$CONCL (run=$RUN)" \
                -f target_url="$TARGET_URL" >/dev/null
            done
          done

      - name: Post final AI-judge status to PR commit
        run: |
          set -euo pipefail
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          if [ "$REVIEW_CONCL" = "success" ] && [ "$MAINT_CONCL" = "success" ]; then
            STATE="success"
            DESCRIPTION="AI judges passed (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          else
            STATE="failure"
            DESCRIPTION="AI judge failure (review=$REVIEW_CONCL maintenance=$MAINT_CONCL)"
          fi
          gh api "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" -X POST \
            -f state="$STATE" \
            -f context='fork-pr-review/ai-judges' \
            -f description="$DESCRIPTION" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN"

      - name: Post audit comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEW_CONCL="$(gh run view "$REVIEW_RUN" --json conclusion --jq .conclusion)"
          MAINT_CONCL="$(gh run view "$MAINT_RUN" --json conclusion --jq .conclusion)"
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
            "Maintainer approved this fork PR for review (fork-pr-review environment). \
            Dispatched /dev-kit:review (run [$REVIEW_RUN](https://github.com/${{ github.repository }}/actions/runs/$REVIEW_RUN)) \
            and /dev-kit:maintenance (run [$MAINT_RUN](https://github.com/${{ github.repository }}/actions/runs/$MAINT_RUN)) \
            via workflow_dispatch. Final: review=$REVIEW_CONCL maintenance=$MAINT_CONCL. \
            Per-judge verdict comments are posted on each dispatched run."
