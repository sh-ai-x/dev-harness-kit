title: "/dev-kit:ralph — loop control plane, failure evidence, and measurable improvement"
status: applied-with-changes
shipped: 2026-09-15
issue: 850
modifications: |
  Proposal called for loop-control metrics + failure evidence as a
  pre-`ralph-attended-lock` prerequisite. Shipped surface
  (`feat(harness): integrate Ralph control plane and bounded do`,
  PR #850) shipped the control plane + bounded `do` execution
  together rather than as a separate metrics pre-pass. The metric
  surface was deferred to a follow-on sub-proposal.
date: 2026-09-13
tags: [ralph, loop-engineering, observability, metrics, durable-state, recovery, safety]

before:
  summary: |
    Ralph has a useful attended-lock state machine and delegates the actual
    work to build, babysit-pr, and ship. The control loop is not yet a
    durable execution loop, however. The persisted top-level state, child
    skill state, stdout, failure logs, and effectiveness reports are separate
    surfaces. A restart can therefore replay work from the beginning, lose
    the causal relationship between an attempt and its failure, or report a
    terminal-looking state without enough evidence to measure it.

    The project already contains the ingredients for a safe design: build
    writes real step output and evidence events, trace_log has a validated
    append-only event contract, effectiveness_collection has bounded
    append+fsync storage, and babysit-pr has a resumable state machine. This
    proposal connects those pieces instead of introducing another competing
    loop or another unstructured progress file.
  evidence:
    - "skills/ralph/lib/ralph_chain.py:385-415 iterates BUILD → BABYSIT → SHIP from the beginning and saves only the current sub_stage before dispatch; it does not select the next work from a recovered checkpoint."
    - "skills/ralph/lib/ralph_chain.py:454-460 stores only child stdout in build_state, babysit_state, and ship_state; exit code, stderr, duration, attempt identity, and evidence references are not durable Ralph fields."
    - "skills/ralph/lib/ralph_chain.py:557-573 rejects every loaded state whose current_stage is not ATTENDED_RUN, so the documented re-invocation path cannot itself resume RECOVERY_REQUIRED."
    - "skills/ralph/scripts/ralph_drive.sh:73-236 exposes init/status/can-ask/advance/rewind/run-attended, but has no resume, event, failure-log, or metric command."
    - "skills/ralph/templates/ralph_progress.md:1-7 describes a per-run log, but no runtime writer creates or appends that file."
    - "tests/test_ralph_chain.py:214-241 reaches same-stage-repeat only by monkey-patching SUB_STAGE_ORDER; the production runner is explicitly a single pass."
    - "tests/test_ralph_chain.py:249-267 accepts any BUILD/BABYSIT/SHIP sub_stage after reload, so it does not prove crash/restart resume semantics."
    - "skills/ralph/lib/ralph_chain.py:234-250 maps a successful BABYSIT dispatch directly to USER_MERGE_REQUIRED, while the public contract describes BUILD → BABYSIT → SHIP; the SHIP stage is therefore skipped on the real happy path."
    - "lib/execute.py:807-838 already writes real exit_code/stdout/stderr/duration_seconds output, and lib/execute.py:926-949 emits causal verification events; Ralph currently captures neither contract as a structured attempt."
    - "lib/trace_log.py:278-326 provides event validation, locking, dedupe, and parent links; lib/effectiveness_collection.py:609-678 provides append+fsync and hash-chain durability, but neither is wired to Ralph stage lifecycle."
    - "lib/babysit_pr_loop.py:177-220 has a useful three-outcome no-information policy, yet Ralph does not consume its iteration, failure signature, wake, or recovery evidence as metrics."
    - "The wider skill set has independent loop owners: research Phase 0-3 escalation (`skills/research/SKILL.md:33-53`), plan's 5-gate and loop-log (`skills/plan/SKILL.md:305-324,431-445`), build step/self-fix (`skills/build/SKILL.md:106-115`), build-debug 4 phases (`skills/build-debug/SKILL.md:55-84`), build-refactor 4 passes (`skills/build-refactor/SKILL.md:48-55`), TDD Red-Green-Refactor (`skills/build-tdd/SKILL.md:24-32`), build-verify fail-back (`skills/build-verify/SKILL.md:61-63`), local babysit (`skills/babysit-pr-local/SKILL.md:144-166,255-266`), and CI-triage process (`skills/ci-triage/SKILL.md:50-57,108-113`)."
    - "Review and security are parallel fan-out plus verifier workflows (`skills/review/SKILL.md:16-25`, `skills/security/SKILL.md:33-38`); their expected/returned/confirmed dimension counts are also loop evidence when invoked under Ralph."
    - "Operational evidence from PRs #847, #848, and #849: worktree isolation, phase-evidence promotion, push-confirm bypass, CI audit MISSING, and recovery cleanup all need separate policy/failure classes rather than one generic failed run."

after:
  summary: |
    Ralph becomes a bounded, resumable controller with three explicit
    planes:

    1. Control plane — a versioned checkpoint plus lease/attempt record
       chooses the next sub-stage from committed evidence, not from a fixed
       list. A process crash, stale worker, child timeout, or RECOVERY_REQUIRED
       state is represented as an interrupted attempt and can be resumed
       safely.
    2. Evidence plane — every stage emits validated start, finish, retry,
       guard, recovery, and terminal events with an attempt id and artifact
       references. The operator-readable ralph_progress.md is derived from
       this journal; it is never the source of truth.
    3. Measurement plane — a pure projection computes Ralph-specific
       reliability, convergence, efficiency, safety, and evidence-completeness
       metrics. Missing or degraded telemetry is reported as insufficient
       evidence and never converted into success.

    The first rollout runs in shadow/metrics-only mode, then enables durable
    resume, then enables controller retries. Existing build MUST-37,
    babysit-pr no-progress/MAX_ITERS, attended_lock, review gates, human
    merge boundary, worktree guard, and fail-closed audit semantics remain
    authoritative. Metrics do not approve code and do not authorize merge.

    The prompt/control boundary is declarative: the compact Core Directive
    states intent and authority, `/do` resolves one route envelope, and Ralph
    controls only cross-skill sequencing. Static hooks and the existing SSOT
    remain the enforcement plane. Context Diet telemetry measures whether
    routing and recovery use compact artifact references instead of replaying
    prompts or transcripts.
  files:
    - path: skills/ralph/lib/ralph_state.py
      change: |
        Add a versioned checkpoint schema with last completed sub-stage,
        active attempt, checkpoint sequence, terminal reason, deadline, and
        recovery metadata. Validate state on load, distinguish resumable
        recovery from terminal user-merge, and use atomic snapshot writes
        only after the corresponding event is durable.
    - path: skills/ralph/lib/ralph_chain.py
      change: |
        Replace the fixed single-pass traversal with a resume-aware controller
        that acquires a per-session lease, emits stage lifecycle events,
        measures dispatch duration, classifies child outcomes, honors bounded
        retry/backoff and no-progress fingerprints, and reconciles an open
        attempt after a crash. Preserve the attended-lock Ask refusal and the
        human merge boundary.
    - path: skills/ralph/lib/ralph_events.py
      change: |
        New adapter around the existing trace_log event contract. Normalize
        Ralph run/stage/attempt events, redact bounded stdout/stderr snippets,
        retain artifact references, emit idempotent event ids, and surface
        observability degradation without fabricating outcomes.
    - path: skills/ralph/lib/ralph_metrics.py
      change: |
        New pure reducer over Ralph events and child-state evidence. Produce
        versioned metric records with numerator, denominator, coverage,
        evidence event ids, dimensions, and an explicit insufficient-evidence
        status. Reuse the existing harness effectiveness conventions rather
        than changing its five-component score.
    - path: skills/ralph/scripts/ralph_drive.sh
      change: |
        Add resume, events, and metrics/status-report commands. Keep CLI
        exit codes distinct for success, expected human-merge, recovery,
        usage, and environment/observability failures.
    - path: skills/ralph/templates/ralph_progress.md
      change: |
        Turn the current starter template into a documented derived view:
        each section points to an event id, attempt id, evidence artifact,
        failure class, next action, and metric coverage state.
    - path: lib/trace_log.py
      change: |
        Harden the existing event append boundary for Ralph's durability
        contract (including flush/fsync and safe bounded payload handling)
        while preserving the v1 event schema and existing executor callers.
    - path: lib/babysit_pr_loop.py
      change: |
        Expose a read-only normalized snapshot of iteration, repair attempt,
        failure signature, no-information count, wake time, and recovery
        reason so Ralph can measure and resume babysit without reimplementing
        its policy.
    - path: docs/skills/ralph.md
      change: |
        Replace claims that re-invocation automatically resumes with the
        implemented checkpoint/recovery contract, event taxonomy, metric
        commands, and operator recovery procedure.
    - path: skills/ralph/SKILL.md
      change: |
        Make loop ownership explicit: Ralph controls orchestration and
        budgets; build and babysit-pr own their internal safety valves; ship
        owns the review/tag/merge boundary. Document when a missing audit is
        a recovery evidence gap rather than an approval.
    - path: tests/test_ralph_chain.py
      change: |
        Add crash-at-each-boundary, restart-from-BABYSIT/SHIP, duplicate
        dispatch, retry/backoff, deadline, stale-lease, no-progress, and
        terminal-evidence tests. Replace the current weak sub_stage reload
        assertion with exact checkpoint assertions.
    - path: tests/test_ralph_events.py
      change: "New tests for event schema, parent links, redaction, idempotency, bounded failure logs, and degraded-observability findings."
    - path: tests/test_ralph_metrics.py
      change: "New pure-reducer tests for metric formulas, dimensions, missing-event coverage, expected USER_MERGE_REQUIRED terminals, and insufficient-evidence behavior."
    - path: tests/test_ralph_drive.sh
      change: "New CLI integration tests for resume/events/metrics output and distinct exit-code semantics."
    - path: docs/adr/ADR-00XX-ralph-loop-control-plane.md
      change: "Record the canonical event source, state/event ordering contract, retry ownership, metric definitions, and rollout/rollback decision."
    - path: docs/core/DEV-HARNESS-CORE.md
      change: "Store the concise declarative Core Directive and references to static enforcement SSOTs; do not duplicate hook or Iron Law prose."
    - path: skills/do/SKILL.md
      change: "Add the unified /do router that emits a versioned route envelope and delegates to existing plan/build/review/Ralph skills without becoming a second policy engine."
    - path: docs/skills/do.md
      change: "Document /do routing, critical-spec hold behavior, mode/team orthogonality, and context-budget handoff rules."
    - path: tests/test_context_budget.py
      change: "Verify bounded handoffs, usage coverage, no full-transcript reinjection, and insufficient-evidence behavior."

pros:
  - "Fixes the highest-risk correctness gap first: a killed or restarted Ralph run can identify the last durable attempt and resume the correct stage without replaying completed work."
  - "Makes every failure inspectable: exit code, stderr reference, duration, failure class, child state, and event ids are queryable instead of hidden in one truncated last_action string."
  - "Uses current project primitives (`trace_log`, `harness_effectiveness`, `effectiveness_collection`, executor output, and babysit state) so the metric contract has real evidence and does not create a third unrelated telemetry system."
  - "Separates expected human merge from recovery, audit MISSING from approval, and observability degradation from workflow success. This prevents the CI/audit ambiguity seen during PR #849 from becoming a false green."
  - "Makes loop improvement measurable before enabling autonomous policy changes: baseline first, then shadow metrics, then bounded controller changes with rollback."
  - "Preserves existing safety boundaries: no auto-merge, no force-push, no Ask after attended_lock, no bypass of per-step worktrees, and no silent retry beyond a budget."

cons:
  - "The repository will temporarily have both legacy state snapshots and the new event projection. Mitigation: define one-way compatibility readers, make the event journal canonical for new runs, and remove only redundant legacy fields after a migration period."
  - "A durable event write adds a small amount of I/O at every stage boundary. Mitigation: emit compact metadata plus artifact references, cap payloads, batch only non-safety metrics, and retain fsync for checkpoint-critical events."
  - "Metric names and thresholds can create perverse optimization. Mitigation: publish numerator, denominator, coverage, and evidence ids; never score missing data as zero or success; keep learning/auto-policy changes disabled until a baseline exists."
  - "Resuming a child process is not always safe after an external side effect. Mitigation: reconcile open attempts as interrupted, require idempotency keys for dispatch, and resume at the last verified boundary; never infer a successful push or merge from process death."
  - "Cross-skill integration expands the test surface. Mitigation: land the event adapter and pure reducer separately from controller activation, and retain a legacy mode behind a feature flag during rollout."

limitations:
  - "No metric can prove the semantic quality of an LLM change from exit code alone. Independent checks and review evidence remain required; self-reported child success is labeled as such."
  - "The controller cannot safely replay an arbitrary external command that was interrupted after side effects. It can classify and surface the ambiguity, not undo the side effect."
  - "The first version measures Ralph runs within one repository and one session namespace. Distributed multi-repository coordination, hosted dashboards, and cross-machine leases are out of scope."
  - "The proposal does not change the meaning of build's three-cycle guard, babysit-pr's no-progress/MAX_ITERS policy, or the human merge requirement. It measures and coordinates those policies; it does not replace them."
  - "Historical runs lack the new event fields. Historical metrics are partial and must be shown with insufficient coverage rather than backfilled from prose or stdout."

scope:
  in_scope:
    - "A single canonical Ralph run identity and versioned checkpoint/attempt model under `.dev-kit/ralph/`."
    - "Resume-aware BUILD → BABYSIT → SHIP orchestration after process crash, child timeout, RECOVERY_REQUIRED, or stale lease."
    - "Append-only structured lifecycle, guard, recovery, and terminal events with bounded redacted logs and artifact references."
    - "Derived `ralph_progress.md` output and a local JSON/Markdown metrics CLI."
    - "Pure metric projection with reliability, convergence, efficiency, safety, observability, and evidence-completeness dimensions."
    - "Synthetic crash/restart, duplicate-event, timeout, stale-lock, audit-MISSING, cleanup-safety, and regression tests."
    - "Shadow-mode rollout and explicit rollback to the legacy single-pass controller."
  out_of_scope:
    - "Auto-merge, force-push, review bypass, or changing the human merge boundary."
    - "Replacing build's per-step executor, MUST-37 self-fix, babysit-pr's repair strategy, or ship's authoritative review/tag checks."
    - "A hosted observability service, external database, background daemon, or multi-repository coordinator."
    - "LLM-generated metric interpretation being allowed to mutate policy without deterministic guard evaluation."
    - "Retroactively claiming success for runs that have no durable terminal evidence."
    - "Editing unrelated PR implementation work or changing hook manifests unless a later accepted issue explicitly proves it is required."

ambiguity:
  - id: A1
    question: "Which existing event store is canonical for Ralph lifecycle events: trace_log, effectiveness_collection, or a new journal?"
    default: "trace_log v1 is the canonical trajectory event source because executor events already use its parent-link contract; Ralph metrics are a separate pure projection. Reuse effectiveness_collection's fsync/hash-chain patterns where trace_log is hardened, without creating a third store."
    blocking: true
  - id: A2
    question: "What happens when a safety-critical event cannot be persisted?"
    default: "Fail closed for checkpoint-critical transitions: persist RECOVERY_REQUIRED with an observability-degraded reason if possible and do not claim success. Best-effort output snippets may be omitted only when the event still records the omission."
    blocking: true
  - id: A3
    question: "Should Ralph add retries on top of build and babysit-pr retries?"
    default: "Do not duplicate child retry policy. Ralph owns stage-attempt budgets, deadline, backoff, and resume; build owns MUST-37 and babysit-pr owns no-progress/MAX_ITERS. Ralph retries only when the child outcome is explicitly resumable and idempotent."
    blocking: false
  - id: A4
    question: "How should CI or LLM audit MISSING affect a run metric?"
    default: "Classify it as audit_evidence_missing / insufficient evidence, never as approval and never as an ordinary code failure. The run may remain resumable, but terminal quality metrics exclude it until an authoritative verdict exists."
    blocking: false
  - id: A5
    question: "When should metric thresholds become automatic control inputs?"
    default: "Never in the first rollout. Collect a two-week or 30-run baseline, review distributions, then propose thresholds in a separate accepted change with shadow comparison and rollback."
    blocking: false

sections:
  - title: Decision and priority
    body: |
      **Decision: improve and control the loop, but stage the change.** The
      highest-priority task is not a new retry heuristic. It is to make the
      existing state transition and the actual child attempt one durable,
      causally linked unit. Without that, every later metric is vulnerable to
      replay, missing output, or a false terminal state.

      Priority order:

      | Priority | Issue | Why now | Exit condition |
      |---|---|---|---|
      | P0 | RLE-00 stage/terminal contract | The real babysit adapter can stop at USER_MERGE_REQUIRED before SHIP, while docs/tests describe a three-stage chain. | One explicit terminal owner is documented and stage metrics cannot hide a skipped SHIP. |
      | P0 | RLE-01 durable checkpoint/resume | A restart can replay BUILD and the documented recovery path is not executable from RECOVERY_REQUIRED. | Crash at every boundary resumes the next safe stage and never claims an unfinished attempt succeeded. |
      | P0 | RLE-02 failure event journal | `last_action` and raw stdout are not enough for forensics or aggregation. | Every dispatch has a start/finish or interrupted event, with bounded evidence and a write-failure finding. |
      | P1 | RLE-03 bounded Ralph controller | The same-stage guard is dead in the production single-pass path. | Controller chooses next work from checkpoint, enforces lease/deadline/budget, and classifies no-progress explicitly. |
      | P1 | RLE-04 metric projection/report | There is no Ralph-specific success, recovery, convergence, or evidence-coverage view. | `ralph_drive.sh metrics` returns reproducible JSON and a human report from events only. |
      | P2 | RLE-05 closed-loop improvement | A metric without a safe experiment loop only creates dashboards. | Shadow policy comparison and a separate accepted proposal show an improvement without safety regression. |

      The first implementation PR should land RLE-01 and RLE-02 together,
      after RLE-00's terminal ownership is made explicit. A checkpoint
      without an attempt journal can resume from a misleading state, while a
      journal without checkpoint ordering cannot control execution. RLE-00
      must not be “fixed” by blindly forcing SHIP: whether BABYSIT or SHIP
      owns the human-merge boundary is a contract decision that the
      implementation and docs must agree on.

  - title: Whole-system audit
    body: |
      The loop ownership boundary is currently implicit:

      | Layer | Current owner | Existing guard/evidence | Gap Ralph must close |
      |---|---|---|---|
      | Gate/lock | `ralph_state.py` + attended hook | `attended_lock`, `last_blocked_ask` | Emit lock decisions as events and include them in safety metrics. |
      | Orchestration | `ralph_chain.py` | Fixed sub-stage order and atomic state snapshots | Resume from exact completed attempt; record duration, exit, and retry reason. |
      | BUILD | `lib/execute.py` / build skill | Per-step worktree, MUST-37, output JSON, trace/effectiveness events | Link the parent build attempt to those existing step artifacts. |
      | BABYSIT | `babysit_pr_loop.py` / babysit skill | Durable PR state, three no-information strategies, MAX_ITERS | Expose normalized child outcome and preserve its own retry ownership. |
      | SHIP | ship skill | Review/tag/main boundary | Require authoritative evidence before user-merge terminal. |
      | Storage | state JSON, trace log, effectiveness collection, Markdown template | Several individually useful stores | One run id, one event identity, clear source-of-truth rules. |
      | Reporting | progress template and generic effectiveness reports | Human summaries and five-component scorer | Ralph-specific projection with coverage and failure taxonomy. |

      The operational cases from the recent PR work are part of this audit.
      Worktree guard fixes (#847) require a safe target/branch identity;
      phase evidence (#848) requires promotion of real artifacts rather than
      prose claims; push-confirm bypass (#849) shows that a passing workflow
      can still have an audit provider with `MISSING` evidence. A prior
      recovery cleanup mistake also demonstrated that a broad or unresolved
      temporary path can delete the newly created worktree. The new event
      taxonomy must make these distinct: `worktree_policy`,
      `evidence_promotion`, `audit_evidence_missing`, and
      `cleanup_target_rejected`.

  - title: Proposed control-plane architecture
    body: |
      ```text
      user gates + attended_lock
                 │
                 ▼
      Ralph Controller ── lease / deadline / attempt budget ──┐
          │                                                   │
          ├─ checkpoint snapshot (.dev-kit/ralph/<session>.json)
          ├─ lifecycle event adapter ── trace/events.jsonl     │
          └─ derived progress + metrics                       │
                                                              ▼
          BUILD (execute output + events)
              → BABYSIT (babysit-state + check/review evidence)
              → SHIP (review/tag/merge boundary)
                                                              │
                   reducer: metrics + recovery decision ◄────┘
      ```

      The controller is the only component allowed to advance Ralph's
      sub-stage. Child skills retain authority over their internal loops:

      - BUILD reports step-level output and the existing self-fix guard; Ralph
        does not infer a green build from a zero exit code without the child
        artifact reference.
      - BABYSIT reports its durable state, failure signature, no-information
        count, wake time, and terminal/recovery reason; Ralph does not reset
        its context or silently turn `MISSING` review evidence into approval.
      - SHIP remains the final policy boundary. `USER_MERGE_REQUIRED` is an
        expected terminal outcome, not a failure and not a merge command.

      A run has one stable `run_id`; every stage execution has a unique
      `attempt_id`; retries and recovery re-entry keep the run id but receive
      a new attempt id. The pair is the join key for state, events, artifacts,
      and metrics.

  - title: Directive, /do router, and context-diet boundary
    body: |
      The compact declarative Core Directive is the policy boundary for the
      harness. It names intent, scope, and authority; it does not reproduce
      the state machine or hook algorithms. The canonical references are
      `iron-laws/index.md`, `hooks/index.md`, `rules/git-workflow.md`, and
      the project Core Directive document. Ralph references those sources
      and records their decisions; it never overrides or reimplements them.

      `/do` is the single user-facing router. It resolves intent once and
      passes a versioned envelope to the selected workflow:

      ```text
      request_id, intent_ref, directive_ref, directive_version,
      route_id, route_version, owner, scope, worktree, mode,
      policy_version, team_toggle
      ```

      The route is immutable for a `run_id`. Missing critical specifications
      produce `HOLD` / `NEEDS_HUMAN`; the router must not infer a route from
      incomplete intent. `route_id=ralph-attended` is an execution target,
      not a second global intent classifier. Ralph owns only cross-skill
      sequencing, lease/deadline/attempt budgets, recovery, terminal
      classification, and run-level evidence joins. Child skills own their
      internal loops and safety valves. Existing `/dev-kit:ralph` remains a
      compatibility entrypoint while the envelope is the canonical input.

      Every safety-relevant decision records `guard_id`, `policy_source`,
      `decision`, `fail_closed`, `policy_version`, and `evidence_ref`. An
      unknown guard binding or missing decision is `INSUFFICIENT_EVIDENCE`.
      Metrics can report a guard result but cannot authorize a tool call,
      approve missing audit evidence, change mode, or merge a PR.

      The route envelope and context telemetry are additive event fields:

      ```text
      provider, model, turn_index, input_tokens, cache_read_tokens,
      cache_write_tokens, output_tokens, usage_status, context_mode,
      context_fingerprint, context_ref_count, replay_tokens,
      compaction_observed
      ```

      `context_mode` is one of `artifact_ref`, `summary_ref`, or
      `minimal_inline`. Full prompts and transcripts are never persisted in
      Ralph events or re-injected into child/resumed attempts. A fingerprint
      is opaque hash metadata only. Missing provider usage is
      `INSUFFICIENT_EVIDENCE`, not zero. The existing context-window guard
      remains an advisory cumulative-session warning; it is not silently
      converted into a Ralph approval or failure.

      Context Diet caps for the first rollout are:

      | Payload | Cap / rule |
      |---|---|
      | stdout or stderr excerpt | 4 KiB each, redacted |
      | child summary | 2 KiB |
      | event payload | 16 KiB |
      | artifact references | 32 per handoff |
      | derived `ralph_progress.md` | 64 KiB |
      | prompt/transcript persistence | forbidden |

      A child handoff contains only the intent reference, checkpoint, latest
      failure signature, required artifact references, and compact summary.
      Reuse existing `input_tokens`, `output_tokens`, and `prompt_hash`
      fields rather than creating a competing token system.

      Context and routing metrics use the same typed metric record as the
      Ralph reducer (`ratio`, `distribution`, or `counter`):

      | Metric | Formula | Initial threshold |
      |---|---|---|
      | `usage_coverage` | valid usage records / expected usage records | ≥99% before controlled mode |
      | `cache_hit_ratio` | cache-read tokens / (input + cache-read tokens) | target ≥85%; warn below 50% above 50K total |
      | `artifact_handoff_rate` | artifact/summary-ref handoffs / all handoffs | ≥95% before controlled mode |
      | `full_context_reinjection_rate` | full transcript handoffs / all child or resume handoffs | 0% |
      | `resume_replay_ratio` | already-seen tokens / resumed context tokens | alert >10% after baseline |
      | `context_hard_rate` | runs crossing 300K cumulative context / usage-covered runs | 0% unexplained |
      | `context_payload_cap_violation_rate` | oversized payloads / events | 0% |
      | `guard_decision_coverage` | complete guard events / guard decisions | ≥99%; missing is insufficient evidence |
      | `terminal_evidence_rate` | terminals with authoritative evidence / terminals | ≥99%; missing evidence is not green |

      Use `closed_runs` for terminal denominators and report `open_run_rate`
      separately. Baseline-derived alerts require at least 30 eligible
      complete runs and 14 days: rate regression is baseline +2 percentage
      points, cache-hit regression is baseline −5 points, and p95
      latency/context regression is baseline ×1.20. Fixed safety thresholds
      (duplicate dispatch, guard bypass, full reinjection, and unsafe cleanup)
      never wait for a baseline. No metric changes routing, retry policy, or
      mode until a separate accepted proposal authorizes that policy change.

  - title: Whole-skill loop registry and ownership
    body: |
      Ralph must measure the loops that it invokes without taking ownership
      of their internal algorithms. A registry entry is the smallest shared
      contract:

      ```text
      loop_id, route_id, owner, parent_run_id, scope, iteration, cap,
      progress_fingerprint, terminal, evidence_refs, mode, policy_version
      ```

      The initial registry is:

      | Loop | Owner | Control policy | Ralph integration/metric |
      |---|---|---|---|
      | `research-escalation` | research/research_engine | Phase 0 cache → Phase 1 direct → Phase 2 fan-out → Phase 3 human; `max_phase` cap | Record phase, source count, citation verification, `NEEDS_HUMAN`, and latency. |
      | `plan-gates` | plan/interview | 5 gates, user interrupt, HOLD and loop-log resume | Record gate transition, ambiguity answers, HOLD/resume count, and artifact refs. |
      | `build-step` | build/execute | Dependency-aware dispatch, isolated worktree, real output, MUST-37 3-cycle self-fix | Join Ralph attempt to step output/events; report step attempts and blocked/error/completed outcomes. |
      | `build-debug` | build-debug | Reproduce → isolate → root cause → fix/plan; one phase at a time | Record phase completion and quoted root-cause/regression evidence; never bundle phases. |
      | `build-refactor` | build-refactor | Dead → duplicate → naming → coverage; one pass at a time | Record pass and regression result; no artificial retry metric. |
      | `tdd-cycle` | build-tdd + tdd-guard | RED → GREEN → REFACTOR, failing test required before production code | Record red confirmation, green result, refactor verification, and guard decision. |
      | `build-verify` | build-verify | verify pass advances; fail returns to execute | Record verification evidence and back-edge count. |
      | `babysit-gh` | babysit-pr/babysit_pr_loop | Poll/repair until approval, 3 no-information guard, MAX_ITERS=1000 | Import child iteration, signature, wake, repair attempt, and recovery state; Ralph does not reset it. |
      | `babysit-local` | babysit-pr-local | Local pytest/judge loop, same no-progress/cap family | Use `mode=local`; never combine its iterations with `babysit-gh` counts. |
      | `ci-triage-resolution` | ci-triage | Signature dedup; known-pattern auto-fix; idempotent processed state | Record case lifecycle and resolution evidence when explicitly invoked, not as a hidden retry. |
      | `review-fanout` / `security-fanout` | review/security | Parallel dimensions then verifier; missing/rejected findings stay visible | Report expected/returned/confirmed/rejected/missing dimensions and verifier latency. |
      | `ralph-attended` | Ralph | Gate lock + BUILD/BABYSIT/SHIP controller, lease, deadline, stage budget | Owns only cross-skill sequencing, resume, terminal classification, and run-level metrics. |

      Nested loop events carry `parent_run_id` and `parent_attempt_id`.
      A child loop's iteration is not a Ralph stage attempt, and a Ralph
      retry must not reset the child's own state. This prevents double-counting
      and avoids stacking `MAX_ITERS` on top of another hidden cap. Standalone
      invocations can continue using their current logs; Phase 1 only promises
      complete registry coverage for loops reached from an active Ralph run.

      The controller must show a loop graph in the report: parent Ralph run
      → stage attempt → child loop → child attempt → artifact/check/review
      evidence. A missing child edge is an observability finding, not a
      successful no-op.

  - title: State, event, and failure contracts
    body: |
      ### Checkpoint contract

      Additive fields in the Ralph state snapshot:

      ```json
      {
        "schema_version": 2,
        "run_id": "ralph-<opaque-id>",
        "checkpoint_seq": 17,
        "current_stage": "ATTENDED_RUN",
        "sub_stage": "BABYSIT",
        "last_completed_sub_stage": "BUILD",
        "active_attempt": {
          "attempt_id": "attempt-17",
          "stage": "BABYSIT",
          "started_event_id": "evt-start-17",
          "lease_owner": "<worker-id>",
          "deadline": "<ISO-8601>"
        },
        "terminal_reason": "",
        "recovery_reason": "",
        "next_action": "resume BABYSIT attempt-18"
      }
      ```

      State transitions are ordered as: durable `attempt.started` event →
      child dispatch → durable `attempt.finished` or `attempt.interrupted`
      event → atomic checkpoint snapshot. On restart, an active attempt with
      no finish event is never treated as success. The reconciler marks it
      interrupted, checks child state/artifacts, and either resumes from the
      last verified boundary or lands in RECOVERY_REQUIRED.

      The load path validates schema, enum, counters, path containment, and
      lease ownership. A corrupt snapshot is not silently replaced by a new
      run; replay from valid events is attempted, and failure becomes an
      explicit `checkpoint_corrupt` recovery finding.

      ### Event contract

      Keep the existing `trace_log` v1 required fields and add Ralph-specific
      fields additively:

      | Field | Contract |
      |---|---|
      | `run_id`, `attempt_id`, `event_id` | Non-empty stable ids; duplicate writes are idempotent. |
      | `stage`, `sub_stage`, `event_type`, `outcome` | Controlled values; child-specific details go in `evidence_ref`. |
      | `parent_id`, `checkpoint_seq` | Causal link and monotonic run order. |
      | `started_at`, `ended_at`, `duration_ms` | UTC timestamps and measured wall duration; absent means unknown, not zero. |
      | `exit_code`, `failure_class` | Real child exit and normalized class; no exit-code guessing from prose. |
      | `stdout_ref`, `stderr_ref`, `artifact_refs` | Safe relative references to bounded artifacts; snippets are capped and redacted. |
      | `policy` | Guard/lease/retry decision with rule id and reason. |
      | `git_sha`, `branch`, `pr_number` | Context only; never proof that a push or merge happened. |

      Minimum event types are `run.started`, `stage.attempt.started`,
      `stage.attempt.finished`, `stage.attempt.interrupted`, `guard.blocked`,
      `guard.allowed`, `retry.scheduled`, `recovery.required`,
      `observability.degraded`, `terminal.reached`, and `run.closed`.

      Failure classes include `child_exit`, `child_timeout`,
      `child_exception`, `no_progress`, `watchdog_limit`, `stale_lease`,
      `checkpoint_corrupt`, `event_write_failed`, `audit_evidence_missing`,
      `worktree_policy`, `cleanup_target_rejected`, `human_merge_boundary`,
      and `unknown`. A failure class is a label for analysis; the raw
      bounded evidence and artifact refs remain the source for diagnosis.

      ### Log safety

      Event writes are append-only, locked, flushed/fsynced for checkpoint
      events, and deduplicated by event id. Payloads must not contain
      secrets, tokens, full prompts, or unlimited child output. Paths are
      resolved and checked under the run artifact root before writing; an
      unresolved cleanup target is rejected and logged. A write failure never
      becomes a green metric. If the failure itself cannot be logged, the
      process exits with a distinct observability/environment code and leaves
      the last valid checkpoint intact.

  - title: Loop-control policy
    body: |
      The controller uses this decision order on every wake or invocation:

      1. Load and validate the snapshot; acquire the session lease. A live
         lease blocks a second worker. A stale lease emits `stale_lease` and
         requires bounded recovery instead of concurrent dispatch.
      2. Replay the event tail from `checkpoint_seq`. Close any attempt that
         has a finish event; mark an open attempt interrupted. Never infer
         completion from a timestamp, process exit, or Markdown line.
      3. Choose the next work from the last verified child evidence. BUILD
         resumes from execute's step output/index; BABYSIT resumes from
         `.dev-kit/babysit-state.json`; SHIP is eligible only after the
         authoritative review/tag preconditions are present.
      4. Check the run deadline, per-stage attempt budget, and inherited child
         safety state. If a limit fires, emit the limit event and land in
         RECOVERY_REQUIRED with a resumable next action.
      5. Emit `stage.attempt.started`, then record `dispatch.intent` and
         `dispatch.accepted` before dispatching. Finish with
         `dispatch.finished` or `dispatch.unknown`, capture real
         stdout/stderr/exit/duration, and emit a terminal attempt event. Each
         adapter supplies an idempotency key, side-effect class, receipt ref,
         and resume policy. `dispatch.unknown` enters recovery and is never
         retried without an idempotency proof or durable receipt.
      6. Compute a progress fingerprint from stage, child head/check state,
         artifact hashes, failure signature, and verification result. Same
         fingerprint without evidence change increments no-progress; a
         changed failure with stronger verification is progress. Two Ralph
         re-entries without progress are a recovery signal, while child
         policies remain authoritative for their own three-cycle/three-poll
         limits.
      7. Write the checkpoint after the event, release the lease, and return
         a terminal or wake result. Backoff is bounded and stored as
         `next_wake_at`; no busy loop is allowed.

      This makes the loop a state machine with explicit ownership rather than
      a `for sub in SUB_STAGE_ORDER` traversal. It also makes “resume” a
      deterministic operation: it means resume the next unverified attempt,
      not repeat every child skill.

  - title: Metric contract and initial targets
    body: |
      Metrics are pure reductions over valid events and referenced child
      evidence. Every value includes numerator, denominator, coverage,
      dimensions, and evidence event ids. A missing denominator is `null`
      with `INSUFFICIENT_EVIDENCE`, never 0% and never 100%.

      | Metric | Formula | Initial policy / use |
      |---|---|---|
      | `terminal_rate` | (`DONE` + `USER_MERGE_REQUIRED`) / runs started | Reliability; baseline first, expected human merge included. |
      | `recovery_rate` | `RECOVERY_REQUIRED` / runs started | Diagnose regressions; split by failure class and stage. |
      | `resume_success_rate` | resumed runs reaching the next verified boundary / resume attempts | Synthetic gate: ≥95% before controlled mode; otherwise rollback. |
      | `evidence_completeness` | attempts with start + terminal + exit/duration/evidence refs / attempts | Safety gate: ≥99% for controlled mode; below this is degraded. |
      | `orphan_attempt_rate` | open attempts reconciled as interrupted / attempts | Detect crashes and lost finishes; alert on trend, never auto-close as success. |
      | `no_progress_rate` | no-progress fingerprints / stage attempts | Convergence signal, split from legitimate retries. |
      | `attempts_per_run` | total stage attempts / runs | Efficiency and loop expansion; report median/p95. |
      | `time_to_terminal` | terminal timestamp − run start | Reliability/latency; report median/p95 by stage and outcome. |
      | `stage_duration_ms` | finish − start for each attempt | Find bottleneck; absent duration lowers coverage. |
      | `retry_rate` | retries scheduled / attempts | Detect thrashing; pair with terminal and quality outcomes. |
      | `child_evidence_link_rate` | Ralph attempts linked to child artifacts / child attempts | Verify executor/babysit integration. |
      | `audit_evidence_missing_rate` | audit attempts with missing verdict / audit attempts | Must not be counted as approval; identifies provider/readiness failures. |
      | `guard_block_rate` | blocked guard decisions / guard decisions | Safety behavior; dimension by guard id and ground truth where available. |
      | `observability_degraded_rate` | runs with event/checkpoint write degradation / runs | A release gate, not a quality score. |
      | `cleanup_policy_violation_rate` | rejected unsafe cleanup targets / cleanup attempts | Must remain zero in regression and synthetic safety tests. |

      Required dimensions are `skill`, `stage`, `sub_stage`, `outcome`,
      `failure_class`, `mode` (legacy/shadow/controlled), `provider`,
      `model`, `git_sha`, and `repo`. Provider/model are empty when not
      recorded; the reducer must not silently attribute identity.

      Initial rollout gates are deliberately small and evidence-oriented:

      - Do not enable controlled mode unless synthetic crash/restart tests
        achieve `resume_success_rate >= 0.95` and
        `evidence_completeness >= 0.99`.
      - Treat any cleanup policy violation, attended-lock bypass, auto-merge,
        or audit-MISSING-to-approval conversion as a release blocker even if
        terminal rate improves.
      - Collect a baseline of at least 30 runs or 14 days before setting
        product thresholds for terminal rate, p95 latency, retries, or cost.
      - Do not add token/cost optimization to the primary score until event
        coverage is stable; otherwise the system may reward under-logging.

  - title: Failure handling and recovery matrix
    body: |
      | Failure | Event/finding | Controller action | Metric treatment |
      |---|---|---|---|
      | Crash before child dispatch | `stage.attempt.started` without dispatch marker | Reconcile as not-dispatched; retry with a new attempt id. | Orphan/interrupted, not failure-free. |
      | Crash after dispatch, before finish | Open attempt | Inspect child artifacts; resume only from verified boundary, otherwise recovery. | `orphan_attempt_rate` and `resume_success_rate`. |
      | Child non-zero/timeout/exception | `stage.attempt.finished` + class | Apply child-owned policy; bounded Ralph retry only when resumable. | Failure distribution and duration. |
      | BUILD MUST-37 trip | `watchdog_limit` | Preserve step output and stop at recovery. | Build guard trip; never Ralph success. |
      | BABYSIT no-progress/MAX_ITERS | `no_progress` or `watchdog_limit` | Preserve babysit state and wake/recovery action. | Convergence and recovery, not a generic code failure. |
      | CI/LLM audit verdict MISSING | `audit_evidence_missing` | Keep review unresolved; do not ship/approve from missing data. | Insufficient evidence. |
      | State snapshot corrupt | `checkpoint_corrupt` | Replay valid events; if replay fails, recovery with original artifacts. | Snapshot integrity and recovery. |
      | Event write/lock/fsync failure | `observability.degraded` | Keep last valid checkpoint; fail closed for safety-critical transition. | Degraded evidence; no success claim. |
      | Stale/concurrent worker | `stale_lease` / `guard.blocked` | One worker recovers or operator decides; never dual dispatch. | Lease conflict and guard safety. |
      | Unsafe cleanup path | `cleanup_target_rejected` | Refuse deletion; retain worktree and ask for recovery at the allowed boundary. | Must be zero in safety gate. |
      | Green PR awaiting merge | `terminal.reached` outcome `USER_MERGE_REQUIRED` | Stop and hand off to human `gh pr merge`. | Expected terminal, separate from DONE. |

      The recovery output must contain: run id, last verified checkpoint,
      active/interrupted attempt, failure class, first useful artifact path,
      bounded log excerpt, next safe command, and whether a human decision is
      required. It must not instruct the next worker to “just retry” without
      an idempotency and evidence check.

  - title: Rollout, verification, and rollback
    body: |
      ### Phase 0 — observe only

      Add the event adapter and pure reducer. Wrap existing Ralph dispatches
      without changing stage order or retries. Compare projected metrics with
      current state/child outcomes. Acceptance: no workflow exit-code change,
      no prompt/merge-policy change, and 100% of synthetic events have stable
      parent links.

      ### Phase 1 — durable checkpoint

      Add schema validation, checkpoint sequence, active-attempt recovery,
      lease, and `resume`. Keep the legacy traversal as a feature-flagged
      fallback. Acceptance: kill the process before and after each of
      BUILD/BABYSIT/SHIP dispatch; recovery never duplicates a verified
      terminal side effect and never reports an open attempt as success.

      ### Phase 2 — controlled loop

      Enable progress fingerprints, stored backoff, stage/deadline budgets,
      and explicit retry classification for resumable child results. Existing
      child guard limits remain unchanged. Acceptance: no busy loop, bounded
      attempts, stale worker cannot dispatch, and rollback to legacy mode is
      one environment/config change.

      ### Phase 3 — operational report

      Add `ralph_drive.sh events` and `metrics`, derived progress rendering,
      and the metric coverage/release gates. Acceptance: reports are
      reproducible from a copied event journal and show insufficient evidence
      for truncated/missing records.

      ### Phase 4 — improvement experiments

      Use shadow policy comparisons to test one change at a time (for example,
      backoff or diagnosis strategy). Any metric-driven policy change gets a
      separate proposal, explicit safety thresholds, and a rollback. No
      self-modifying or LLM-only control policy is included here.

      Verification commands for the implementation PR should include the
      focused Ralph/event/metric suites, existing executor and babysit suites,
      `git diff --check`, hook/worktree policy checks, and one end-to-end noop
      run with a captured event journal. The PR must quote actual exit codes,
      test counts, and metric coverage rather than a prose “all green”.

  - title: Issue plan and acceptance checklist
    body: |
      Proposed GitHub issues after this proposal is accepted:

      1. **RLE-00 — Align stage and terminal ownership (P0).** Reproduce with
         a successful real dispatch and assert whether SHIP runs before
         `USER_MERGE_REQUIRED`; update the public contract, state transition,
         and metrics so a skipped stage is explicit and intentional.
      2. **RLE-01 — Make Ralph checkpoint resume real (P0).** Reproduce by
         persisting `sub_stage=BABYSIT`, restarting, and asserting BUILD is not
         dispatched. Add crash-boundary and schema-corruption tests.
      3. **RLE-02 — Add Ralph lifecycle/failure evidence (P0).** Reproduce by
         forcing timeout/exception/audit-MISSING and inspecting event ids,
         refs, redaction, and interrupted-attempt recovery.
      4. **RLE-03 — Activate bounded controller semantics (P1).** Reproduce a
         changed and unchanged failure fingerprint; assert progress advances,
         no-progress backs off, and limits land in recovery.
      5. **RLE-04 — Add Ralph metric projection and CLI (P1).** Reproduce from
         a fixture journal; assert formulas, dimensions, coverage, and
         expected USER_MERGE_REQUIRED handling.
      6. **RLE-05 — Run shadow improvement experiment (P2).** Reproduce a
         legacy-vs-controlled comparison; accept only if reliability and
         safety metrics do not regress. This issue must not mutate production
         control policy by itself.

      Definition of done for the first two issues:

      - [ ] A single `run_id` joins state, attempt events, child artifacts,
            progress, and metrics.
      - [ ] A process kill at every stage boundary produces an explicit
            interrupted/recovery record and a deterministic next action.
      - [ ] No event or metric treats missing audit/review evidence as green.
      - [ ] Logs are bounded, redacted, append-only, idempotent, and safe under
            invalid/symlinked/broad cleanup paths.
      - [ ] Existing attended_lock, worktree isolation, review, and human
            merge tests remain green.
      - [ ] Legacy mode remains available until the baseline and rollback
            review are complete.
      - [ ] `/do` route identity and directive version are preserved for the
            entire Ralph run.
      - [ ] Static guard decisions are observed from the SSOT, never
            reimplemented or overridden by Ralph.
      - [ ] No full prompt/transcript is persisted in Ralph events or
            handoffs; bounded context metrics report missing usage honestly.

  - title: References and relationship to existing Ralph proposal
    body: |
      This is a follow-up to the intent-first/autonomy proposal implemented
      around commit `5f3592759fea8d7a0973cc3d930d86d2c22f85a1` and PR #844.
      That proposal establishes the gates, attended lock, and basic safety
      valves. It explicitly leaves silent doom loops, recovery re-entry, and
      streaming/measurement gaps open. This proposal narrows the next change
      to the control/evidence/measurement architecture; it does not reopen
      the gate-count or Linear-scope decisions.

      Internal SSOT:

      - `iron-laws/index.md` — verification, evidence, safety, and state rules
      - `rules/git-workflow.md` — worktree, handoff, commit, and PR contract
      - `skills/ralph/lib/ralph_state.py` — current Ralph state machine
      - `skills/ralph/lib/ralph_chain.py` — current attended dispatcher
      - `skills/babysit-pr/SKILL.md` and `lib/babysit_pr_loop.py` — child repair loop
      - `lib/execute.py` — real child output and executor evidence events
      - `lib/trace_log.py` — structured trajectory event contract
      - `lib/effectiveness_collection.py` — bounded journal/projection durability pattern
      - `lib/harness_effectiveness.py` — evidence-based metric conventions
      - `docs/skills/ralph.md` and `docs/proposals/review/ralph-autonomy/main.yaml` — current public contract
      - `tests/test_ralph_chain.py`, `tests/test_babysit_pr_loop.py` — current regression boundaries
