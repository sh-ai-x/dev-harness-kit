title: "OKF 도입 검토 — 전면 도입 Reject, cherry-pick 1건"
status: ready-for-review
date: 2026-08-19
tags: [okf, docs, adoption, thin-harness]

before:
  summary: |
    dev-harness-kit의 AI-read 문서 층은 이미 포인터 + on-demand 링크 + index 파일
    구조로 동작한다. OKF가 표준화하려는 progressive-disclosure 패턴과 사실상 동일하다.
    OKF가 추가로 요구하는 것의 핵심은 전 문서 frontmatter(`type`)인데, 그 필드를
    실제로 소비하는 런타임이 이 저장소에 없다.
  evidence:
    - '`CLAUDE.md` = `AGENTS.md` = 899 B 포인터 (`lib/write_project_md.py` auto-generated)'
    - 'index 파일 4개 실존: `hooks/`, `iron-laws/`, `rules/`, `guidelines/`'
    - '`docs/` md 107개 · 656,633 B, 그중 YAML frontmatter 보유 1개'
    - 'md 총 231개 (`.worktrees/`, `.claude/worktrees/`, `.venv*` 제외)'
    - '`docs/decisions/0001-no-mcp.md:15` — "intentional, not deferred"'

after:
  summary: |
    OKF 전면 도입은 reject. 9개 스펙 요소를 개별 판정하고 reject 사유를 반증 조건과
    함께 기록한다. 채택은 lifecycle `stale_after` 1건으로 한정, 적용 범위는 이미
    frontmatter를 가진 `rules/*.md` 5개로 묶어 thin-harness 게이트(prompt-token
    delta ≤ 0)를 실측으로 통과시킨다.
  files:
    - path: docs/proposals/okf-adoption/00-index.yaml
      change: |
        판정 요약 + 측정 기준선 + 하위 문서 네비게이션.
    - path: docs/proposals/okf-adoption/01-what-is-okf.yaml
      change: |
        OKF v0.1/v0.2 스펙 사실관계 + 1차 출처 인용.
    - path: docs/proposals/okf-adoption/02-rejection-rationale.yaml
      change: |
        reject/defer 8건의 사유 · 반증 조건 · 대안 매핑.
    - path: docs/proposals/okf-adoption/03-cherry-pick.yaml
      change: |
        채택 1건(`stale_after`)의 범위 · 바이트 실측 delta · 게이트 배선안.

pros:
  - '판정 근거가 실측치로 고정된다 — 모든 수치를 재현 가능한 명령으로 남김'
  - 'reject 6건 + defer 2건에 각각 반증 조건이 붙어 재검토가 처음부터 다시 조사하지 않고 끝난다'
  - '채택 범위가 1건 · 5파일로 좁아 thin-harness 게이트를 실측 통과 (−138 ~ −228 B)'

cons:
  - '부분 채택은 OKF conformance를 주장하지 못한다 — validator / visualizer / `kcmd` 이득 전부 포기 (의식적 수용)'
  - 'frontmatter 스키마가 두 갈래가 된다: SKILL.md 계열(dev-kit 자체) + rules 계열(OKF 어휘 1개)'
  - '2026 Q3 cherry-pick 예산 2건 중 1건 소모'

sections:
  - title: 판정
    body: |
      | 판정 | 건수 | 대상 |
      |---|---|---|
      | **Adopt** | 1 | lifecycle `stale_after`, `rules/*.md` 5개 한정 |
      | **Defer** | 2 | provenance `sources`, trust `generated`/`verified` |
      | **Reject** | 6 | 나머지 (사유는 [02-rejection-rationale.html](02-rejection-rationale.html)) |

      **전면 도입 = Reject.** 사유 3줄:

      1. **소비자 부재** — Claude Code / Codex는 OKF bundle을 자동 discovery하지
         않는다 (FAQ: "discovery is intentionally explicit"). 유일한 공식 경로
         `kcmd`는 MCP 서버이며 `0001-no-mcp.md` 로 이미 차단됐다.
      2. **thin-harness 게이트 실패** — conformance §11이 비예약 `.md` 전부에
         non-empty `type`을 요구. `docs/` 106파일 · 최소 2.3 KB 순증, 상계 0.
      3. **스펙 불안정** — v0.1 발표 후 2개월 만에 v0.2에서 breaking 2건
         (`timestamp`→`generated.at`, body `# Citations`→`sources`). FAQ가
         abandonment risk를 스스로 경고.

      상세 근거: [01-what-is-okf.html](01-what-is-okf.html) (스펙 사실관계),
      [02-rejection-rationale.html](02-rejection-rationale.html) (reject 사유),
      [03-cherry-pick.html](03-cherry-pick.html) (채택 설계).

  - title: 측정 기준선 (재현 명령)
    body: |
      `origin/main` = `222c02b` 기준.

      ```bash
      find . -name "*.md" -not -path "./.worktrees/*" \
        -not -path "./.claude/worktrees/*" -not -path "*/.venv*/*" | wc -l
      # → 231

      find . -name "*.md" -not -path "./.worktrees/*" \
        -not -path "./.claude/worktrees/*" -not -path "*/.venv*/*" \
        | awk -F/ '{print $2}' | sort | uniq -c | sort -rn
      # → docs 107 / skills 49 / eval 16 / rules 6 / hooks 6 / commands 6 ...

      find docs -name "*.md" -exec cat {} + | wc -c
      # → 656633

      find . -name "*.md" -not -path "./.worktrees/*" \
        -not -path "./.claude/worktrees/*" -not -path "*/.venv*/*" -print0 \
        | xargs -0 awk 'FNR==1 && /^---[[:space:]]*$/ {print FILENAME} FNR>1{nextfile}'
      # → skills 42 / .codex 7 / .claude 7 / commands 6 / rules 5 / docs 1
      ```

      핵심 비대칭: **`skills/` frontmatter 100%, `docs/` 0.9%.** OKF가 메우겠다는
      갭은 `docs/`에만 있고, `docs/`는 세션마다 로드되는 층이 아니라 링크 on-demand로
      읽히는 층이다.

  - title: 이미 동작하는 것
    body: |
      OKF의 progressive disclosure(`index.md`) 패턴과 권장 frontmatter 필드의 부분집합은
      이 저장소에서 OKF 이전부터 동작한다. 도입으로 얻는 구조적 이득 0이다.

      | OKF 규약 | dev-kit 기존 |
      |---|---|
      | bundle-root pointer | `CLAUDE.md`/`AGENTS.md` (899 B) |
      | 하위 디렉터리 index | `hooks/` `iron-laws/` `rules/` `guidelines/` 의 `index.md` |
      | frontmatter `title`/`description` | SKILL.md `name`/`description`/`when_to_use` |
      | 로그 | `CHANGELOG.md` |
